<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <radialGradient id="glow" cx="400" cy="160" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
    <polygon id="checkpoint" points="0,-3.5 3.5,0 0,3.5 -3.5,0"/>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="#0F1117"/>
  <rect width="800" height="320" fill="url(#grid)" opacity="0.5"/>

  <!-- Glow centered on illustration -->
  <circle cx="400" cy="160" r="300" fill="url(#glow)"/>

  <!-- ===== TOP HEADER: name + tagline + badge ===== -->

  <line x1="40" y1="28" x2="140" y2="28" stroke="#6366F1" stroke-width="2"/>
  <text x="40" y="50"
        font-family="'SF Mono','Consolas','Monaco',monospace"
        font-size="22" font-weight="700" fill="#F8FAFC" letter-spacing="2">CONVERGE</text>
  <text x="230" y="50"
        font-family="'Inter','Segoe UI','Helvetica Neue',sans-serif"
        font-size="11" fill="#64748B" letter-spacing="0.5">Define done. Converge gets there.</text>
  <rect x="540" y="38" width="130" height="20" rx="3" fill="#1E293B"/>
  <text x="549" y="52" font-family="'SF Mono','Consolas','Monaco',monospace" font-size="9" fill="#64748B">gap-driven convergence</text>

  <!-- ===== MAIN SPINE (full-width, y=130) ===== -->

  <!-- Spine: solved portion (solid indigo, Current → CP-1) -->
  <line x1="70" y1="130" x2="240" y2="130"
        stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Spine: in-progress portion (dashed, CP-1 → CP-2) -->
  <line x1="240" y1="130" x2="460" y2="130"
        stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10,5" opacity="0.6"/>
  <!-- Spine: unsolved portion (dashed dim, CP-2 → CP-3) -->
  <line x1="460" y1="130" x2="620" y2="130"
        stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,7" opacity="0.3"/>
  <!-- Spine: unsolved portion (dashed dim, CP-3 → Target) -->
  <line x1="620" y1="130" x2="740" y2="130"
        stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5,7" opacity="0.3"/>

  <!-- ===== FAN-OUT 1 EDGES (CP-1 at x=240, solved, indigo) ===== -->

  <!-- CP-1 → 1a -->
  <path d="M 240,138 L 240,170 L 200,170 L 200,195"
        fill="none" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- CP-1 → 1b -->
  <path d="M 240,138 L 240,195"
        fill="none" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- CP-1 → 1c -->
  <path d="M 240,138 L 240,170 L 280,170 L 280,195"
        fill="none" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

  <!-- 1a → 1a-i -->
  <path d="M 200,205 L 200,230 L 186,230 L 186,255"
        fill="none" stroke="#6366F1" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <!-- 1a → 1a-ii -->
  <path d="M 200,205 L 200,230 L 214,230 L 214,255"
        fill="none" stroke="#6366F1" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

  <!-- ===== FAN-OUT 2 EDGES (CP-2 at x=460, in-progress, violet) ===== -->

  <!-- CP-2 → 2a -->
  <path d="M 460,138 L 460,170 L 420,170 L 420,195"
        fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- CP-2 → 2b -->
  <path d="M 460,138 L 460,195"
        fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- CP-2 → 2c -->
  <path d="M 460,138 L 460,170 L 500,170 L 500,195"
        fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

  <!-- 2b → 2b-i -->
  <path d="M 460,205 L 460,230 L 446,230 L 446,255"
        fill="none" stroke="#A78BFA" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <!-- 2b → 2b-ii -->
  <path d="M 460,205 L 460,230 L 474,230 L 474,255"
        fill="none" stroke="#A78BFA" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

  <!-- ===== FAN-OUT 3 EDGES (CP-3 at x=620, unsolved, red dim) ===== -->

  <!-- CP-3 → 3a -->
  <path d="M 620,138 L 620,170 L 600,170 L 600,195"
        fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- CP-3 → 3b -->
  <path d="M 620,138 L 620,170 L 640,170 L 640,195"
        fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- ===== DIAMOND CHECKPOINTS at fan-out forks ===== -->
  <use href="#checkpoint" x="240" y="170" fill="#6366F1" opacity="0.7"/>
  <use href="#checkpoint" x="460" y="170" fill="#A78BFA" opacity="0.7"/>
  <use href="#checkpoint" x="620" y="170" fill="#EF4444" opacity="0.5"/>
  <!-- L3 fork diamonds -->
  <use href="#checkpoint" x="200" y="230" fill="#6366F1" opacity="0.6"/>
  <use href="#checkpoint" x="460" y="230" fill="#A78BFA" opacity="0.6"/>

  <!-- ===== GLOW HALOS ===== -->
  <circle cx="240" cy="130" r="18" fill="#22C55E" opacity="0.06"/>
  <circle cx="200" cy="200" r="12" fill="#22C55E" opacity="0.06"/>
  <circle cx="240" cy="200" r="12" fill="#22C55E" opacity="0.06"/>
  <circle cx="280" cy="200" r="12" fill="#22D3EE" opacity="0.06"/>
  <circle cx="186" cy="258" r="9" fill="#22C55E" opacity="0.06"/>
  <circle cx="214" cy="258" r="9" fill="#22D3EE" opacity="0.06"/>
  <circle cx="420" cy="200" r="12" fill="#22C55E" opacity="0.06"/>
  <circle cx="750" cy="130" r="20" fill="#22D3EE" opacity="0.06"/>

  <!-- ===== SPINE NODES ===== -->

  <!-- Current — red hollow -->
  <circle cx="60" cy="130" r="12" fill="none" stroke="#EF4444" stroke-width="2"/>

  <!-- CP-1 — solved, green -->
  <circle cx="240" cy="130" r="8" fill="#22C55E"/>

  <!-- CP-2 — in-progress, violet -->
  <circle cx="460" cy="130" r="8" fill="#A78BFA"/>

  <!-- CP-3 — unsolved, red hollow -->
  <circle cx="620" cy="130" r="8" fill="none" stroke="#EF4444" stroke-width="1.5"/>

  <!-- Target — cyan + checkmark -->
  <circle cx="750" cy="130" r="12" fill="#22D3EE"/>
  <polyline points="744,130 748,134 756,125"
            fill="none" stroke="#0F1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== FAN-OUT 1 NODES (solved) ===== -->

  <!-- 1a — green -->
  <circle cx="200" cy="200" r="6" fill="#22C55E"/>
  <!-- 1b — green -->
  <circle cx="240" cy="200" r="6" fill="#22C55E"/>
  <!-- 1c — cyan + check -->
  <circle cx="280" cy="200" r="6" fill="#22D3EE"/>
  <polyline points="276,200 279,203 284,197"
            fill="none" stroke="#0F1117" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- L3: 1a-i — green -->
  <circle cx="186" cy="258" r="4" fill="#22C55E"/>
  <!-- L3: 1a-ii — cyan + check -->
  <circle cx="214" cy="258" r="4" fill="#22D3EE"/>
  <polyline points="211,258 213,260 217,256"
            fill="none" stroke="#0F1117" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== FAN-OUT 2 NODES (in-progress) ===== -->

  <!-- 2a — green -->
  <circle cx="420" cy="200" r="6" fill="#22C55E"/>
  <!-- 2b — violet -->
  <circle cx="460" cy="200" r="6" fill="#A78BFA"/>
  <!-- 2c — red hollow -->
  <circle cx="500" cy="200" r="6" fill="none" stroke="#EF4444" stroke-width="1.5"/>

  <!-- L3: 2b-i — violet -->
  <circle cx="446" cy="258" r="4" fill="#A78BFA"/>
  <!-- L3: 2b-ii — red hollow -->
  <circle cx="474" cy="258" r="4" fill="none" stroke="#EF4444" stroke-width="1"/>

  <!-- ===== FAN-OUT 3 NODES (unsolved) ===== -->

  <!-- 3a — red hollow -->
  <circle cx="600" cy="200" r="6" fill="none" stroke="#EF4444" stroke-width="1.5"/>
  <!-- 3b — red hollow -->
  <circle cx="640" cy="200" r="6" fill="none" stroke="#EF4444" stroke-width="1.5"/>

  <!-- ===== "current" / "target" LABELS ===== -->
  <text x="60" y="110" text-anchor="middle"
        font-family="'SF Mono','Consolas','Monaco',monospace" font-size="10" fill="#94A3B8">current</text>
  <text x="750" y="110" text-anchor="middle"
        font-family="'SF Mono','Consolas','Monaco',monospace" font-size="10" fill="#94A3B8">target</text>

  <!-- ===== AGENT LABELS ===== -->
  <text x="286" y="214" font-family="'SF Mono','Consolas','Monaco',monospace" font-size="8" fill="#475569">agent/claude</text>
  <text x="426" y="214" font-family="'SF Mono','Consolas','Monaco',monospace" font-size="8" fill="#475569">agent/gemini</text>
  <text x="446" y="274" font-family="'SF Mono','Consolas','Monaco',monospace" font-size="8" fill="#475569">agent/kimi</text>
  <text x="606" y="214" font-family="'SF Mono','Consolas','Monaco',monospace" font-size="8" fill="#475569">agent/qwen</text>

  <!-- ===== DECORATIVE ===== -->
  <rect x="0" y="316" width="800" height="4" fill="#6366F1" opacity="0.6"/>

  <!-- Corner brackets -->
  <path d="M 16,16 L 16,8 L 24,8" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M 784,16 L 784,8 L 776,8" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M 16,304 L 16,312 L 24,312" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M 784,304 L 784,312 L 776,312" fill="none" stroke="#334155" stroke-width="1.5"/>
</svg>
