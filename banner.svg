<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" fill="none">
  <!-- Mark: a 3-node DAG (two parents converging into one child) -->
  <g transform="translate(40, 36)">
    <!-- Edges -->
    <line x1="12" y1="12" x2="36" y2="36" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="12" x2="36" y2="36" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nodes: two upstream (open) and one downstream (filled) -->
    <circle cx="12" cy="12" r="6" fill="none" stroke="#6366F1" stroke-width="2.5"/>
    <circle cx="60" cy="12" r="6" fill="none" stroke="#6366F1" stroke-width="2.5"/>
    <circle cx="36" cy="36" r="8" fill="#6366F1"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="74"
        font-family="'SF Mono','JetBrains Mono','Consolas','Monaco',monospace"
        font-size="48" font-weight="700" fill="#6366F1" letter-spacing="-1">Converge</text>
</svg>
