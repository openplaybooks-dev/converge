<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" role="img" aria-label="Converge — Autonomous AI Agent Playbooks. Plan, Execute, Verify, Repair. Supports Claude, Gemini, Kimi, Qwen.">
  <defs>
    <!-- Background gradient: deep indigo → violet -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <!-- Subtle dot grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>

    <!-- Glow filter for the converged node -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Wordmark gradient: indigo → violet → fuchsia -->
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- ============================================================
       LEFT SIDE: DAG MARK (3-node converging graph, ~300px wide)
       ============================================================ -->
  <g transform="translate(80, 110)">
    <!-- Wave labels (RED / YELLOW / GREEN) above each upstream node -->
    <text x="0"   y="-12" font-family="ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#F87171">RED</text>
    <text x="80"  y="-12" font-family="ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#FBBF24">YELLOW</text>
    <text x="180" y="-12" font-family="ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#34D399">GREEN</text>

    <!-- Edges from three upstream nodes converging into one -->
    <line x1="14"  y1="14" x2="120" y2="120" stroke="#F87171" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="94"  y1="14" x2="120" y2="120" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="194" y1="14" x2="120" y2="120" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>

    <!-- Upstream nodes (open rings, RED/YELLOW/GREEN) -->
    <circle cx="14"  cy="14" r="9" fill="#0F172A" stroke="#F87171" stroke-width="3"/>
    <circle cx="94"  cy="14" r="9" fill="#0F172A" stroke="#FBBF24" stroke-width="3"/>
    <circle cx="194" cy="14" r="9" fill="#0F172A" stroke="#34D399" stroke-width="3"/>

    <!-- Converged node (filled, glowing) -->
    <circle cx="120" cy="120" r="16" fill="#A78BFA" filter="url(#glow)"/>
    <circle cx="120" cy="120" r="16" fill="#C4B5FD"/>

    <!-- Checkmark inside the converged node -->
    <path d="M 112 120 L 118 126 L 130 114" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- "CONVERGED" caption beneath the node -->
    <text x="120" y="170" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#C4B5FD">CONVERGED</text>
  </g>

  <!-- ============================================================
       RIGHT SIDE: WORDMARK + TAGLINE + STAGES + PROVIDERS
       ============================================================ -->
  <g transform="translate(380, 0)">
    <!-- Wordmark -->
    <text x="0" y="135"
          font-family="ui-sans-serif,-apple-system,'SF Pro Display','Inter',system-ui,sans-serif"
          font-size="96" font-weight="800" letter-spacing="-3"
          fill="url(#wordmark)">Converge</text>

    <!-- Tagline -->
    <text x="3" y="180"
          font-family="ui-sans-serif,-apple-system,'SF Pro Display','Inter',system-ui,sans-serif"
          font-size="22" font-weight="500" letter-spacing="-0.3"
          fill="#E0E7FF">Autonomous AI Agent Playbooks</text>

    <!-- Sub-tagline -->
    <text x="3" y="210"
          font-family="ui-sans-serif,-apple-system,'SF Pro Display','Inter',system-ui,sans-serif"
          font-size="15" font-weight="400" letter-spacing="0"
          fill="#A5B4FC">Long-running, verifiable, multi-agent workflows for AI coding agents.</text>

    <!-- Stage pills: Plan · Execute · Verify · Repair · Ship -->
    <g transform="translate(3, 240)">
      <!-- Plan -->
      <rect x="0" y="0" width="64" height="28" rx="14" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
      <text x="32" y="19" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1" fill="#A5B4FC">PLAN</text>

      <!-- arrow -->
      <text x="72" y="20" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" fill="#6366F1">→</text>

      <!-- Execute -->
      <rect x="88" y="0" width="84" height="28" rx="14" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="130" y="19" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1" fill="#C4B5FD">EXECUTE</text>

      <text x="178" y="20" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" fill="#8B5CF6">→</text>

      <!-- Verify -->
      <rect x="194" y="0" width="76" height="28" rx="14" fill="#1E1B4B" stroke="#A855F7" stroke-width="1.5"/>
      <text x="232" y="19" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1" fill="#DDD6FE">VERIFY</text>

      <text x="276" y="20" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" fill="#A855F7">→</text>

      <!-- Repair -->
      <rect x="292" y="0" width="76" height="28" rx="14" fill="#1E1B4B" stroke="#D946EF" stroke-width="1.5"/>
      <text x="330" y="19" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1" fill="#F0ABFC">REPAIR</text>

      <text x="374" y="20" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" fill="#D946EF">→</text>

      <!-- Ship -->
      <rect x="390" y="0" width="64" height="28" rx="14" fill="#A78BFA" stroke="#A78BFA" stroke-width="1.5"/>
      <text x="422" y="19" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" font-weight="800" letter-spacing="1" fill="#1E1B4B">SHIP ✓</text>
    </g>

    <!-- Provider chips: Claude · Gemini · Kimi · Qwen -->
    <g transform="translate(3, 296)">
      <text x="0" y="14" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#818CF8">PROVIDERS</text>

      <g transform="translate(0, 26)">
        <!-- Claude -->
        <rect x="0" y="0" width="86" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
        <circle cx="14" cy="16" r="4" fill="#D97757"/>
        <text x="26" y="21" font-family="ui-sans-serif,'Inter',system-ui,sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Claude</text>

        <!-- Gemini -->
        <rect x="98" y="0" width="86" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
        <circle cx="112" cy="16" r="4" fill="#4285F4"/>
        <text x="124" y="21" font-family="ui-sans-serif,'Inter',system-ui,sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Gemini</text>

        <!-- Kimi -->
        <rect x="196" y="0" width="76" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
        <circle cx="210" cy="16" r="4" fill="#1FB1A6"/>
        <text x="222" y="21" font-family="ui-sans-serif,'Inter',system-ui,sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Kimi</text>

        <!-- Qwen -->
        <rect x="284" y="0" width="80" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
        <circle cx="298" cy="16" r="4" fill="#A259FF"/>
        <text x="310" y="21" font-family="ui-sans-serif,'Inter',system-ui,sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Qwen</text>
      </g>
    </g>
  </g>

  <!-- Subtle bottom accent line -->
  <line x1="0" y1="399" x2="1200" y2="399" stroke="url(#wordmark)" stroke-width="2" stroke-opacity="0.4"/>
</svg>
