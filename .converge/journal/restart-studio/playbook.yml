name: restart-studio
description: |
  Build packages/studio from scratch — fresh Mission Control fork at upstream
  a020d1b7d045e0e09616663ffb39963f432a3f4c, with the working converge data
  layer + API routes copied in from /tmp/converge-studio-rescue/. Rebinds
  MC's polished surface to converge data sources. The old packages/converge-studio
  has already been dropped; we build into packages/studio/ directly with no
  atomic-swap dance.

run:
  mode: oneoff
  maxIterations: 250
  maxTaskAttempts: 3
  maxDuration: 8h
  resume: true
  stall:
    maxConsecutive: 3
    backoffMs: 30000

checks:
  - id: studio-package-exists
    description: packages/studio is @converge/studio with the right SHA
    cmd: "test -f packages/studio/package.json && node -e \"process.exit(require('./packages/studio/package.json').name==='@converge/studio'?0:1)\" && grep -q '^a020d1b7' packages/studio/UPSTREAM_SHA"

  - id: data-layer-present
    description: All 8 converge-adapter files are present
    cmd: "for f in paths playbooks tasks sessions watcher frontmatter schedule index; do test -f packages/studio/src/lib/converge-adapter/$f.ts || exit 1; done"

  - id: api-routes-present
    description: All 7 converge-native API route directories exist
    cmd: "for d in playbooks runs run watch events search settings; do test -d packages/studio/src/app/api/$d || exit 1; done"

  - id: design-tokens-present
    description: globals.css contains the oklch palette
    cmd: "grep -q 'oklch(' packages/studio/src/app/globals.css"

  - id: typecheck-clean
    description: Studio typecheck has zero errors
    cmd: "pnpm --filter @converge/studio typecheck 2>&1 | grep -c 'error TS' | xargs test 0 -eq"
