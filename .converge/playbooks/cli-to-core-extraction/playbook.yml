---
name: cli-to-core-extraction
description: Extract orchestration logic from packages/cli into packages/core so @openplaybooks/converge-core exposes a programmatic
  API (runAutonomous, runPlaybook). 4 sub-tiers; ~4k lines moved; CLI becomes a thin UI layer.
run:
  mode: oneoff
  maxIterations: 80
  maxTaskAttempts: 3
  maxDuration: 4h
  resume: true
  stall:
    maxConsecutive: 3
    backoffMs: 30000
goals:
  - id: core-typecheck
    description: Zero TypeScript errors in @openplaybooks/converge-core
    checks:
      - id: check
        cmd: cd packages/core && pnpm typecheck 2>&1 | grep -c 'error TS' | xargs test 0 -eq
  - id: cli-typecheck
    description: Zero TypeScript errors in @openplaybooks/converge-cli
    checks:
      - id: check
        cmd: cd packages/cli && pnpm typecheck 2>&1 | grep -c 'error TS' | xargs test 0 -eq
  - id: cli-builds
    description: CLI compiles against the new core surface
    checks:
      - id: check
        cmd: pnpm -F @openplaybooks/converge-cli build 2>&1 | tail -5
  - id: cli-smoke
    description: converge --help runs without error
    checks:
      - id: check
        cmd: node packages/cli/dist/index.js --help >/dev/null 2>&1
  - id: core-no-console
    description: Moved orchestration code in core never calls console.* (logger contract)
    checks:
      - id: check
        cmd: test -z "$(find packages/core/src/runner packages/core/src/planning packages/core/src/locks
          packages/core/src/checkpoint/reconcile.ts -type f 2>/dev/null | xargs grep -l 'console\.' 2>/dev/null)"
  - id: core-no-process-exit
    description: Moved orchestration code in core never calls process.exit (returns/throws instead)
    checks:
      - id: check
        cmd: test -z "$(find packages/core/src/runner packages/core/src/planning packages/core/src/locks
          packages/core/src/checkpoint/reconcile.ts -type f 2>/dev/null | xargs grep -l 'process\.exit' 2>/dev/null)"
  - id: core-no-chalk
    description: Moved orchestration code in core has no chalk/ANSI dependency
    checks:
      - id: check
        cmd: test -z "$(find packages/core/src/runner packages/core/src/planning packages/core/src/locks
          packages/core/src/checkpoint/reconcile.ts -type f 2>/dev/null | xargs grep -l 'chalk' 2>/dev/null)"
  - id: core-no-global-back-channels
    description: No (global as any).__CONVERGE_*__ back-channels in core
    checks:
      - id: check
        cmd: test -z "$(grep -rln '__CONVERGE_LAST_BAIL__\|__CONVERGE_CURRENT_TASK__' packages/core/src 2>/dev/null)"
  - id: cli-does-not-own-runner
    description: CLI no longer owns the orchestration loop, task selection, reconciliation, or playbook lock
    checks:
      - id: check
        cmd: "! test -f packages/cli/src/autonomous-run.ts && ! test -f packages/cli/src/next-task.ts && ! test -f
          packages/cli/src/reconcile.ts && ! test -f packages/cli/src/playbook-lock.ts"

