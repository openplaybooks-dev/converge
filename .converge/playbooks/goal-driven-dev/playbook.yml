name: goal-driven-dev
description: >-
  Production-ready goal-driven development. Goal engineering over workflow
  engineering — each goal is a verified, working state of the product.
  Goals declare dependencies and acceptance checks. The system builds
  whatever is needed to satisfy goals. Goals are adaptive — new goals
  emerge as data reveals patterns worth investigating.

run:
  maxIterations: 50
  maxTaskAttempts: 3
  maxDuration: 12h
  resume: true
  stall:
    maxConsecutive: 3
    backoffMs: 30000

goals:
  - id: data-pipeline
    description: "Fetch Polymarket markets via gamma-api.polymarket.com, store in SQLite. Track markets, prices, volume, liquidity, resolution status. Daily refresh script."
    checks:
      - {id: markets-table, cmd: "sqlite3 data/polymarket.db 'SELECT COUNT(*) FROM markets' 2>&1 | grep -v '^0$'"}
      - {id: prices-table, cmd: "sqlite3 data/polymarket.db 'SELECT COUNT(*) FROM prices' 2>&1 | grep -v '^0$'"}
      - {id: fetch-works, cmd: "node scripts/fetch-markets.mjs 2>&1 | grep -q 'markets fetched'"}

  - id: market-dashboard
    description: "Next.js dashboard: markets table (sortable), price sparklines (24h/7d), market detail pages, category filters, search"
    checks:
      - {id: app-loads, cmd: "curl -s localhost:3000 2>&1 | grep -q AlphaScan"}
      - {id: api-markets, cmd: "curl -s localhost:3000/api/markets 2>&1 | jq -e '. | length > 0'"}
      - {id: dashboard-e2e, cmd: "npx playwright test tests/dashboard.spec.ts 2>&1"}

  - id: pattern-detection
    description: "Statistical scanner: arbitrage detection, momentum signals, mean reversion, resolution yield. Results in signals table."
    checks:
      - {id: signals-table, cmd: "sqlite3 data/polymarket.db 'SELECT COUNT(*) FROM signals' 2>&1 | grep -v '^0$'"}
      - {id: api-signals, cmd: "curl -s localhost:3000/api/signals 2>&1 | jq -e '. | length > 0'"}
      - {id: scanner-runs, cmd: "node scripts/run-scanner.mjs 2>&1 | grep -q 'signals found'"}

  - id: backtesting-engine
    description: "Strategy backtester: define rules, run against history, output P&L/Sharpe/win-rate/max-drawdown per strategy"
    checks:
      - {id: backtest-runs, cmd: "node scripts/backtest.mjs --strategy momentum --days 90 2>&1 | grep -q Sharpe"}
      - {id: api-results, cmd: "curl -s localhost:3000/api/backtest/results 2>&1 | jq -e '. | length > 0'"}
      - {id: results-table, cmd: "sqlite3 data/polymarket.db 'SELECT COUNT(*) FROM backtest_results' 2>&1 | grep -v '^0$'"}

  - id: alpha-discovery
    description: "ML-assisted pattern discovery: cluster winning trades, feature importance, alert engine, strategy recommendations"
    checks:
      - {id: strategies-found, cmd: "curl -s localhost:3000/api/alpha/strategies 2>&1 | jq -e '. | length > 0'"}
      - {id: discover-runs, cmd: "node scripts/discover-alpha.mjs 2>&1 | grep -q 'strategies found'"}
      - {id: recommendations-exist, cmd: "test -f data/alpha/strategy-recommendations.json"}

  - id: portfolio-analytics
    description: "Portfolio tracking: position sizing (Kelly), risk metrics (VaR/Sharpe/drawdown), performance attribution, correlation matrix"
    checks:
      - {id: sharpe-calculated, cmd: "curl -s localhost:3000/api/portfolio/metrics 2>&1 | jq -e '.sharpe'"}
      - {id: var-calculated, cmd: "node scripts/calc-risk.mjs 2>&1 | grep -q VaR"}
      - {id: portfolio-e2e, cmd: "npx playwright test tests/portfolio.spec.ts 2>&1"}

tasks:
  - path: build
