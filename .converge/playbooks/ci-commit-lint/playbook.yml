---
name: ci-commit-lint
description: Verify every commit in the PR against the CLAUDE.md commit-message convention and propose corrections.
goals:
  - id: verdict-exists
    description: A lint verdict file was produced.
    checks:
      - id: file
        cmd: "test -s .converge/playbooks/ci-commit-lint/output/lint-verdict.md"
  - id: verdict-line
    description: The verdict file ends with an OVERALL line.
    checks:
      - id: line
        cmd: "grep -qE '^OVERALL: (PASS|FAIL)' .converge/playbooks/ci-commit-lint/output/lint-verdict.md"
