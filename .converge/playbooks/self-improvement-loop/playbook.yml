name: self-improvement-loop
description: >
  Test-driven autonomous framework hardening loop for Converge. Each epoch
  behaves like a senior maintainer: inspect real failures, choose one focused
  regression or cleanup, implement the smallest correct framework/API change,
  run tests from /tests, and record command-backed evidence.
tasks:
  - id: improve
run:
  maxIterations: 50
  maxTaskAttempts: 3
  maxDuration: 8h
  resume: true
  stall:
    maxConsecutive: 3
    backoffMs: 30000
