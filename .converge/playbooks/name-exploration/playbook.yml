---
name: name-exploration
description: >
  Million-dollar creative-agency naming sprint for the Converge product. Moves through brand strategy, divergent
  creative territories, legal/npm screening, ruthless critique, and an actionable naming recommendation.
run:
  mode: oneoff
  maxIterations: 500
  maxTaskAttempts: 3
  resume: true
  stall:
    maxConsecutive: 3
    backoffMs: 30000
tasks:
  - id: 00-taste-calibration
  - id: 00-competitive-map
  - id: 01-research
    depends_on:
      - 00-taste-calibration
      - 00-competitive-map
  - id: 01-semantic-field
    path: 02-generate/01-semantic-field
    depends_on:
      - 01-research
  - id: 02-metaphor-domains
    path: 02-generate/02-metaphor-domains
    depends_on:
      - 01-research
  - id: 03-latin-greek-roots
    path: 02-generate/03-latin-greek-roots
    depends_on:
      - 01-research
  - id: 04-npm-pattern-study
    path: 02-generate/04-npm-pattern-study
    depends_on:
      - 01-research
  - id: 05-competitive-ai
    path: 02-generate/05-competitive-ai
    depends_on:
      - 01-research
  - id: 06-phonetic-aesthetics
    path: 02-generate/06-phonetic-aesthetics
    depends_on:
      - 01-research
  - id: 07-brand-blending
    path: 02-generate/07-brand-blending
    depends_on:
      - 01-research
  - id: 08-abstract-evocative
    path: 02-generate/08-abstract-evocative
    depends_on:
      - 01-research
  - id: 09-mythology-narrative
    path: 02-generate/09-mythology-narrative
    depends_on:
      - 01-research
  - id: 10-science-nature
    path: 02-generate/10-science-nature
    depends_on:
      - 01-research
  - id: 02-generate
    depends_on:
      - 01-semantic-field
      - 02-metaphor-domains
      - 03-latin-greek-roots
      - 04-npm-pattern-study
      - 05-competitive-ai
      - 06-phonetic-aesthetics
      - 07-brand-blending
      - 08-abstract-evocative
      - 09-mythology-narrative
      - 10-science-nature
  - id: 02b-creative-critique
    depends_on:
      - 02-generate
  - id: 02c-second-round-generation
    depends_on:
      - 02b-creative-critique
  - id: 02d-final-merge
    depends_on:
      - 02c-second-round-generation
  - id: 03-validate
    depends_on:
      - 02d-final-merge
  - id: 03b-market-collision-check
    depends_on:
      - 03-validate
  - id: 04-evaluate
    depends_on:
      - 03b-market-collision-check
  - id: 04b-narrative-test
    depends_on:
      - 04-evaluate
  - id: 05-rank
    depends_on:
      - 04b-narrative-test
goals:
  - id: report-exists
    description: Final ranked report exists in artifacts
    checks:
      - id: check
        cmd: test -f artifacts/name-exploration/ranked-report.md
  - id: report-has-recommendations
    description: Report has recommendations section
    checks:
      - id: check
        cmd: grep -q "## Recommendations" artifacts/name-exploration/ranked-report.md
  - id: report-has-shortlist
    description: Report includes a boardroom shortlist
    checks:
      - id: check
        cmd: grep -q "## Boardroom Shortlist" artifacts/name-exploration/ranked-report.md

