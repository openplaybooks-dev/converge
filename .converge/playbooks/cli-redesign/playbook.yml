name: cli-redesign
description: |
  Implement the v2 CLI surface defined in docs/design/cli-redesign.md.
  Replaces the substring-filtered intent-based CLI (run/status/inspect/show/...)
  with a dbt-style verb set (run/build/test/compile/list/...) plus a --select
  DSL with +/@/* graph operators and method:value selectors, an honest
  three-state manifest (concrete/expected/frontier) for the dynamic DAG, and
  hash-based staleness detection.

  Discipline: strict red-green-refactor TDD at every leaf. Each leaf writes a
  failing test first, implements until green, refactors. Phases gate each
  other on `pnpm -r typecheck && pnpm -r test`.

  Specification of record: docs/design/cli-redesign.md (sections numbered
  1-14, frequently referenced from task bodies).

vars:
  spec_doc: docs/design/cli-redesign.md
  test_runner: pnpm -r test
  typecheck: pnpm -r typecheck

run:
  mode: oneoff
  maxIterations: 5000
  maxTaskAttempts: 3
  stall:
    maxConsecutive: 3
    backoffMs: 60000

tasks:
  - id: 01-foundations
  - id: 02-compile-and-list
    depends_on:
      - 01-foundations
  - id: 03-execution-verbs
    depends_on:
      - 02-compile-and-list
  - id: 04-staleness
    depends_on:
      - 03-execution-verbs
  - id: 05-incremental-and-freshness
    depends_on:
      - 04-staleness
  - id: 06-migration
    depends_on:
      - 05-incremental-and-freshness

checks:
  - id: spec-doc-present
    cmd: test -s docs/design/cli-redesign.md
    description: The design doc that this playbook implements is present.
  - id: typecheck-green
    cmd: pnpm --filter @converge/core --filter @converge/cli typecheck
    description: cli-redesign packages typecheck.
  - id: tests-green
    cmd: pnpm --filter @converge/core --filter @converge/cli test
    description: cli-redesign packages test suite passes.
  - id: built-cli-exists
    cmd: test -x packages/cli/dist/index.js
    description: The CLI builds successfully end-to-end.
