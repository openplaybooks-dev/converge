---
name: declarative-discovery
description: |
  Replace the tree-based playbook execution model with a DAG-based model
  inspired by dbt's data model. This is more than replacing folder-scan
  with declarations — the DAG becomes the primary data model end-to-end:

    1. DAG primitives (DagNode, TaskDag, topological sort) replace
       Unit.parent/children and the entire task/tree/ directory.
    2. A declarative loader walks children: and from_seed: declarations
       from TASK.md frontmatter — never scans tasks/ blindly.
    3. A DAG runner executes tasks in topological order (Kahn's
       algorithm), replacing the sequential for-child-of-children loop.
    4. Every live playbook gets children: declarations migrated from
       its current folder structure.
    5. Every CLI consumer (commands-run, next-task, tree, gantt, graph,
       inspect, autonomous-run, converge-runner, reconcile) switches
       from TaskTree to TaskDag.
    6. The task/tree/ directory, discoverChildren(), and tree-utils.ts
       are deleted. No fallback.

  Why: dbt's DAG is the right mental model. A task declares its children
  and dependencies explicitly. The DAG is constructable without filesystem
  walking. A task can be a child of multiple parents (shared dependency).
  Execution order is deterministic topological sort. The manifest IS the
  DAG, serialized to disk. File paths are metadata, not structure.

  Hard cutover: phase 04 migrates every live playbook to declarative;
  phase 05 migrates every CLI consumer to TaskDag; phase 06 deletes
  tree abstractions entirely. No fallback.

  Hard prerequisites:
    - cli-redesign merged on main (manifest, --select, target/).
    - remove-goals merged on main (legacy goal concept gone).
    - dbt-paradigm merged on main (seeds, tests, child-synthesizer.ts;
      WBS API deleted).

  Plan of record: ~/.claude/plans/floating-stirring-sunbeam.md
vars:
  test_runner: pnpm -r test
  typecheck: pnpm -r typecheck
  spec_doc: docs/design/declarative-discovery.md
  flag_env: CONVERGE_DECLARATIVE_DISCOVERY
run:
  mode: oneoff
  maxIterations: 4000
  maxTaskAttempts: 3
  stall:
    maxConsecutive: 3
    backoffMs: 60000
tasks:
  - id: dag-data-model
  - id: declarative-loader
    depends_on:
      - dag-data-model
  - id: dag-runner
    depends_on:
      - declarative-loader
  - id: migrate-playbooks
    depends_on:
      - dag-runner
  - id: migrate-cli-consumers
    depends_on:
      - migrate-playbooks
  - id: strip-tree
    depends_on:
      - migrate-cli-consumers
goals:
  - id: typecheck-green
    description: All packages typecheck.
    checks:
      - id: check
        cmd: pnpm -r typecheck
  - id: tests-green
    description: All package test suites pass.
    checks:
      - id: check
        cmd: pnpm -r test
  - id: built-cli-exists
    description: The CLI builds end-to-end.
    checks:
      - id: check
        cmd: test -x packages/cli/dist/index.js
  - id: predecessor-cli-redesign-merged
    description: cli-redesign predecessor merged (select module exists).
    checks:
      - id: check
        cmd: test -d packages/core/src/select
  - id: predecessor-remove-goals-merged
    description: remove-goals predecessor merged.
    checks:
      - id: check
        cmd: "! test -f packages/core/src/runtime/goal-manager.ts"
  - id: predecessor-dbt-paradigm-merged
    description: dbt-paradigm predecessor merged (child-synthesizer present; seed schema present; WBS executor gone).
    checks:
      - id: check
        cmd: test -f packages/core/src/runtime/child-synthesizer.ts && test -f packages/core/src/config/seed-md-definition.ts &&
          ! test -f packages/core/src/executor/wbs-executor.ts
  - id: dag-modules-exist
    description: DAG primitives exist (dag-node, topological-sort, task-dag).
    checks:
      - id: check
        cmd: test -f packages/core/src/dag/dag-node.ts && test -f packages/core/src/dag/topological-sort.ts && test -f
          packages/core/src/dag/task-dag.ts
  - id: declarative-loader-exists
    description: Declarative loader module exists.
    checks:
      - id: check
        cmd: test -f packages/core/src/config/declarative-loader.ts
  - id: dag-runner-exists
    description: DAG runner module exists.
    checks:
      - id: check
        cmd: test -f packages/core/src/dag/dag-runner.ts
  - id: cross-loader-parity
    description: Cross-loader parity test passes — declarative and folder-scan produce identical DAGs.
    checks:
      - id: check
        cmd: pnpm --filter @openplaybooks/converge-core test -- loader-parity
  - id: every-live-playbook-declarative
    description: Every live playbook's parent TASK.md declares its children explicitly.
    checks:
      - id: check
        cmd: >
          while IFS= read -r path; do
            if find "$path/tasks" -name TASK.md -mindepth 2 2>/dev/null | head -1 | grep -q .; then
              parent_dirs=$(find "$path/tasks" -name TASK.md -mindepth 2 -exec dirname {} \; | xargs -I{} dirname {} | sort -u)
              for pd in $parent_dirs; do
                test -f "$pd/TASK.md" || continue
                grep -qE '^children:' "$pd/TASK.md" || { echo "Parent $pd lacks children: declaration"; exit 1; }
              done
            fi
          done < <(jq -r '.[] | select(.live == true) | .path'
          .converge/playbooks/declarative-discovery/playbooks-catalog.json 2>/dev/null)
  - id: tree-directory-deleted
    description: The task/tree/ directory is gone — no tree abstractions remain.
    checks:
      - id: check
        cmd: "! test -d packages/core/src/task/tree"
  - id: discover-children-deleted
    description: Folder-scan children.ts is deleted.
    checks:
      - id: check
        cmd: "! test -f packages/core/src/task/unit/children.ts"
  - id: tree-utils-deleted
    description: Tree-specific checkpoint utilities are deleted.
    checks:
      - id: check
        cmd: "! test -f packages/core/src/checkpoint/tree-utils.ts"
  - id: no-tasktree-imports
    description: Zero references to TaskTree or task/tree/ remain in the codebase.
    checks:
      - id: check
        cmd: "! grep -rln 'TaskTree\\|task/tree' packages/ 2>/dev/null"
  - id: no-folder-scan-logic
    description: Folder-scan discovery logic is entirely gone.
    checks:
      - id: check
        cmd: "! grep -rln 'discoverChildren\\|discoverEpicChildren\\|walkTasksDirectory\\|scanTaskDirectories' packages/core/src
          2>/dev/null"
  - id: spec-doc-present
    description: The design doc exists.
    checks:
      - id: check
        cmd: test -s docs/design/declarative-discovery.md

