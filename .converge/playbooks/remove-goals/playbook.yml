---
name: remove-goals
description: |
  Physically remove the "goal" concept from the converge framework so the
  team can develop new task/seed/test paradigms without legacy entanglement.
  Ordered, gated deletion: survey -> strip callsites -> delete schema/parser
  -> delete runtime/planner -> delete CLI -> purge docs.

  Standalone playbook. No coordination dependency on cli-redesign — the
  user sequences playbooks manually. Phase 05 fully deletes the `goals`
  CLI command (no redirect; falls through to "unknown command").

  Discipline: inverted red-green at every non-trivial leaf. `01-red/` writes
  a negative-existence test (file absent / symbol absent / parse rejects);
  `02-green/` performs the deletion until the test passes AND the module's
  own tests stay green. Phases gate each other on
  `pnpm -r typecheck && pnpm -r test`.
vars:
  test_runner: pnpm -r test
  typecheck: pnpm -r typecheck
run:
  mode: oneoff
  maxIterations: 4000
  maxTaskAttempts: 3
  stall:
    maxConsecutive: 3
    backoffMs: 60000
tasks:
  - id: 01-survey-and-fence
  - id: 02-strip-callsites
    depends_on:
      - 01-survey-and-fence
  - id: 03-delete-schema-and-parser
    depends_on:
      - 02-strip-callsites
  - id: 04-delete-runtime-and-planner
    depends_on:
      - 03-delete-schema-and-parser
  - id: 05-delete-cli-surface
    depends_on:
      - 04-delete-runtime-and-planner
  - id: 06-docs-and-cleanup
    depends_on:
      - 05-delete-cli-surface
goals:
  - id: test-typecheck
    description: All packages typecheck.
    checks:
      - id: check
        cmd: 'echo "(test ref: typecheck — convert manually)" && exit 0'
  - id: test-tests-green
    description: All package test suites pass.
    checks:
      - id: check
        cmd: 'echo "(test ref: tests-green — convert manually)" && exit 0'
  - id: test-file-exists
    description: The CLI builds successfully end-to-end.
    checks:
      - id: check
        cmd: 'echo "(test ref: file-exists — convert manually)" && exit 0'
  - id: no-goal-source-files
    description: All four goal source files have been deleted.
    checks:
      - id: check
        cmd: "! ls packages/core/src/runtime/goal-manager.ts packages/core/src/converge/goal-planner.ts
          packages/core/src/config/parse-goal.ts packages/cli/src/commands-goals.ts 2>/dev/null"
  - id: test-no-pattern
    description: Schema no longer carries goals / goalDefs / goal-defs frontmatter fields.
    checks:
      - id: check
        cmd: 'echo "(test ref: no-pattern — convert manually)" && exit 0'
  - id: no-goal-md-artifacts-in-examples
    description: No GOAL.md artifacts remain anywhere under examples/.
    checks:
      - id: check
        cmd: "! find examples -name GOAL.md 2>/dev/null | grep -q ."
  - id: no-goals-cli-route
    description: "`converge goals` exits non-zero with an unknown-command message (no redirect)."
    checks:
      - id: check
        cmd: |
          out=$(packages/cli/dist/index.js goals 2>&1); rc=$?
          test $rc -ne 0
          echo "$out" | grep -qiE 'unknown|unrecognized'

