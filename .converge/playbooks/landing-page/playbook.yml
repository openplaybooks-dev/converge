---
name: landing-page
description: |
  Build a production-ready Astro landing page for Converge at apps/landing/.

  v2 — from-scratch model. v1 used fork-and-prune (clone an MIT theme, AI rebrands)
  and failed: ScrewFast strings everywhere, leftover demo dirs, layout never
  rebranded. This v2 throws all that out — phase 02 wipes apps/landing/src/
  entirely and scaffolds Astro fresh from `npm create astro@latest`. Everything
  the playbook produces is its own. There is no prune phase because there is
  nothing to prune.

  Output: marketing landing + Starlight /docs (reads docs/ directly via
  docsLoader) + content-collection /blog. Deployed to Cloudflare Pages.

  Inputs (all public — no archived sources):
    - banner.svg                          visual identity (palette, typography, motif)
    - README.md                           canonical project intro + tagline + voice
    - docs/                               canonical published docs (rendered at /docs)
    - docs/_ia.json                       Starlight sidebar manifest
    - docs/_redirects.json                legacy aliases, merged into Cloudflare _redirects
    - docs/concepts/                      4 framework concepts; trade-offs sections seed FAQ
    - docs/getting-started/why-converge.md  positioning + audience framing

  The docs playbook owns docs/. Re-run it any time the framework changes;
  the next landing-page rebuild picks up fresh content automatically via the
  Starlight docsLoader (no port step).
run:
  mode: oneoff
  maxIterations: 250
  maxTaskAttempts: 3
  maxDuration: 6h
  resume: true
  stall:
    maxConsecutive: 3
    backoffMs: 30000
tasks:
  - id: 01-prepare-spec
  - id: 02-bootstrap-astro
    depends_on:
      - 01-prepare-spec
  - id: 03-design-system
    depends_on:
      - 02-bootstrap-astro
  - id: 04-build-sections
    depends_on:
      - 03-design-system
  - id: 05-build-layout
    depends_on:
      - 03-design-system
  - id: 06-integrate-docs
    depends_on:
      - 05-build-layout
  - id: 07-integrate-blog
    depends_on:
      - 05-build-layout
  - id: 08-generate-assets
    depends_on:
      - 03-design-system
  - id: 09-polish
    depends_on:
      - 04-build-sections
      - 06-integrate-docs
      - 07-integrate-blog
      - 08-generate-assets
  - id: 10-verify
    depends_on:
      - 09-polish
  - id: 11-ship
    depends_on:
      - 10-verify
goals:
  - id: workspace-includes-apps
    description: pnpm-workspace.yaml includes apps/* glob
    checks:
      - id: check
        cmd: grep -qE "^\s*-\s*['\"]?apps/\*['\"]?\s*$" pnpm-workspace.yaml
  - id: landing-package-exists
    description: apps/landing/package.json exists with name @openplaybooks/landing
    checks:
      - id: check
        cmd: "test -f apps/landing/package.json && node -e \"process.exit(require('./apps/landing/package.json').name ===
          '@openplaybooks/landing' ? 0 : 1)\""
  - id: cloudflare-adapter-configured
    description: astro.config uses @astrojs/cloudflare adapter
    checks:
      - id: check
        cmd: test -f apps/landing/astro.config.mjs && grep -qE '@astrojs/cloudflare' apps/landing/astro.config.mjs
  - id: build-clean
    description: production build succeeds
    checks:
      - id: check
        cmd: test -d apps/landing/src && pnpm --filter @openplaybooks/landing build
  - id: tagline-rendered
    description: tagline appears in the rendered home page HTML
    checks:
      - id: check
        cmd: test -f apps/landing/dist/index.html && grep -q 'Define done. Converge gets there.' apps/landing/dist/index.html
  - id: starlight-pages-indexed
    description: at least 4 Starlight doc pages built under /docs
    checks:
      - id: check
        cmd: test -d apps/landing/dist/docs && test $(find apps/landing/dist/docs -name 'index.html' | wc -l) -ge 4
  - id: blog-feed-valid
    description: rss.xml exists and references at least 1 post
    checks:
      - id: check
        cmd: test -f apps/landing/dist/rss.xml && grep -qc '<item>' apps/landing/dist/rss.xml
  - id: og-image-present
    description: default OG image present
    checks:
      - id: check
        cmd: test -d apps/landing/dist && (test -f apps/landing/dist/og.png || find apps/landing/dist -name 'og*.png' -o -name
          'og*.jpg' | head -1 | grep -q .)
  - id: sitemap-and-robots
    description: sitemap.xml and robots.txt are emitted
    checks:
      - id: check
        cmd: test -d apps/landing/dist && (test -f apps/landing/dist/sitemap-index.xml || test -f apps/landing/dist/sitemap.xml)
          && test -f apps/landing/dist/robots.txt
  - id: tagline-not-drifted
    description: tagline string in landing matches README.md (canonical source)
    checks:
      - id: check
        cmd: node .converge/playbooks/landing-page/scripts/check-tagline-drift.mjs
  - id: no-upstream-brand
    description: no ScrewFast/AstroWind/Foxi/AstroPaper/Astroship strings anywhere in the built site
    checks:
      - id: check
        cmd: node .converge/playbooks/landing-page/scripts/check-no-upstream-brand.mjs
  - id: no-placeholders
    description: no Lorem/placeholder/TBD/FIXME/TODO strings in dist/
    checks:
      - id: check
        cmd: node .converge/playbooks/landing-page/scripts/check-no-placeholders.mjs
  - id: meta-validation
    description: OG/Twitter/canonical/lang meta tags present and non-empty
    checks:
      - id: check
        cmd: node .converge/playbooks/landing-page/scripts/check-meta-validation.mjs
  - id: lighthouse-perf-95
    description: Lighthouse Performance >= 95 on home
    checks:
      - id: check
        cmd: node .converge/playbooks/landing-page/scripts/lighthouse-gate.mjs performance 95
  - id: lighthouse-a11y-95
    description: Lighthouse Accessibility >= 95 on home
    checks:
      - id: check
        cmd: node .converge/playbooks/landing-page/scripts/lighthouse-gate.mjs accessibility 95

