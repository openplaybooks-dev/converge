name: implement-feature
description: Execute tasks from a dispatch queue — implement features, fix bugs, resolve issues.

inputs:
  task:
    description: What to do (free text, issue URL, or PR URL)
    required: true

run:
  mode: dispatch
  maxTaskAttempts: 3
  maxDuration: 2h
  resume: true
  stall:
    maxConsecutive: 3
    backoffMs: 30000
