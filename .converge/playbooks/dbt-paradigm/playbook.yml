name: dbt-paradigm
description: |
  Complete the conversion to the dbt mental model. Runs after cli-redesign
  (v2 CLI surface, --select DSL, three-state manifest) and remove-goals
  (legacy goal concept removed).

  This playbook does three things:

    1. Rename WBS → seeds. Keep the same API. The wbs: object becomes a
       seeds: array. Each entry is either an inline seed ({ type: nodejs,
       path: ... } — same shape as WBS) or a named reference ({ type: seed,
       name: ... } — reusable across tasks). Scripts move from per-task
       wbs/ to playbook-level seeds/. Same executor, spawn targets, journal.

    2. Add a reusable checks API. tests/<name>.test.md files define
       reusable checks (shell or JS with context API). Tasks reference
       them via test:<name>(args) in their checks: array. The loader
       expands references to inline checks at parse time.

    3. Clean break. Remove migration redirects, dead code, V1 checkpoint
       compatibility, deprecated exports. Update help text to show only
       dbt-model commands.

  Execution order: 01 (survey) → 02 (rename) → 03 (checks) → 04 (clean break).

vars:
  test_runner: pnpm -r test
  typecheck: pnpm -r typecheck

run:
  mode: oneoff
  maxIterations: 5000
  maxTaskAttempts: 3
  stall:
    maxConsecutive: 3
    backoffMs: 60000

tasks:
  - id: 01-survey-and-catalog
  - id: 02-rename-wbs-to-seeds
    depends_on:
      - 01-survey-and-catalog
  - id: 03-reusable-checks-api
    depends_on:
      - 02-rename-wbs-to-seeds
  - id: 04-clean-break
    depends_on:
      - 03-reusable-checks-api

checks:
  - id: typecheck-green
    cmd: pnpm -r typecheck
    description: All packages typecheck.
  - id: tests-green
    cmd: pnpm -r test
    description: All test suites pass.
  - id: built-cli-exists
    cmd: test -x packages/cli/dist/index.js
    description: CLI builds successfully.
  - id: predecessor-cli-redesign-merged
    cmd: test -d packages/core/src/select
    description: cli-redesign predecessor merged.
  - id: predecessor-remove-goals-merged
    cmd: "! test -f packages/core/src/runtime/goal-manager.ts"
    description: remove-goals predecessor merged.
  - id: no-wbs-in-source
    cmd: "! grep -rq 'WbsExecutor\\|WbsContext\\|WbsFn\\|TaskMdWbs' packages/core/src/ packages/cli/src/"
    description: No WBS type names in source (renamed to seed).
  - id: no-wbs-in-playbooks
    cmd: "! grep -rlE '^wbs:' .converge/playbooks/ examples/ 2>/dev/null && ! find .converge/playbooks/ examples/ -type d -name wbs 2>/dev/null | grep -q ."
    description: "No wbs frontmatter or wbs directories in playbooks."
  - id: seed-md-definition-present
    cmd: test -f packages/core/src/config/seed-md-definition.ts
    description: Seed schema module exists (renamed from WBS).
  - id: test-md-definition-present
    cmd: test -f packages/core/src/config/test-md-definition.ts
    description: Test schema module exists.
  - id: no-migration-redirects
    cmd: "! test -f packages/cli/src/migration-redirects.ts"
    description: Migration redirects file gone.
  - id: no-deprecated-exports
    cmd: "! grep -q '@deprecated' packages/core/src/index.ts"
    description: No deprecated symbols in public API.
  - id: no-v1-checkpoint
    cmd: "! grep -rq 'version === 1' packages/core/src/checkpoint/ packages/core/src/task/ packages/cli/src/commands.ts packages/cli/src/next-task.ts"
    description: No V1 checkpoint version branching.
