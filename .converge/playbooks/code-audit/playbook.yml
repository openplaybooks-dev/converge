---
name: code-audit
description: >
  Standalone PR auditor. Runs three audits in parallel against a pull request
  (commit messages, doc drift, code review) and synthesizes one combined
  markdown comment for the human reviewer. Advisory only; never gates merge.
tasks:
  - id: 01-audit-commits
  - id: 02-audit-docs-drift
  - id: 03-audit-code
  - id: 04-synthesize
goals:
  - id: report-exists
    description: A combined review report was produced.
    checks:
      - id: file
        cmd: "test -s .converge/playbooks/code-audit/output/review.md"
run:
  maxIterations: 20
  maxTaskAttempts: 2
  maxDuration: 30m
  resume: true
