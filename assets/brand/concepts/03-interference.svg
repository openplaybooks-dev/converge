<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Converge Interference mark — three frequencies align, order emerges from noise">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>
    <radialGradient id="centerLight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#C4B5FD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>

  <!-- Subtle outer ring -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Three source points arranged in a triangle -->
  <!-- Source R: top -->
  <!-- Source Y: bottom-left -->
  <!-- Source G: bottom-right -->

  <!-- === Source R (Red, top) concentric waves === -->
  <g opacity="0.7">
    <circle cx="128" cy="52" r="16" fill="none" stroke="#F87171" stroke-width="1.2" opacity="0.8"/>
    <circle cx="128" cy="52" r="28" fill="none" stroke="#F87171" stroke-width="1.0" opacity="0.7"/>
    <circle cx="128" cy="52" r="40" fill="none" stroke="#F87171" stroke-width="0.9" opacity="0.6"/>
    <circle cx="128" cy="52" r="52" fill="none" stroke="#F87171" stroke-width="0.8" opacity="0.55"/>
    <circle cx="128" cy="52" r="64" fill="none" stroke="#F87171" stroke-width="0.7" opacity="0.5"/>
    <circle cx="128" cy="52" r="76" fill="none" stroke="#F87171" stroke-width="0.65" opacity="0.45"/>
    <circle cx="128" cy="52" r="88" fill="none" stroke="#F87171" stroke-width="0.6" opacity="0.4"/>
    <circle cx="128" cy="52" r="100" fill="none" stroke="#F87171" stroke-width="0.5" opacity="0.35"/>
    <circle cx="128" cy="52" r="112" fill="none" stroke="#F87171" stroke-width="0.45" opacity="0.3"/>
    <circle cx="128" cy="52" r="124" fill="none" stroke="#F87171" stroke-width="0.4" opacity="0.25"/>
    <circle cx="128" cy="52" r="136" fill="none" stroke="#F87171" stroke-width="0.35" opacity="0.2"/>
    <circle cx="128" cy="52" r="148" fill="none" stroke="#F87171" stroke-width="0.3" opacity="0.15"/>
    <circle cx="128" cy="52" r="160" fill="none" stroke="#F87171" stroke-width="0.25" opacity="0.1"/>
  </g>

  <!-- === Source Y (Yellow, bottom-left) concentric waves === -->
  <g opacity="0.7">
    <circle cx="62" cy="180" r="16" fill="none" stroke="#FBBF24" stroke-width="1.2" opacity="0.8"/>
    <circle cx="62" cy="180" r="28" fill="none" stroke="#FBBF24" stroke-width="1.0" opacity="0.7"/>
    <circle cx="62" cy="180" r="40" fill="none" stroke="#FBBF24" stroke-width="0.9" opacity="0.6"/>
    <circle cx="62" cy="180" r="52" fill="none" stroke="#FBBF24" stroke-width="0.8" opacity="0.55"/>
    <circle cx="62" cy="180" r="64" fill="none" stroke="#FBBF24" stroke-width="0.7" opacity="0.5"/>
    <circle cx="62" cy="180" r="76" fill="none" stroke="#FBBF24" stroke-width="0.65" opacity="0.45"/>
    <circle cx="62" cy="180" r="88" fill="none" stroke="#FBBF24" stroke-width="0.6" opacity="0.4"/>
    <circle cx="62" cy="180" r="100" fill="none" stroke="#FBBF24" stroke-width="0.5" opacity="0.35"/>
    <circle cx="62" cy="180" r="112" fill="none" stroke="#FBBF24" stroke-width="0.45" opacity="0.3"/>
    <circle cx="62" cy="180" r="124" fill="none" stroke="#FBBF24" stroke-width="0.4" opacity="0.25"/>
    <circle cx="62" cy="180" r="136" fill="none" stroke="#FBBF24" stroke-width="0.35" opacity="0.2"/>
    <circle cx="62" cy="180" r="148" fill="none" stroke="#FBBF24" stroke-width="0.3" opacity="0.15"/>
    <circle cx="62" cy="180" r="160" fill="none" stroke="#FBBF24" stroke-width="0.25" opacity="0.1"/>
  </g>

  <!-- === Source G (Green, bottom-right) concentric waves === -->
  <g opacity="0.7">
    <circle cx="194" cy="180" r="16" fill="none" stroke="#34D399" stroke-width="1.2" opacity="0.8"/>
    <circle cx="194" cy="180" r="28" fill="none" stroke="#34D399" stroke-width="1.0" opacity="0.7"/>
    <circle cx="194" cy="180" r="40" fill="none" stroke="#34D399" stroke-width="0.9" opacity="0.6"/>
    <circle cx="194" cy="180" r="52" fill="none" stroke="#34D399" stroke-width="0.8" opacity="0.55"/>
    <circle cx="194" cy="180" r="64" fill="none" stroke="#34D399" stroke-width="0.7" opacity="0.5"/>
    <circle cx="194" cy="180" r="76" fill="none" stroke="#34D399" stroke-width="0.65" opacity="0.45"/>
    <circle cx="194" cy="180" r="88" fill="none" stroke="#34D399" stroke-width="0.6" opacity="0.4"/>
    <circle cx="194" cy="180" r="100" fill="none" stroke="#34D399" stroke-width="0.5" opacity="0.35"/>
    <circle cx="194" cy="180" r="112" fill="none" stroke="#34D399" stroke-width="0.45" opacity="0.3"/>
    <circle cx="194" cy="180" r="124" fill="none" stroke="#34D399" stroke-width="0.4" opacity="0.25"/>
    <circle cx="194" cy="180" r="136" fill="none" stroke="#34D399" stroke-width="0.35" opacity="0.2"/>
    <circle cx="194" cy="180" r="148" fill="none" stroke="#34D399" stroke-width="0.3" opacity="0.15"/>
    <circle cx="194" cy="180" r="160" fill="none" stroke="#34D399" stroke-width="0.25" opacity="0.1"/>
  </g>

  <!-- Center — where all three wave systems constructively interfere -->
  <!-- The convergence zone: geometrically the centroid of the triangle -->
  <circle cx="128" cy="128" r="40" fill="url(#centerLight)" filter="url(#glow)" opacity="0.7"/>

  <!-- Geometric lattice emerging at the triple-intersection point -->
  <!-- A hexagon formed by the intersection geometry -->
  <polygon points="128,108 145,118 145,138 128,148 111,138 111,118" fill="none" stroke="#C4B5FD" stroke-width="1" opacity="0.7" filter="url(#softGlow)"/>
  <polygon points="128,108 145,118 145,138 128,148 111,138 111,118" fill="none" stroke="#E0E7FF" stroke-width="0.5" opacity="0.5"/>

  <!-- Inner convergence node -->
  <circle cx="128" cy="128" r="8" fill="#E0E7FF" opacity="0.9"/>
  <circle cx="128" cy="128" r="8" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

  <!-- Three source point markers (small filled circles) -->
  <circle cx="128" cy="52" r="3" fill="#F87171" opacity="0.9"/>
  <circle cx="62" cy="180" r="3" fill="#FBBF24" opacity="0.9"/>
  <circle cx="194" cy="180" r="3" fill="#34D399" opacity="0.9"/>

  <!-- Thin connecting lines from sources to center (ghost of the triangle) -->
  <line x1="128" y1="52" x2="128" y2="120" stroke="#F87171" stroke-width="0.5" opacity="0.15"/>
  <line x1="62" y1="180" x2="120" y2="136" stroke="#FBBF24" stroke-width="0.5" opacity="0.15"/>
  <line x1="194" y1="180" x2="136" y2="136" stroke="#34D399" stroke-width="0.5" opacity="0.15"/>
</svg>
