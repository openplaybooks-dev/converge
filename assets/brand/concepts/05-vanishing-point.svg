<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Converge Vanishing Point mark — all paths pull toward a single inevitable outcome">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="depthGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>
    <radialGradient id="horizon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="1"/>
      <stop offset="8%" stop-color="#C4B5FD" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <!-- Ray gradients: color at origin fading to purple near center -->
    <linearGradient id="rayR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0"/>
      <stop offset="60%" stop-color="#F87171" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="rayY" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0"/>
      <stop offset="60%" stop-color="#FBBF24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="rayG" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="60%" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>

  <!-- Subtle outer ring -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Vanishing point horizon glow -->
  <circle cx="128" cy="128" r="60" fill="url(#horizon)" filter="url(#depthGlow)" opacity="0.7"/>

  <!-- Perspective grid lines converging to center -->
  <!-- Horizontal-ish lines (floor/ceiling planes receding) -->
  <g opacity="0.5">
    <!-- Top set -->
    <line x1="20" y1="50" x2="128" y2="128" stroke="#F87171" stroke-width="0.6" opacity="0.3"/>
    <line x1="80" y1="18" x2="128" y2="128" stroke="#F87171" stroke-width="0.6" opacity="0.35"/>
    <line x1="160" y1="18" x2="128" y2="128" stroke="#F87171" stroke-width="0.6" opacity="0.35"/>
    <line x1="220" y1="60" x2="128" y2="128" stroke="#F87171" stroke-width="0.6" opacity="0.3"/>

    <!-- Middle set -->
    <line x1="30" y1="95" x2="128" y2="128" stroke="#FBBF24" stroke-width="0.55" opacity="0.35"/>
    <line x1="100" y1="20" x2="128" y2="128" stroke="#FBBF24" stroke-width="0.55" opacity="0.4"/>
    <line x1="180" y1="20" x2="128" y2="128" stroke="#FBBF24" stroke-width="0.55" opacity="0.4"/>
    <line x1="220" y1="105" x2="128" y2="128" stroke="#FBBF24" stroke-width="0.55" opacity="0.35"/>

    <!-- Bottom set -->
    <line x1="20" y1="190" x2="128" y2="128" stroke="#34D399" stroke-width="0.5" opacity="0.3"/>
    <line x1="100" y1="236" x2="128" y2="128" stroke="#34D399" stroke-width="0.5" opacity="0.35"/>
    <line x1="170" y1="236" x2="128" y2="128" stroke="#34D399" stroke-width="0.5" opacity="0.35"/>
    <line x1="220" y1="180" x2="128" y2="128" stroke="#34D399" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Bolder structural rays (the 3 main "beams" in RYG) -->
  <line x1="40" y1="40" x2="128" y2="128" stroke="#F87171" stroke-width="1.2" opacity="0.6"/>
  <line x1="128" y1="30" x2="128" y2="128" stroke="#FBBF24" stroke-width="1.2" opacity="0.6"/>
  <line x1="220" y1="50" x2="128" y2="128" stroke="#34D399" stroke-width="1.2" opacity="0.6"/>

  <!-- Depth rings (like ripples in perspective) -->
  <circle cx="128" cy="128" r="15" fill="none" stroke="#C4B5FD" stroke-width="0.8" opacity="0.5"/>
  <circle cx="128" cy="128" r="30" fill="none" stroke="#A78BFA" stroke-width="0.6" opacity="0.35"/>
  <circle cx="128" cy="128" r="50" fill="none" stroke="#A78BFA" stroke-width="0.45" opacity="0.2"/>
  <circle cx="128" cy="128" r="75" fill="none" stroke="#A78BFA" stroke-width="0.35" opacity="0.12"/>

  <!-- The single bright point where everything converges -->
  <circle cx="128" cy="128" r="4" fill="#E0E7FF" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="4" fill="#FFFFFF"/>
  <circle cx="128" cy="128" r="2" fill="#1E1B4B" opacity="0.4"/>

  <!-- Outer frame corners (architectural framing) -->
  <path d="M 20 20 L 60 20 L 60 24 L 24 24 L 24 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M 236 20 L 196 20 L 196 24 L 232 24 L 232 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M 20 236 L 60 236 L 60 232 L 24 232 L 24 196" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M 236 236 L 196 236 L 196 232 L 232 232 L 232 196" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
</svg>
