<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Converge Topological Fold mark — a continuous surface that wraps around to meet itself">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>
    <!-- Ribbon gradient: R → Y → G along the continuous surface -->
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="33%" stop-color="#FBBF24"/>
      <stop offset="66%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="33%" stop-color="#92400E"/>
      <stop offset="66%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>

  <!-- Subtle outer ring -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- The fold — a continuous ribbon that twists and meets itself -->
  <!-- Main ribbon body (front face) — flowing Möbius-like curve -->
  <path d="
    M 50 80
    C 70 60, 110 50, 140 65
    C 170 80, 185 110, 175 140
    C 165 170, 140 190, 110 195
    C 80 200, 55 185, 50 160
    C 45 135, 60 110, 85 100
    C 110 90, 140 95, 160 115
    C 180 135, 185 165, 170 185
    C 155 205, 125 210, 100 198
    C 80 188, 68 165, 72 140
    C 75 120, 95 105, 115 108
  " fill="none" stroke="url(#ribbonGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#glow)"/>

  <!-- Ribbon edge highlight (inner stroke for dimension) -->
  <path d="
    M 50 80
    C 70 60, 110 50, 140 65
    C 170 80, 185 110, 175 140
    C 165 170, 140 190, 110 195
    C 80 200, 55 185, 50 160
    C 45 135, 60 110, 85 100
    C 110 90, 140 95, 160 115
    C 180 135, 185 165, 170 185
    C 155 205, 125 210, 100 198
    C 80 188, 68 165, 72 140
    C 75 120, 95 105, 115 108
  " fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>

  <!-- The twist — a crossing segment that creates the fold illusion -->
  <path d="
    M 115 108
    C 125 110, 130 118, 128 128
    C 126 138, 118 142, 108 140
    C 98 138, 92 130, 95 120
    C 97 114, 103 110, 110 112
  " fill="none" stroke="url(#ribbonDark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <path d="
    M 115 108
    C 125 110, 130 118, 128 128
    C 126 138, 118 142, 108 140
    C 98 138, 92 130, 95 120
    C 97 114, 103 110, 110 112
  " fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.1"/>

  <!-- Convergence point — where the ribbon meets itself -->
  <circle cx="112" cy="120" r="6" fill="#C4B5FD" filter="url(#softGlow)" opacity="0.8"/>
  <circle cx="112" cy="120" r="3" fill="#E0E7FF"/>

  <!-- Start point accent -->
  <circle cx="50" cy="80" r="3" fill="#F87171" opacity="0.8"/>

  <!-- End point accent (where it wraps to meet start) -->
  <circle cx="115" cy="108" r="3" fill="#34D399" opacity="0.8"/>
</svg>
