<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Converge Syzygy mark — three bodies align, convergence creates light">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>
    <!-- Gradient along the alignment axis -->
    <linearGradient id="alignGrad" x1="0.2" y1="0.2" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="33%" stop-color="#FBBF24"/>
      <stop offset="66%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="coronaGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="128" cy="128" r="110"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>

  <!-- Subtle outer ring -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Corona glow behind the alignment -->
  <ellipse cx="128" cy="128" rx="30" ry="50" fill="#C4B5FD" filter="url(#softGlow)" opacity="0.4" transform="rotate(-45 128 128)"/>

  <g clip-path="url(#circleClip)">
    <!-- Red body (top-left) -->
    <circle cx="88" cy="88" r="42" fill="#F87171" opacity="0.85"/>
    <circle cx="88" cy="88" r="42" fill="none" stroke="#F87171" stroke-width="2" opacity="0.6"/>

    <!-- Yellow body (center) -->
    <circle cx="128" cy="128" r="42" fill="#FBBF24" opacity="0.85"/>
    <circle cx="128" cy="128" r="42" fill="none" stroke="#FBBF24" stroke-width="2" opacity="0.6"/>

    <!-- Green body (bottom-right) -->
    <circle cx="168" cy="168" r="42" fill="#34D399" opacity="0.85"/>
    <circle cx="168" cy="168" r="42" fill="none" stroke="#34D399" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- The convergence — where all three overlap, a bright diamond emerges -->
  <!-- Diamond formed by the triple-overlap zone -->
  <path d="M 128 98 L 145 128 L 128 158 L 111 128 Z" fill="#C4B5FD" filter="url(#glow)" opacity="0.9"/>
  <path d="M 128 98 L 145 128 L 128 158 L 111 128 Z" fill="#E0E7FF"/>

  <!-- Corona ring around the diamond -->
  <ellipse cx="128" cy="128" rx="24" ry="38" fill="none" stroke="#C4B5FD" stroke-width="1.5" opacity="0.5" transform="rotate(-45 128 128)"/>
  <ellipse cx="128" cy="128" rx="32" ry="50" fill="none" stroke="#A78BFA" stroke-width="0.75" opacity="0.25" transform="rotate(-45 128 128)"/>

  <!-- Subtle crosshair at exact center -->
  <line x1="128" y1="118" x2="128" y2="138" stroke="#1E1B4B" stroke-width="1" opacity="0.6"/>
  <line x1="118" y1="128" x2="138" y2="128" stroke="#1E1B4B" stroke-width="1" opacity="0.6"/>
</svg>
