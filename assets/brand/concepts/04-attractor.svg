<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="Converge Strange Attractor mark — chaotic paths inevitably converge to fixed points">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="attractorGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>
    <!-- Gradient along the trajectory: R → Y → G → purple -->
    <linearGradient id="trajectory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="leftAttractor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightAttractor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>

  <!-- Subtle outer ring -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Attractor point glows (two lobes of the Lorenz attractor) -->
  <circle cx="88" cy="128" r="18" fill="url(#leftAttractor)" filter="url(#attractorGlow)" opacity="0.5"/>
  <circle cx="168" cy="128" r="18" fill="url(#rightAttractor)" filter="url(#attractorGlow)" opacity="0.5"/>

  <!-- Spiral rings around left attractor (nested, growing outward) -->
  <ellipse cx="88" cy="125" rx="16" ry="22" fill="none" stroke="#F87171" stroke-width="0.8" opacity="0.5" transform="rotate(-15 88 125)"/>
  <ellipse cx="88" cy="125" rx="24" ry="32" fill="none" stroke="#F87171" stroke-width="0.65" opacity="0.4" transform="rotate(-20 88 125)"/>
  <ellipse cx="88" cy="125" rx="32" ry="42" fill="none" stroke="#FBBF24" stroke-width="0.5" opacity="0.35" transform="rotate(-10 88 125)"/>

  <!-- Spiral rings around right attractor -->
  <ellipse cx="168" cy="131" rx="16" ry="22" fill="none" stroke="#34D399" stroke-width="0.8" opacity="0.5" transform="rotate(15 168 131)"/>
  <ellipse cx="168" cy="131" rx="24" ry="32" fill="none" stroke="#34D399" stroke-width="0.65" opacity="0.4" transform="rotate(20 168 131)"/>
  <ellipse cx="168" cy="131" rx="32" ry="42" fill="none" stroke="#A78BFA" stroke-width="0.5" opacity="0.35" transform="rotate(10 168 131)"/>

  <!-- Main trajectory: a continuous Lorenz-inspired path weaving between lobes -->
  <!-- Path spirals around left lobe, crosses to right, spirals, crosses back -->
  <path d="
    M 128 128
    C 110 90, 60 95, 58 130
    C 56 160, 90 168, 105 150
    C 118 133, 110 115, 100 108
    C 85 98, 68 110, 72 132
    C 76 148, 100 155, 115 140
    C 125 130, 125 118, 120 110
    C 112 98, 92 100, 90 118
    C 88 134, 100 145, 112 138
    C 118 133, 126 128, 128 128
    C 130 105, 155 85, 176 100
    C 200 118, 198 155, 172 165
    C 148 174, 132 152, 140 132
    C 148 115, 168 108, 185 118
    C 200 127, 195 150, 175 158
    C 158 165, 142 148, 142 132
    C 142 118, 148 105, 162 100
    C 172 96, 188 104, 185 122
    C 182 138, 165 148, 152 138
    C 142 130, 135 120, 128 128
  " fill="none" stroke="url(#trajectory)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" opacity="0.85"/>

  <!-- Secondary trajectory (offset, thinner) for depth -->
  <path d="
    M 128 128
    C 115 95, 68 100, 66 133
    C 64 158, 95 165, 108 148
    C 130 120, 128 128, 128 128
    C 133 108, 160 88, 180 104
    C 198 118, 195 152, 170 162
    C 132 178, 128 128, 128 128
  " fill="none" stroke="#A78BFA" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>

  <!-- Attractor point markers (the two fixed points everything converges to) -->
  <circle cx="88" cy="125" r="4" fill="#F87171" opacity="0.9"/>
  <circle cx="88" cy="125" r="4" fill="none" stroke="#F87171" stroke-width="1" opacity="0.5"/>
  <circle cx="168" cy="131" r="4" fill="#34D399" opacity="0.9"/>
  <circle cx="168" cy="131" r="4" fill="none" stroke="#34D399" stroke-width="1" opacity="0.5"/>

  <!-- Center crossover point -->
  <circle cx="128" cy="128" r="2.5" fill="#C4B5FD" opacity="0.8"/>
</svg>
