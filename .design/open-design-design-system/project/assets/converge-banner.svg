<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" role="img" aria-label="Converge — Autonomous AI Agent Playbooks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"></stop>
      <stop offset="60%" stop-color="#1E1B4B"></stop>
      <stop offset="100%" stop-color="#0F172A"></stop>
    </linearGradient>

    <linearGradient id="wordmarkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A5B4FC"></stop>
      <stop offset="40%" stop-color="#C4B5FD"></stop>
      <stop offset="100%" stop-color="#F0ABFC"></stop>
    </linearGradient>

    
    <linearGradient id="rygCrease" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F87171"></stop>
      <stop offset="35%" stop-color="#FBBF24"></stop>
      <stop offset="70%" stop-color="#34D399"></stop>
      <stop offset="100%" stop-color="#C4B5FD"></stop>
    </linearGradient>

    <linearGradient id="pageTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"></stop>
      <stop offset="100%" stop-color="#C4B5FD"></stop>
    </linearGradient>

    <linearGradient id="pageFold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"></stop>
      <stop offset="100%" stop-color="#5B21B6"></stop>
    </linearGradient>

    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode></feMerge>
    </filter>

    <filter id="creaseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.02"></circle>
    </pattern>
  </defs>

  
  <rect width="1200" height="400" fill="url(#bg)"></rect>
  <rect width="1200" height="400" fill="url(#grid)"></rect>

  
  <circle cx="260" cy="200" r="200" fill="#7C3AED" filter="url(#ambientGlow)" opacity="0.2"></circle>
  <circle cx="260" cy="200" r="120" fill="#A78BFA" filter="url(#ambientGlow)" opacity="0.12"></circle>

  
  <g transform="translate(80, 55)" filter="url(#markGlow)">
    
    <rect x="0" y="0" width="290" height="290" rx="6" fill="none" stroke="#E0E7FF" stroke-width="1" stroke-opacity="0.12"></rect>

    
    <polygon points="0,290 290,290 290,0" fill="url(#pageTop)" opacity="0.85"></polygon>

    
    <polygon points="0,0 0,290 290,0" fill="url(#pageFold)" opacity="0.45"></polygon>

    
    <line x1="0" y1="290" x2="290" y2="0" stroke="url(#rygCrease)" stroke-width="3" stroke-linecap="round" filter="url(#creaseGlow)"></line>

    
    <line x1="0" y1="290" x2="290" y2="0" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.5"></line>

    
    <line x1="0" y1="0" x2="0" y2="290" stroke="#C4B5FD" stroke-width="0.6" opacity="0.15"></line>
    <line x1="0" y1="0" x2="290" y2="0" stroke="#C4B5FD" stroke-width="0.6" opacity="0.15"></line>
  </g>

  
  <g transform="translate(430, 0)">
    <text x="0" y="155" font-family="ui-sans-serif,-apple-system,&#39;SF Pro Display&#39;,&#39;Inter&#39;,system-ui,sans-serif" font-size="100" font-weight="800" letter-spacing="-3.5" fill="url(#wordmarkGrad)">Converge</text>

    <text x="3" y="205" font-family="ui-sans-serif,-apple-system,&#39;SF Pro Display&#39;,&#39;Inter&#39;,system-ui,sans-serif" font-size="24" font-weight="500" letter-spacing="-0.3" fill="#E0E7FF">Autonomous AI Agent Playbooks</text>

    <text x="3" y="238" font-family="ui-sans-serif,-apple-system,&#39;SF Pro Display&#39;,&#39;Inter&#39;,system-ui,sans-serif" font-size="15" font-weight="400" fill="#A5B4FC">Agent harnessing and orchestration for complex, verifiable workflows.</text>
  </g>

  
  <line x1="0" y1="399" x2="1200" y2="399" stroke="url(#wordmarkGrad)" stroke-width="1" stroke-opacity="0.2"></line>
</svg>