<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none" role="img" aria-label="Converge">
  <defs>
    <linearGradient id="wordmarkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A5B4FC"></stop>
      <stop offset="40%" stop-color="#C4B5FD"></stop>
      <stop offset="100%" stop-color="#F0ABFC"></stop>
    </linearGradient>

    
    <linearGradient id="rygCrease" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F87171"></stop>
      <stop offset="35%" stop-color="#FBBF24"></stop>
      <stop offset="70%" stop-color="#34D399"></stop>
      <stop offset="100%" stop-color="#C4B5FD"></stop>
    </linearGradient>

    <linearGradient id="pageTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"></stop>
      <stop offset="100%" stop-color="#C4B5FD"></stop>
    </linearGradient>

    <linearGradient id="pageFold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"></stop>
      <stop offset="100%" stop-color="#5B21B6"></stop>
    </linearGradient>

    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

    <filter id="creaseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  
  <g transform="translate(10, 15)" filter="url(#markGlow)">
    
    <rect x="0" y="0" width="170" height="170" rx="4" fill="none" stroke="#E0E7FF" stroke-width="0.8" stroke-opacity="0.12"></rect>

    
    <polygon points="0,170 170,170 170,0" fill="url(#pageTop)" opacity="0.85"></polygon>

    
    <polygon points="0,0 0,170 170,0" fill="url(#pageFold)" opacity="0.45"></polygon>

    
    <line x1="0" y1="170" x2="170" y2="0" stroke="url(#rygCrease)" stroke-width="2.5" stroke-linecap="round" filter="url(#creaseGlow)"></line>

    
    <line x1="0" y1="170" x2="170" y2="0" stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round" opacity="0.5"></line>
  </g>

  
  <g transform="translate(210, 0)">
    <text x="0" y="110" font-family="ui-sans-serif,-apple-system,&#39;SF Pro Display&#39;,&#39;Inter&#39;,system-ui,sans-serif" font-size="72" font-weight="800" letter-spacing="-2.5" fill="url(#wordmarkGrad)">Converge</text>

    <text x="2" y="148" font-family="ui-sans-serif,-apple-system,&#39;SF Pro Display&#39;,&#39;Inter&#39;,system-ui,sans-serif" font-size="17" font-weight="500" letter-spacing="-0.2" fill="#E0E7FF">Autonomous AI Agent Playbooks</text>
  </g>
</svg>