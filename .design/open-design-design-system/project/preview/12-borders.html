<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Borders</title>
<!-- @dsCard group="Spacing" -->
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: transparent; }
  body { padding: 18px 22px; }
  
.row { display:flex; gap:18px; flex-wrap:wrap; }
.tile { width:160px; height:64px; background:var(--cv-bg-elev); display:flex; align-items:center; justify-content:center; font:500 12px/1.3 'JetBrains Mono',monospace; color:var(--cv-text-muted); letter-spacing:0.06em; text-transform:uppercase; }
.role { font:500 10px/1.3 'JetBrains Mono',monospace; color:var(--cv-text-dim); letter-spacing:0.06em; text-transform:uppercase; margin-top:6px; text-align:center; }
.col { display:flex; flex-direction:column; }

</style>
</head>
<body>

<div class="row">
  <div class="col"><div class="tile" style="border:1px solid var(--cv-border);">hairline</div><div class="role">default · #E7E2D1</div></div>
  <div class="col"><div class="tile" style="border:1px solid var(--cv-border-strong);">strong</div><div class="role">hover · #D1CDB8</div></div>
  <div class="col"><div class="tile" style="border:1px dashed var(--cv-border-strong);">dashed</div><div class="role">spawn-pending only</div></div>
</div>
</body></html>
