<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color · Accent — Terracotta</title>
<!-- @dsCard group="Colors" -->
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: transparent; }
  body { padding: 18px 22px; }
  .row { display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:96px; }
  .chip { height:56px; border-radius:2px; border:1px solid rgba(17,24,39,0.08); }
  .lbl { font:600 11.5px/1.3 'Inter',sans-serif; color:var(--cv-text); }
  .hex { font:500 10.5px/1.3 'JetBrains Mono',monospace; color:var(--cv-text-muted); }
  .role { font:500 10px/1.3 'JetBrains Mono',monospace; color:var(--cv-text-dim); letter-spacing:0.08em; text-transform:uppercase; }
  
.sample { background: var(--cv-bg-elev); border:1px solid var(--cv-border); padding:10px 14px; border-radius:2px; font:500 14px/1.5 'Inter',sans-serif; color: var(--cv-text); margin-top:14px; max-width:100%; }
.rules { display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; font:500 10.5px/1.4 'JetBrains Mono',monospace; color:var(--cv-text-dim); letter-spacing:0.06em; text-transform:uppercase; }
.rules b { color: var(--cv-accent-warm); margin-right:6px; font-weight:600; }

</style>
</head>
<body>

<div class="row">
  <div class="sw">
  <div class="chip" style="background:#BE5133"></div>
  <div class="lbl">accent-warm</div>
  <div class="hex">#BE5133</div>
  <div class="role">italic-em / hover</div>
</div>
  <div class="sw">
  <div class="chip" style="background:#9C3F26"></div>
  <div class="lbl">accent-hover</div>
  <div class="hex">#9C3F26</div>
  <div class="role">:hover state</div>
</div>
  <div class="sw">
  <div class="chip" style="background:#FAEFE9"></div>
  <div class="lbl">highlight-bg</div>
  <div class="hex">#FAEFE9</div>
  <div class="role">.cv-highlight</div>
</div>
</div>
<div class="sample">
  Converge runs <em>autonomous</em> agents through adaptive playbooks —
  <a href="#" class="cv-link">read the spec</a>,
  or <span class="cv-highlight">try one of the bundled examples</span>.
</div>
<div class="rules"><span><b>·</b>italic emphasis</span><span><b>·</b>link :hover</span><span><b>·</b>.cv-highlight only</span></div>
</body></html>
