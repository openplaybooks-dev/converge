<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color · Body</title>
<!-- @dsCard group="Colors" -->
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: transparent; }
  body { padding: 18px 22px; }
  .row { display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:96px; }
  .chip { height:56px; border-radius:2px; border:1px solid rgba(17,24,39,0.08); }
  .lbl { font:600 11.5px/1.3 'Inter',sans-serif; color:var(--cv-text); }
  .hex { font:500 10.5px/1.3 'JetBrains Mono',monospace; color:var(--cv-text-muted); }
  .role { font:500 10px/1.3 'JetBrains Mono',monospace; color:var(--cv-text-dim); letter-spacing:0.08em; text-transform:uppercase; }
  
</style>
</head>
<body>

<div class="row">
  <div class="sw">
  <div class="chip" style="background:#F6F4E9"></div>
  <div class="lbl">bg</div>
  <div class="hex">#F6F4E9</div>
  <div class="role">page</div>
</div>
  <div class="sw">
  <div class="chip" style="background:#EFE9D6"></div>
  <div class="lbl">bg-elev</div>
  <div class="hex">#EFE9D6</div>
  <div class="role">panel</div>
</div>
  <div class="sw">
  <div class="chip" style="background:#0B1020"></div>
  <div class="lbl">bg-code</div>
  <div class="hex">#0B1020</div>
  <div class="role">code/term</div>
</div>
  <div class="sw">
  <div class="chip" style="background:#111827"></div>
  <div class="lbl">text</div>
  <div class="hex">#111827</div>
  <div class="role">primary</div>
</div>
  <div class="sw">
  <div class="chip" style="background:#4B5563"></div>
  <div class="lbl">text-muted</div>
  <div class="hex">#4B5563</div>
  <div class="role">secondary</div>
</div>
  <div class="sw">
  <div class="chip" style="background:#9CA3AF"></div>
  <div class="lbl">text-dim</div>
  <div class="hex">#9CA3AF</div>
  <div class="role">caption</div>
</div>
  <div class="sw">
  <div class="chip" style="background:#E7E2D1"></div>
  <div class="lbl">border</div>
  <div class="hex">#E7E2D1</div>
  <div class="role">hairline</div>
</div>
  <div class="sw">
  <div class="chip" style="background:#D1CDB8"></div>
  <div class="lbl">border-str.</div>
  <div class="hex">#D1CDB8</div>
  <div class="role">hover</div>
</div>
</div>
</body></html>
