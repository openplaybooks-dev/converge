<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing · 1rem base</title>
<!-- @dsCard group="Spacing" -->
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: transparent; }
  body { padding: 18px 22px; }
  
.row { display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; }
.unit { display:flex; flex-direction:column; align-items:center; gap:6px; }
.bar { background: var(--cv-text); height:14px; border-radius:1px; }
.n { font:600 11px/1 'JetBrains Mono',monospace; color:var(--cv-text); }
.px { font:500 10px/1 'Inter',sans-serif; color:var(--cv-text-dim); }

</style>
</head>
<body>

<div class="row">
  
    <div class="unit">
      <div class="bar" style="width:4px"></div>
      <div class="n">1</div>
      <div class="px">4px</div>
    </div>
    <div class="unit">
      <div class="bar" style="width:8px"></div>
      <div class="n">2</div>
      <div class="px">8px</div>
    </div>
    <div class="unit">
      <div class="bar" style="width:12px"></div>
      <div class="n">3</div>
      <div class="px">12px</div>
    </div>
    <div class="unit">
      <div class="bar" style="width:16px"></div>
      <div class="n">4</div>
      <div class="px">16px</div>
    </div>
    <div class="unit">
      <div class="bar" style="width:24px"></div>
      <div class="n">6</div>
      <div class="px">24px</div>
    </div>
    <div class="unit">
      <div class="bar" style="width:32px"></div>
      <div class="n">8</div>
      <div class="px">32px</div>
    </div>
    <div class="unit">
      <div class="bar" style="width:40px"></div>
      <div class="n">10</div>
      <div class="px">40px</div>
    </div>
    <div class="unit">
      <div class="bar" style="width:48px"></div>
      <div class="n">12</div>
      <div class="px">48px</div>
    </div>
    <div class="unit">
      <div class="bar" style="width:64px"></div>
      <div class="n">16</div>
      <div class="px">64px</div>
    </div>
    <div class="unit">
      <div class="bar" style="width:80px"></div>
      <div class="n">20</div>
      <div class="px">80px</div>
    </div>
    <div class="unit">
      <div class="bar" style="width:96px"></div>

      <div class="px">96px</div>
    </div>
    <div class="unit">
      <div class="bar" style="width:128px"></div>

      <div class="px">128px</div>
    </div>
</div>
</body></html>
