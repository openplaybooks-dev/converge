name: default
description: Mixed-model playbook — one task per AI backend (Claude + Codex).
tasks:
  - id: claude-hello
    agent: claude
    prompt: |
      Create a file called CLAUDE_READY.txt in the project root with the content
      "claude-done". This is a simple one-shot task to verify the Claude
      backend is wired correctly.
    outputs:
      - CLAUDE_READY.txt
    checks:
      - id: claude-file-exists
        cmd: test -f CLAUDE_READY.txt
        description: CLAUDE_READY.txt exists
      - id: claude-has-content
        cmd: grep -q "claude-done" CLAUDE_READY.txt
        description: File contains claude-done

  - id: codex-hello
    agent: codex
    prompt: |
      Create a file called CODEX_READY.txt in the project root with the content
      "codex-done". This is a simple one-shot task to verify the Codex
      backend is wired correctly.
    outputs:
      - CODEX_READY.txt
    checks:
      - id: codex-file-exists
        cmd: test -f CODEX_READY.txt
        description: CODEX_READY.txt exists
      - id: codex-has-content
        cmd: grep -q "codex-done" CODEX_READY.txt
        description: File contains codex-done
