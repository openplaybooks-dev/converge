name: default
description: Seeding playbook — parent task seeds children dynamically via
             CLI spawn commands. The parent is a pure seed container and does
             not create files itself. Children validate themselves.
tasks:
  - id: parent
    prompt: |
      This is a seed container task. Emit only converge spawn commands for
      child tasks. Do NOT create any files yourself — the children
      will create their own output files.
