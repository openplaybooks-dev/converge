name: default
description: >-
  Three-level CLI seeding playbook. Only `parent` is static; level-2
  and level-3 tasks are CLI-spawned at runtime via passthrough bodies.
  No `tasks:` block — the framework auto-discovers `tasks/parent/TASK.md`.

run:
  maxTaskAttempts: 3
  maxDuration: 5m
  workers: 3
