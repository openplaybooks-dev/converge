name: PR review (Converge) — manual

# Converge reviews a pull request when a maintainer triggers this workflow.
# The verdict lands as a PR comment; it never gates merge.
#
# The playbook lives at .converge/playbooks/ci-pr-review/ and is itself a
# contribution surface — edit the prompt and open a PR.
#
# Triggering: Actions tab → "PR review (Converge) — manual" → Run workflow
# → fill in the PR number. Only repo members/collaborators may run it.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Member-only gate
    runs-on: ubuntu-latest
    steps:
      - name: Verify actor has write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          PERM=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "$ACTOR has permission: $PERM"
          case "$PERM" in
            admin|maintain|write)
              echo "✓ Authorized" ;;
            *)
              echo "::error::Only repo members with write access may run this workflow."
              exit 1 ;;
          esac

  review:
    name: Run ci-pr-review playbook
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Converge CLI
        run: pnpm --filter @converge/cli --filter @converge/core --filter @converge/claudefn --filter @converge/agentfn build

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Materialize PR inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          mkdir -p .converge/inputs
          gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" > .converge/inputs/pr-diff.patch
          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json title,body,author,baseRefName,headRefName > .converge/inputs/pr-meta.json
          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json files > .converge/inputs/changed-files.json

      - name: Run ci-pr-review playbook
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.minimax.io/anthropic
          ANTHROPIC_MODEL: MiniMax-M2.7
        run: |
          mkdir -p .converge/playbooks/ci-pr-review/output
          node packages/cli/dist/index.js run \
            --playbook=ci-pr-review \
            --max-duration=10m \
            --fail-fast

      - name: Post review as PR comment
        if: always() && hashFiles('.converge/playbooks/ci-pr-review/output/review.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          {
            echo "<!-- ci-pr-review -->"
            echo "🤖 **Converge review** — triggered by @${{ github.actor }} ([playbook](.converge/playbooks/ci-pr-review/))"
            echo ""
            cat .converge/playbooks/ci-pr-review/output/review.md
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Upload journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-pr-review-journal-${{ inputs.pr_number }}
          path: .converge/journal/ci-pr-review/
          if-no-files-found: ignore
          retention-days: 7
