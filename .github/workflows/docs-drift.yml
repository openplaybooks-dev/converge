name: Docs drift (Converge) — manual

# Flag stale documentation when a PR touches code referenced by a doc
# page's `sources:` frontmatter. Triggered manually by a maintainer
# from the Actions tab; never runs automatically.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to check (leave blank for the current main)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-drift-${{ inputs.pr_number || 'main' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Member-only gate
    runs-on: ubuntu-latest
    steps:
      - name: Verify actor has write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          PERM=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "$ACTOR has permission: $PERM"
          case "$PERM" in
            admin|maintain|write) echo "✓ Authorized" ;;
            *) echo "::error::Only repo members with write access may run this workflow."; exit 1 ;;
          esac

  drift:
    name: Run ci-docs-drift playbook
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref (PR head or main)
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          else
            SHA=$(git ls-remote "https://github.com/${{ github.repository }}.git" main | awk '{print $1}')
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @converge/cli --filter @converge/core --filter @converge/claudefn --filter @converge/agentfn build

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Materialize inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          mkdir -p .converge/inputs
          if [ -n "$PR_NUMBER" ]; then
            gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json files \
              | jq -r '.files[].path' \
              | grep -E '^(packages/.*\.(ts|md)|docs/.*\.md|README\.md)$' \
              > .converge/inputs/changed-source-files.txt || true
          else
            # Fallback: diff main against the previous merge commit
            git diff HEAD~1 --name-only \
              | grep -E '^(packages/.*\.(ts|md)|docs/.*\.md|README\.md)$' \
              > .converge/inputs/changed-source-files.txt || true
          fi
          touch .converge/inputs/changed-source-files.txt

      - name: Run ci-docs-drift playbook
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.minimax.io/anthropic
          ANTHROPIC_MODEL: MiniMax-M2.7
        run: |
          mkdir -p .converge/playbooks/ci-docs-drift/output
          node packages/cli/dist/index.js run \
            --playbook=ci-docs-drift \
            --max-duration=10m \
            --fail-fast

      - name: Post drift report as PR comment
        if: always() && inputs.pr_number != '' && hashFiles('.converge/playbooks/ci-docs-drift/output/drift-report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if grep -q '^No documented sources affected\.$' .converge/playbooks/ci-docs-drift/output/drift-report.md; then
            echo "No drift, skipping comment."
            exit 0
          fi
          {
            echo "<!-- ci-docs-drift -->"
            echo "📚 **Docs drift** — triggered by @${{ github.actor }} ([playbook](.converge/playbooks/ci-docs-drift/))"
            echo ""
            cat .converge/playbooks/ci-docs-drift/output/drift-report.md
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-docs-drift-${{ inputs.pr_number || 'main' }}
          path: .converge/playbooks/ci-docs-drift/output/drift-report.md
          if-no-files-found: ignore
          retention-days: 14
