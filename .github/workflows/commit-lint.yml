name: Commit lint

# Hard-block on PR titles that don't match CLAUDE.md §5:
#   type(scope): subject
# type ∈ {feat, fix, chore, refactor, docs, test, perf, revert}
# scope is optional, lowercase, slash-or-dash separated.
# subject is lowercase, imperative, no trailing period.
#
# Wiring the ci-commit-lint playbook for AI-suggested fixes is a v2
# follow-up.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Regex check
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|chore|refactor|docs|test|perf|revert)(\([a-z0-9][a-z0-9/_.-]*\))?: [a-z].*[^.]$'
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title does not match CLAUDE.md §5 convention."
            echo "::error::Expected: type(scope): subject"
            echo "::error::Got:      $TITLE"
            echo ""
            echo "Allowed types: feat, fix, chore, refactor, docs, test, perf, revert"
            echo "Scope is optional, lowercase, slash-or-dash separated."
            echo "Subject is lowercase, imperative, no trailing period."
            exit 1
          fi
          echo "✓ Title matches convention: $TITLE"
