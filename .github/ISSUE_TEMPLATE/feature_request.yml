name: Feature request
description: Suggest a new capability, a workflow improvement, or a new example.
title: '[Feature]: '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For broad ideas or "what if" thinking, please
        open a [discussion](https://github.com/openplaybooks-dev/converge/discussions)
        first — issues are best for concrete, well-scoped proposals.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 'What problem does this solve? What are you trying to do today that is hard, slow, or impossible?'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: 'Describe how Converge should behave. Include CLI shape, playbook syntax, or API sketches if relevant.'
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: 'Other approaches you weighed and why you settled on the proposal above.'
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which part of Converge does this affect?
      options:
        - '@openplaybooks/converge-core (engine, DAG, state machine)'
        - '@openplaybooks/converge-cli (CLI surface, commands, flags)'
        - '@openplaybooks/studio (web UI)'
        - 'Provider pack (claude/gemini/kimi/qwen/codex/etc.)'
        - 'Bundled skills (converge-planning, converge-control)'
        - 'Examples / playbooks'
        - 'Documentation'
        - 'Other'
    validations:
      required: true

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/openplaybooks-dev/converge/blob/main/CODE_OF_CONDUCT.md).
          required: true
