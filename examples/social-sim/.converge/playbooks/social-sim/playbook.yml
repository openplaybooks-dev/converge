name: social-sim
description: >-
  Persona-driven OASIS-style social simulation. The bootstrap task emits a
  linear chain of N tick tasks (--depends-on); each tick spawns three phase
  children (setup → simulate → analyze); simulate fans out one persona-tick
  task per persona. State lives in runs/<runId>/; vault notes mirror it as
  Obsidian-navigable markdown.

key: scenario

inputs:
  scenario:       { default: "misinfo", description: "misinfo | polarization | recommender-ab | custom | <free-text>" }
  populationSize: { default: 10,     description: "Persona count (= persona-tick tasks per tick)" }
  steps:          { default: 3,      description: "Simulation ticks" }
  recommender:    { default: "hot-score", description: "random | hot-score | embedding" }
  seedPosts:      { default: 1,      description: "Seed posts injected at tick 0 to kick off the scenario" }
  seed:           { default: 42,     description: "Deterministic RNG seed for persona generation + tie-breaks" }
  runId:          { default: "",     description: "Run directory under runs/. Empty default = bootstrap auto-generates run-<UTC>" }

run:
  maxIterations: 30
  maxTaskAttempts: 3
  maxDuration: 60m
  resume: true
