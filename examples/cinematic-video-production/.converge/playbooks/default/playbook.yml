name: default
description: |
  Idea → full narrative clip library. Develops story, casts characters, builds the world,
  breaks down shots, generates references and keyframes, renders video clips, lays down
  audio, and emits a clips.json manifest ready for a non-linear editor.

  ## Facts

  - FACT: Image model is Nano-banana (Gemini 2.5 Flash Image) — Source: project choice
  - FACT: Video model is adapter-layer; backend is configured under skills/video-generate/backends/ — Source: project choice
  - FACT: Full audio pipeline: dialogue TTS + SFX + score — Source: project choice
  - FACT: Output is clips/ folder + clips.json (no auto-assembly) — Source: project choice
  - FACT: Consistency enforced by locked refs + deterministic seeds + build-shot-prompt.js — Source: playbook design
  - FACT: Shot count is derived from target_duration_minutes / avg_shot_duration_s — Source: playbook design

vars:
  target_duration_minutes: 20
  avg_shot_duration_s: 6
  max_shots_hard_cap: 800

run:
  mode: oneoff
  maxIterations: 2000
  maxTaskAttempts: 3
  stall:
    maxConsecutive: 3
    backoffMs: 60000

tasks:
  - id: 01-story
  - id: 02-cast
    depends_on:
      - 01-story
  - id: 03-world
    depends_on:
      - 01-story
  - id: 04-style
    depends_on:
      - 01-story
  - id: 05-breakdown
    depends_on:
      - 01-story
      - 02-cast
      - 03-world
      - 04-style
  - id: 06-storyboard
    depends_on:
      - 05-breakdown
  - id: 07-keyframes
    depends_on:
      - 06-storyboard
  - id: 08-shots
    depends_on:
      - 07-keyframes
  - id: 09-audio
    depends_on:
      - 05-breakdown
  - id: 10-assemble
    depends_on:
      - 08-shots
      - 09-audio

checks:
  - id: idea-exists
    cmd: test -f idea.md
    description: User's idea file is present at project root
  - id: screenplay-exists
    cmd: test -f screenplay.fountain
    description: Screenplay was generated
  - id: shots-exists
    cmd: test -f shots.json
    description: Shot list was generated
  - id: shots-within-cap
    cmd: node -e "const s=require('./shots.json');if(s.length>800){process.exit(1)}"
    description: Shot count is within max_shots_hard_cap
  - id: clips-dir-exists
    cmd: test -d clips
    description: Clips folder was created
  - id: clips-manifest-exists
    cmd: test -f clips.json
    description: Final clips manifest was emitted
  - id: manifest-valid
    cmd: node scripts/verify-manifest.js
    description: clips.json matches shots.json and every referenced file exists
