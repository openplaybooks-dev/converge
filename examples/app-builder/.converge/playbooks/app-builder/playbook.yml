name: app-builder
description: >-
  Reactive goal-driven app builder. Reads idea.md, decomposes into goals via
  AI, runs adaptive epochs that build features one at a time. Goals evolve
  reactively — new sub-goals are discovered as features are built. Stops when
  all goals are satisfied and the app is complete.

run:
  maxIterations: 30
  maxTaskAttempts: 3
  maxDuration: 8h
  stall:
    maxConsecutive: 3
    backoffMs: 30000

# No static goals — the seed creates goals.json from idea.md.
# Goals are reactive: they evolve as the app is built.

tasks:
  - path: build
