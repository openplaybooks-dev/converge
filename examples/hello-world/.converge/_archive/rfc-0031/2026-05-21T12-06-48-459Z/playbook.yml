---
name: default
description: Two static tasks — first produces a JSON greeting, then a downstream task renders it to plain text. Smallest end-to-end Converge demo.
run:
  mode: oneoff
  maxTaskAttempts: 3
tasks:
  - path: 01-create-greeting
  - path: 02-render-hello
goals:
  - id: outputs-exist
    description: Both output files exist
    checks:
      - id: greeting-exists
        cmd: test -f output/greeting.json
      - id: hello-exists
        cmd: test -f output/hello.txt
