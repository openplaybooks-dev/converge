---
name: default
description: Simplest possible playbook — creates a file and verifies it exists.
tasks:
  - id: create-file
    prompt: |
      Create a file called output.txt in the project root with the content
      "Hello, World!". Then verify it exists by running the check command.
    outputs:
      - output.txt
    checks:
      - id: file-exists
        cmd: test -f output.txt
      - id: has-content
        cmd: grep -q "Hello" output.txt
goals:
  - id: output-exists
    description: The output file exists.
    checks:
      - id: check
        cmd: test -f output.txt

