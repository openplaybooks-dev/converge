name: game-assets-video
description: |
  Game Assets Generation Playbook — video-based animation variant.
  Character spritesheets are produced by generating a short video clip from the
  canonical reference, extracting frames, and compositing them into a 4×2 grid
  atlas compatible with the standard game-assets export pipeline. Props, tile
  maps, and backgrounds still use Nano-banana (Gemini 2.5 Flash Image).

run:
  mode: oneoff

vars:
  sprite_resolution: 128
  sprites_per_row: 4
  animation_states:
    - idle
    - walk
  asset_types:
    - characters
    - objects
    - backgrounds
  engine_targets:
    - godot
    - unity
    - raw
  max_characters: 3
  max_states_per_character: 2
  max_objects: 5
  max_backgrounds: 2
  stop_after: sprites


ai:
  default: claude
  providers:
    # Claude CLI - configured to use MiniMax's Anthropic-compatible API
    claude: 
      provider: claude
      env:
        ANTHROPIC_BASE_URL: "https://api.minimax.io/anthropic"
        # ANTHROPIC_AUTH_TOKEN: "${MINIMAX_API_KEY}"
        ANTHROPIC_AUTH_TOKEN: sk-cp-bvkVOmd1qhcraC7QAI6BOltQJuCYYardqYsRVjkr2ZiCjz7Zn-v807yBVZuXlIfS543flUwK_wBuszNgIBZKOQTs1dF5DUdRvfnIHyaT6MxgAh409MyKCLI
        API_TIMEOUT_MS: "3000000"
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        ANTHROPIC_MODEL: "MiniMax-M2.7"
        ANTHROPIC_SMALL_FAST_MODEL: "MiniMax-M2.7"
        ANTHROPIC_DEFAULT_SONNET_MODEL: "MiniMax-M2.7"
        ANTHROPIC_DEFAULT_OPUS_MODEL: "MiniMax-M2.7"
        ANTHROPIC_DEFAULT_HAIKU_MODEL: "MiniMax-M2.7"