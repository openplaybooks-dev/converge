<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greeting</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">Hello, World!</h1>
    <p class="text-gray-600 mb-4">Welcome</p>
    <div class="text-sm text-gray-500 space-y-1">
      <p><span class="font-medium">Language:</span> en</p>
      <p><span class="font-medium">Timestamp:</span> 2026-05-30T00:00:00Z</p>
    </div>
  </div>
</body>
</html>
