name: scientific-research
description: Autonomous scientific paper research — iterative evidence synthesis with statistical rigor, GRADE methodology, and academic paper generation.
key: question
inputs:
  question: { required: true, description: The research question to investigate }
  domain: { default: "general", description: Research domain for context }
  targetScore: { default: "70", description: "Minimum quality score (0-100) for convergence" }

run:
  mode: loop
  maxIterations: 20
  maxTaskAttempts: 3
  maxDuration: 8h
  resume: true
  stall:
    maxConsecutive: 3
    backoffMs: 30000
