<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#F4F2EE",
                        "on-background": "#1A1C19",
                        "secondary": "#52634F",
                        "on-secondary": "#FFFFFF",
                        "surface": "#F4F2EE",
                        "primary": "#006D32",
                        "on-primary": "#FFFFFF",
                        "tertiary": "#39656B",
                        "error": "#BA1A1A",
                        "mint": "#D1EEDD",
                        "on-mint": "#00391C",
                        "peach": "#FFDAD6",
                        "on-peach": "#410002",
                        "honey": "#FFECB3",
                        "on-honey": "#241A00"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "1.75rem", // 28px
                        "xl": "2rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; background-color: #F4F2EE; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .safe-state { background-color: #D1EEDD; color: #00391C; }
        .weak-state { background-color: #FFECB3; color: #241A00; }
        .lost-state { background-color: #FFDAD6; color: #410002; }
    </style>
</head>
<body class="bg-surface text-on-background min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md flex items-center justify-between px-6 h-20">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white shadow-sm">
<img alt="Parent Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA3mhnbHiAGcoJSuOQu1TF3eSJnvWp_UNbftki7P9KaHmm2J8AFzTasOAxtQju2S6j-ZOg95vhG20BZSo4oJeSigh9aT4RlRI4CljK2-RGku93IXyIu6jQnN5OUVYF9T8U-N8S4cjbqRiN_WkZUD9nCaAJ_vhXQr34Qg7keTtQmQCffjXRKpB7yyvoqVxAfFPyihAjWEo6VZpUZ6xdnerLATOiw_GA9Ca7ygMgVnffbU6n5h1b8h35JKBxsgcFQO3hRW3-jqvrvtjrv"/>
</div>
<h1 class="text-xl font-extrabold tracking-tight text-on-background">BabyGuard</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/5 transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<main class="pt-24 pb-32 px-6 max-w-lg mx-auto space-y-8">
<!-- Status Section -->
<section class="flex flex-col items-center text-center">
<div class="inline-flex items-center gap-2 safe-state px-6 py-2.5 rounded-full font-bold text-base shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
                Đang an toàn
            </div>
<div class="mt-6 flex flex-col items-center">
<h2 class="text-3xl font-extrabold text-on-background">Bé Na</h2>
<p class="mt-1 text-secondary font-medium text-sm">Còn Mẹ đang gần beacon</p>
</div>
</section>
<!-- Map Card -->
<section class="relative h-72 w-full rounded-lg overflow-hidden bg-surface-container-lowest shadow-sm">
<img alt="Map" class="w-full h-full object-cover grayscale-[0.2] brightness-[0.95]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_6MZ0wh_8xIFXdyD3lL0lHjtSsUeecgov4GE8R_V1SgVBcnlfMekcovUvyJIPZ0HHgqb9hWeDwpwJQurnCxiqFWUI3V_cs8cthvP6heT-lTOkjQVI2JsmjVbwK60c1R1J-z11rI2bTAuem9kKuyUd55M9QlC9dZp3TJ1FQ93eDyxutIgUf3PEsZJN0OWpX8-guHfiQ5JpjrkTR4RPqSneEbdoRdFbL7YQCpxS4ZqZrqO2Oolj9N5oyAsTIEjObRBdyikootSg9g5p"/>
<!-- Beacon Point -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
<div class="relative flex items-center justify-center">
<div class="absolute w-12 h-12 bg-primary/20 rounded-full animate-ping"></div>
<div class="relative w-10 h-10 bg-primary rounded-full border-4 border-white shadow-xl flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[18px]" style="font-variation-settings: 'FILL' 1;">child_care</span>
</div>
</div>
</div>
<!-- Last Seen Label -->
<div class="absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur-md py-3 px-5 rounded-lg flex justify-between items-center shadow-md">
<div class="flex flex-col">
<span class="text-[10px] uppercase tracking-widest font-bold text-secondary">Vị trí gần nhất</span>
<span class="font-bold text-on-background">Phòng khách • 2 phút trước</span>
</div>
<button class="bg-primary text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[20px]">near_me</span>
</button>
</div>
</section>
<!-- Beacon Strip -->
<section class="bg-surface-container-lowest p-6 rounded-lg shadow-sm border border-black/5">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-mint/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sensors</span>
</div>
<div>
<h3 class="text-lg font-bold">Bé Na</h3>
<p class="text-secondary text-xs font-medium">Đang ở gần • 98% Pin</p>
</div>
</div>
<button class="flex items-center gap-1 py-2 px-3 rounded-full hover:bg-black/5 text-primary font-bold text-sm transition-colors">
                    Chi tiết beacon
                    <span class="material-symbols-outlined text-[18px]">chevron_right</span>
</button>
</div>
</section>
<!-- Push Mute Section -->
<section class="bg-white/60 rounded-lg p-6 space-y-4">
<div class="flex flex-col gap-1">
<h3 class="text-base font-bold tracking-tight">Tạm dừng thông báo</h3>
<p class="text-secondary text-xs leading-relaxed">Tắt cảnh báo tạm thời khi bạn đang ở cùng bé.</p>
</div>
<div class="flex gap-3">
<button class="flex-1 bg-white border border-black/5 py-3.5 rounded-full font-bold text-sm shadow-sm hover:bg-white active:scale-95 transition-all">5 phút</button>
<button class="flex-1 bg-white border border-black/5 py-3.5 rounded-full font-bold text-sm shadow-sm hover:bg-white active:scale-95 transition-all">10 phút</button>
<button class="flex-1 bg-white border border-black/5 py-3.5 rounded-full font-bold text-sm shadow-sm hover:bg-white active:scale-95 transition-all">15 phút</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 pb-safe bg-white/90 backdrop-blur-xl border-t border-black/5 shadow-2xl">
<div class="flex justify-around items-center h-20 px-4 max-w-lg mx-auto">
<a class="flex flex-col items-center justify-center text-primary" href="#">
<span class="material-symbols-outlined text-[26px]" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-[10px] font-bold mt-1">Trang chủ</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary/60 hover:text-secondary transition-colors" href="#">
<span class="material-symbols-outlined text-[26px]">devices</span>
<span class="text-[10px] font-bold mt-1">Thiết bị</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary/60 hover:text-secondary transition-colors" href="#">
<span class="material-symbols-outlined text-[26px]">security</span>
<span class="text-[10px] font-bold mt-1">An toàn</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary/60 hover:text-secondary transition-colors" href="#">
<span class="material-symbols-outlined text-[26px]">settings</span>
<span class="text-[10px] font-bold mt-1">Cài đặt</span>
</a>
</div>
</nav>
</body></html>
