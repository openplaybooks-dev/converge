<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BabyGuard — Lời mời theo dõi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Manrope', sans-serif; background: var(--surface); }
</style>
</head>
<body>

<!--
  Overlay type: dialog (showDialog, barrierDismissible=false).
  The outer .scaffold + scrim represent the dimmed parent screen behind the dialog.
  The .dialog node is the actual InviteAccept widget tree.
-->
<div class="scaffold" data-bg="surface" data-overlay="dialog">

  <!-- Dimmed scrim representing the parent (co-guardians-list) behind the modal -->
  <div class="stack" data-bg="onSurface" data-opacity="0.32" data-scrim="true">

    <!-- Dialog container — Material Dialog with insetPadding 24h/40v, lg radius -->
    <div class="dialog" data-bg="surfaceContainerLowest" data-radius="lg" data-max-width="520"
         data-barrier-dismissible="false" data-use-root-navigator="true"
         role="dialog" aria-modal="true" aria-labelledby="invite-accept-title">

      <!-- Body region -->
      <div class="column" data-bg="surfaceContainerLowest" data-p="lg|lg" data-gap="lg" data-cross-axis="center">

        <!-- 9.1 Avatar with shield badge -->
        <div class="stack" data-widget="AvatarWithShieldBadge" data-size="96">
          <div class="stack" data-bg="tertiaryContainer" data-radius="full" data-animate="pulse" aria-hidden="true"></div>
          <img class="avatar"
               src="https://lh3.googleusercontent.com/aida-public/AB6AXuCVq9tdpncLEkYm1ctPHgu7eFUvj4vxjI8TaVt1z7IClz4sutuWXcX_z9MOD7WjF-ir_so2ySpJMfrs5Bk7BPegSIVBEaupNHdssmp2qGhYHuyuV_IM0WNiNApW0EYxroPSOsc-KjBujQxr6ifudvUSUR5Z81DUt8m0LxHL0viQXv_-OhQexoGdrSs255JgrHtmnYEs-TI1bt3NPBWDreAwSvuHFcpUW3zpi_Cz1rSYImeh_zlTnBGaRVxVc7kxAKenLiyFvqgPrikH"
               alt="Bé Na"/>
          <div class="badge" data-bg="tertiary" data-color="onTertiary" data-position="bottom-right">
            <svg class="icon" data-name="shield" data-size="20" data-color="onTertiary" data-fill="1" aria-hidden="true"></svg>
          </div>
        </div>

        <!-- 9.2 Title block: subject name + inviter row -->
        <div class="column" data-gap="xs" data-cross-axis="center">
          <span id="invite-accept-title" class="headline-large" data-color="onSurface" data-font="display">Bé Na</span>
          <div class="row" data-gap="sm" data-main-axis="center">
            <span class="body-medium" data-color="onSurfaceVariant">Mẹ đã mời bạn</span>
            <span class="chip" data-widget="InviterChip" data-bg="surfaceContainerHigh" data-color="onSurfaceVariant" data-radius="full" data-p="sm|xs">
              <span class="label-small">Người sở hữu</span>
            </span>
          </div>
        </div>

        <!-- 9.3 Permission bullets — Column of two InfoRow widgets -->
        <div class="column" data-gap="md" data-widget="PermissionList">

          <div class="row" data-widget="InfoRow" data-gap="md" data-cross-axis="start">
            <div class="stack" data-bg="tertiaryContainer" data-radius="full" data-w="40" data-h="40" data-main-axis="center" data-cross-axis="center">
              <svg class="icon" data-name="notifications_active" data-size="20" data-color="tertiary" aria-hidden="true"></svg>
            </div>
            <span class="body-medium expanded" data-color="onSurfaceVariant">
              Bằng cách chấp nhận, bạn sẽ nhận được thông báo khi beacon này mất kết nối
            </span>
          </div>

          <div class="row" data-widget="InfoRow" data-gap="md" data-cross-axis="start">
            <div class="stack" data-bg="surfaceContainerHigh" data-radius="full" data-w="40" data-h="40" data-main-axis="center" data-cross-axis="center">
              <svg class="icon" data-name="group_off" data-size="20" data-color="secondary" aria-hidden="true"></svg>
            </div>
            <span class="body-medium expanded" data-color="onSurfaceVariant">
              Bạn có thể rời nhóm theo dõi bất kỳ lúc nào
            </span>
          </div>

        </div>

        <!-- 9.4 Action row — stacked, full-width buttons -->
        <div class="column" data-gap="sm">
          <button class="filled-btn" data-bg="onSurface" data-color="surface" data-radius="full" data-h="56"
                  data-handler="action:accept-invitation" data-result="InviteAcceptResult.accepted"
                  data-autofocus="true" aria-label="Chấp nhận lời mời">
            <span class="label-large">Chấp nhận</span>
          </button>
          <button class="text-btn" data-color="onSurfaceVariant" data-h="56"
                  data-handler="action:decline-invitation" data-result="InviteAcceptResult.declined"
                  aria-label="Từ chối lời mời">
            <span class="label-large">Từ chối</span>
          </button>
        </div>

      </div>

      <!-- 9.5 Trust footer strip -->
      <div class="row" data-bg="surfaceContainerLow" data-p="md|md" data-gap="sm" data-main-axis="center">
        <svg class="icon" data-name="verified_user" data-size="16" data-color="onSurfaceVariant" data-fill="1" aria-hidden="true"></svg>
        <span class="label-small" data-color="onSurfaceVariant">Bảo mật bởi hệ thống mã hóa BabyGuard</span>
      </div>

    </div>

  </div>

</div>

</body>
</html>
