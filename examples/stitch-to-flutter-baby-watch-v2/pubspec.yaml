name: baby_watch
description: Child safety beacon companion app built with Flutter — detects when a child is left behind by monitoring BLE beacons.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  gap: ^3.0.1
  intl: ^0.20.2
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  flutter_blue_plus: ^2.2.1
  flutter_beacon: ^0.5.1
  permission_handler: ^12.0.1
  flutter_local_notifications: ^21.0.0
  flutter_background_service: ^5.1.0
  geolocator: ^14.0.2
  sqflite: ^2.4.2+1
  path: ^1.9.1
  vibration: ^3.1.8
  just_audio: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  custom_lint: 0.7.6

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/alert.mp3
