<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Mood Log — Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        canvas: '#EDE8F7',
        surface: '#FFFFFF',
        ink: '#2A2A3A',
        quartz: '#8B8B9C',
        coral: '#F28B8B',
        'coral-tint': 'rgba(242, 139, 139, 0.12)',
        lilac: '#8B7ED8',
        'lilac-tint': 'rgba(139, 126, 216, 0.14)',
        'chip-bg': 'rgba(139, 126, 216, 0.08)',
        divider: 'rgba(42, 42, 58, 0.06)',
        backdrop: 'rgba(42, 42, 58, 0.24)',
        ivory: '#FDF9F8',
        error: '#E85C5C',
      },
      fontFamily: {
        'jakarta': ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
      },
      boxShadow: {
        'subtle': '0 2px 8px rgba(139, 126, 216, 0.08)',
        'standard': '0 4px 20px rgba(139, 126, 216, 0.12)',
        'prominent': '0 8px 32px rgba(139, 126, 216, 0.14)',
        'sheet': '0 -8px 32px rgba(139, 126, 216, 0.16)',
      },
    }
  }
}
</script>
<style>
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: #E8E8E8;
  display: flex;
  justify-content: center;
  padding: 32px 16px;
  min-height: 100vh;
}
.phone {
  width: 375px;
  min-height: 812px;
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 64px rgba(0,0,0,0.2);
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim-card { animation: fade-up 450ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
@keyframes slide-up {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.anim-sheet { animation: slide-up 400ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="phone" role="application" aria-label="Bloom mood logging overlay">
  <div data-flutter="scaffold">
  <div class="flex flex-col min-h-screen bg-canvas">

    <!-- Dim backdrop -->
    <div class="absolute inset-0 z-[55]" style="background: rgba(42, 42, 58, 0.24);"
         aria-hidden="true"></div>

    <!-- Bottom Sheet -->
    <div class="bottom-sheet" data-flutter="bottom-sheet" data-bg="surface"
         role="dialog" aria-modal="true" aria-label="Mood logging sheet">
    <div class="absolute bottom-0 left-0 right-0 z-[60] bg-surface rounded-t-[28px] shadow-sheet anim-sheet"
         style="max-height: 85%;">

      <div class="column flex flex-col pb-8">

        <!-- Drag Handle -->
        <div class="flex justify-center pt-3 pb-1" aria-hidden="true">
          <div class="w-10 h-1 rounded-full" style="background: rgba(139, 126, 216, 0.08);"></div>
        </div>

        <!-- Title -->
        <h2 class="text-left px-5 pt-4 pb-5 text-2xl font-bold text-ink"
            style="font-size: 1.5rem; line-height: 1.25; letter-spacing: -0.015em;"
            data-color="primary">Log Your Mood</h2>

        <!-- Content -->
        <div class="column flex flex-col gap-6 px-5">

          <!-- Mood Selector Section -->
          <div class="column flex flex-col gap-3 anim-card" style="animation-delay: 80ms;">
            <label class="text-lg font-semibold text-ink" style="font-size: 1.125rem;">How are you feeling?</label>
            <div class="row flex items-center justify-between" role="radiogroup" aria-label="Mood level, select 1 to 5">

              <!-- Mood 1: Awful (unselected) -->
              <div class="column flex flex-col items-center gap-1.5">
                <button class="flex items-center justify-center w-12 h-12 rounded-full"
                        style="background: rgba(139, 126, 216, 0.08); min-width: 48px; min-height: 48px;"
                        aria-label="Awful, mood level 1 of 5"
                        role="radio" aria-checked="false">
                  <svg class="w-6 h-6 text-quartz" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-name="sentiment_very_dissatisfied" data-size="24">
                    <!-- sentiment_very_dissatisfied -->
                    <circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
                  </svg>
                </button>
                <span class="text-sm font-medium text-quartz" style="font-size: 0.875rem;">Awful</span>
              </div>

              <!-- Mood 2: Bad (unselected) -->
              <div class="column flex flex-col items-center gap-1.5">
                <button class="flex items-center justify-center w-12 h-12 rounded-full"
                        style="background: rgba(139, 126, 216, 0.08); min-width: 48px; min-height: 48px;"
                        aria-label="Bad, mood level 2 of 5"
                        role="radio" aria-checked="false">
                  <svg class="w-6 h-6 text-quartz" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-name="sentiment_dissatisfied" data-size="24">
                    <!-- sentiment_dissatisfied -->
                    <circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
                  </svg>
                </button>
                <span class="text-sm font-medium text-quartz" style="font-size: 0.875rem;">Bad</span>
              </div>

              <!-- Mood 3: Okay (selected) -->
              <div class="column flex flex-col items-center gap-1.5">
                <button class="flex items-center justify-center w-12 h-12 rounded-full"
                        style="background: rgba(242, 139, 139, 0.12); border: 2px solid #F28B8B; min-width: 48px; min-height: 48px;"
                        aria-label="Okay, mood level 3 of 5, selected"
                        role="radio" aria-checked="true">
                  <svg class="w-6 h-6 text-coral" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-name="sentiment_neutral" data-size="24">
                    <!-- sentiment_neutral -->
                    <circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
                  </svg>
                </button>
                <span class="text-sm font-medium text-coral" style="font-size: 0.875rem;">Okay</span>
              </div>

              <!-- Mood 4: Good (unselected) -->
              <div class="column flex flex-col items-center gap-1.5">
                <button class="flex items-center justify-center w-12 h-12 rounded-full"
                        style="background: rgba(139, 126, 216, 0.08); min-width: 48px; min-height: 48px;"
                        aria-label="Good, mood level 4 of 5"
                        role="radio" aria-checked="false">
                  <svg class="w-6 h-6 text-quartz" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-name="sentiment_satisfied" data-size="24">
                    <!-- sentiment_satisfied -->
                    <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
                  </svg>
                </button>
                <span class="text-sm font-medium text-quartz" style="font-size: 0.875rem;">Good</span>
              </div>

              <!-- Mood 5: Great (unselected) -->
              <div class="column flex flex-col items-center gap-1.5">
                <button class="flex items-center justify-center w-12 h-12 rounded-full"
                        style="background: rgba(139, 126, 216, 0.08); min-width: 48px; min-height: 48px;"
                        aria-label="Great, mood level 5 of 5"
                        role="radio" aria-checked="false">
                  <svg class="w-6 h-6 text-quartz" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-name="sentiment_very_satisfied" data-size="24">
                    <!-- sentiment_very_satisfied -->
                    <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
                  </svg>
                </button>
                <span class="text-sm font-medium text-quartz" style="font-size: 0.875rem;">Great</span>
              </div>

            </div>
          </div>

          <!-- Energy Level Section -->
          <div class="column flex flex-col gap-3 anim-card" style="animation-delay: 160ms;">
            <label class="text-lg font-semibold text-ink" style="font-size: 1.125rem;">Energy Level</label>
            <div class="column flex flex-col items-center gap-2">
              <span class="font-extrabold text-lilac" style="font-size: 2.25rem; line-height: 1.1; letter-spacing: -0.015em;"
                    aria-label="Energy level 3 of 5">3</span>
              <!-- Slider track -->
              <div class="row flex items-center w-full gap-3" role="slider" aria-label="Energy level" aria-valuemin="1" aria-valuemax="5" aria-valuenow="3" aria-valuetext="3 of 5">
                <span class="text-xs font-medium text-quartz">1</span>
                <div class="flex-1 relative h-2 rounded-full" style="background: rgba(139, 126, 216, 0.08);">
                  <!-- Active track (3/5 = 50%) -->
                  <div class="absolute left-0 top-0 h-2 rounded-full bg-lilac" style="width: 50%;"></div>
                  <!-- Thumb -->
                  <div class="absolute top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-surface shadow-subtle"
                       style="left: calc(50% - 10px); min-width: 44px; min-height: 44px; width: 20px; height: 20px; box-sizing: content-box; padding: 12px; margin: -12px;"></div>
                </div>
                <span class="text-xs font-medium text-quartz">5</span>
              </div>
            </div>
          </div>

          <!-- Notes Input Section -->
          <div class="column flex flex-col gap-2 anim-card" style="animation-delay: 240ms;">
            <label class="text-[13px] font-medium text-quartz">Add a note (optional)</label>
            <div class="bg-ivory rounded-lg px-4 min-h-[44px] py-3"
                 style="border: 1px solid rgba(42, 42, 58, 0.06); border-radius: 8px;"
                 aria-label="Optional mood note">
              <span class="text-base text-quartz" style="opacity: 0.7;">How are you feeling today?</span>
            </div>
          </div>

          <!-- Save Button -->
          <div class="anim-card pt-2" style="animation-delay: 320ms;">
            <button class="row flex items-center justify-center w-full bg-coral text-surface font-semibold text-lg rounded-full min-h-[52px]"
                    style="font-size: 1.125rem;"
                    aria-label="Save mood entry">
              Save Entry
            </button>
          </div>

        </div>
      </div>
    </div>
    </div>

  </div>
  </div>
</div>

</body>
</html>
