<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Mode Selection — Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        canvas: '#EDE8F7',
        surface: '#FFFFFF',
        ink: '#2A2A3A',
        quartz: '#8B8B9C',
        coral: '#F28B8B',
        'coral-tint': 'rgba(242, 139, 139, 0.12)',
        lilac: '#8B7ED8',
        'lilac-tint': 'rgba(139, 126, 216, 0.14)',
        'chip-bg': 'rgba(139, 126, 216, 0.08)',
        divider: 'rgba(42, 42, 58, 0.06)',
        backdrop: 'rgba(42, 42, 58, 0.24)',
      },
      fontFamily: {
        'jakarta': ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
      },
      boxShadow: {
        'subtle': '0 2px 8px rgba(139, 126, 216, 0.08)',
        'standard': '0 4px 20px rgba(139, 126, 216, 0.12)',
        'prominent': '0 8px 32px rgba(139, 126, 216, 0.14)',
        'sheet': '0 -8px 32px rgba(139, 126, 216, 0.16)',
      },
    }
  }
}
</script>
<style>
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: #E8E8E8;
  display: flex;
  justify-content: center;
  padding: 32px 16px;
  min-height: 100vh;
}
.phone {
  width: 375px;
  min-height: 812px;
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 64px rgba(0,0,0,0.2);
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim-card { animation: fade-up 450ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
@keyframes slide-up {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.anim-sheet { animation: slide-up 400ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="phone" role="application" aria-label="Bloom mode selection overlay">
  <div data-flutter="scaffold">
  <div class="flex flex-col min-h-screen bg-canvas">

    <!-- Dim backdrop -->
    <div class="absolute inset-0 z-[55]" style="background: rgba(42, 42, 58, 0.24);"
         aria-hidden="true"></div>

    <!-- Bottom Sheet -->
    <div class="bottom-sheet" data-flutter="bottom-sheet" data-bg="surface"
         role="dialog" aria-modal="true" aria-label="Mode selection bottom sheet">
    <div class="absolute bottom-0 left-0 right-0 z-[60] bg-surface rounded-t-[28px] shadow-sheet anim-sheet">

      <div class="flex flex-col pb-8">

        <!-- 9.1 Drag Handle -->
        <div class="flex justify-center pt-3 pb-1" aria-hidden="true">
          <div class="w-10 h-1 rounded-full" style="background: rgba(139, 126, 216, 0.08);"></div>
        </div>

        <!-- 9.2 Title -->
        <h2 class="text-center text-lg font-semibold text-ink pt-4 pb-6"
            data-color="primary">Select Mode</h2>

        <!-- 9.3 Mode Options List -->
        <div class="column flex flex-col px-5">

          <!-- Option: Pregnancy Mode (selected) -->
          <button class="row flex items-center gap-3 px-5 py-4 rounded-2xl min-h-[44px] anim-card"
                  style="background: rgba(242, 139, 139, 0.12); animation-delay: 80ms;"
                  aria-label="Select Pregnancy Mode. Track your pregnancy week by week"
                  aria-pressed="true">
            <!-- Leading Icon -->
            <svg class="w-6 h-6 flex-shrink-0 text-coral" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-name="pregnant_woman" data-size="24">
              <!-- pregnant_woman -->
              <circle cx="14" cy="4" r="2.5"/><path d="M14 8.5c-2 0-3 1.5-3 3.5v4h2v6h2v-6h2v-4c0-2-1-3.5-3-3.5z"/>
            </svg>
            <!-- Text Column -->
            <div class="flex flex-col gap-0.5 flex-1 text-left">
              <span class="text-base font-semibold text-ink">Pregnancy Mode</span>
              <span class="text-[13px] text-quartz">Track your pregnancy week by week</span>
            </div>
            <!-- Trailing Checkmark (selected) -->
            <svg class="w-5 h-5 flex-shrink-0 text-coral" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-name="check" data-size="20">
              <!-- check -->
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </button>

          <!-- Spacer -->
          <div class="h-2"></div>

          <!-- Option: Wellness Mode -->
          <button class="row flex items-center gap-3 px-5 py-4 rounded-2xl min-h-[44px] anim-card"
                  style="animation-delay: 160ms;"
                  aria-label="Select Wellness Mode. General health and cycle tracking"
                  aria-pressed="false">
            <!-- Leading Icon -->
            <svg class="w-6 h-6 flex-shrink-0 text-lilac" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-name="self_improvement" data-size="24">
              <!-- self_improvement -->
              <circle cx="12" cy="4" r="2.5"/><path d="M6 20l3-8h6l3 8"/><path d="M12 8v4"/>
            </svg>
            <!-- Text Column -->
            <div class="flex flex-col gap-0.5 flex-1 text-left">
              <span class="text-base font-semibold text-ink">Wellness Mode</span>
              <span class="text-[13px] text-quartz">General health and cycle tracking</span>
            </div>
          </button>

          <!-- Spacer -->
          <div class="h-2"></div>

          <!-- Option: Postpartum Mode -->
          <button class="row flex items-center gap-3 px-5 py-4 rounded-2xl min-h-[44px] anim-card"
                  style="animation-delay: 240ms;"
                  aria-label="Select Postpartum Mode. Recovery and newborn care tracking"
                  aria-pressed="false">
            <!-- Leading Icon -->
            <svg class="w-6 h-6 flex-shrink-0 text-coral" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-name="child_care" data-size="24">
              <!-- child_care -->
              <circle cx="12" cy="8" r="5"/><path d="M3 21c0-4 4-7 9-7s9 3 9 7"/><circle cx="9" cy="7" r="0.5" fill="currentColor"/><circle cx="15" cy="7" r="0.5" fill="currentColor"/>
            </svg>
            <!-- Text Column -->
            <div class="flex flex-col gap-0.5 flex-1 text-left">
              <span class="text-base font-semibold text-ink">Postpartum Mode</span>
              <span class="text-[13px] text-quartz">Recovery and newborn care tracking</span>
            </div>
          </button>

        </div>
      </div>
    </div>
    </div>

  </div>
  </div>
</div>

</body>
</html>
