<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Delete Entry Confirmation — Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        canvas: '#EDE8F7',
        surface: '#FFFFFF',
        ink: '#2A2A3A',
        quartz: '#8B8B9C',
        coral: '#F28B8B',
        'coral-tint': 'rgba(242, 139, 139, 0.12)',
        lilac: '#8B7ED8',
        'lilac-tint': 'rgba(139, 126, 216, 0.14)',
        'chip-bg': 'rgba(139, 126, 216, 0.08)',
        divider: 'rgba(42, 42, 58, 0.06)',
        backdrop: 'rgba(42, 42, 58, 0.24)',
        fault: '#E85C5C',
      },
      fontFamily: {
        'jakarta': ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
      },
      boxShadow: {
        'subtle': '0 2px 8px rgba(139, 126, 216, 0.08)',
        'standard': '0 4px 20px rgba(139, 126, 216, 0.12)',
        'prominent': '0 8px 32px rgba(139, 126, 216, 0.14)',
      },
    }
  }
}
</script>
<style>
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: #E8E8E8;
  display: flex;
  justify-content: center;
  padding: 32px 16px;
  min-height: 100vh;
}
.phone {
  width: 375px;
  min-height: 812px;
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 64px rgba(0,0,0,0.2);
}
@keyframes dialog-in {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
.anim-dialog { animation: dialog-in 250ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
.anim-backdrop { animation: fade-in 200ms ease-out backwards; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="phone" role="application" aria-label="Bloom delete entry confirmation overlay">
  <div data-flutter="scaffold">
  <div class="flex flex-col min-h-screen bg-canvas">

    <!-- Dim backdrop -->
    <div class="absolute inset-0 z-[65] anim-backdrop" style="background: rgba(42, 42, 58, 0.24);"
         aria-hidden="true"></div>

    <!-- Dialog -->
    <div class="dialog" data-flutter="dialog" data-bg="surface" data-radius="lg"
         role="dialog" aria-modal="true" aria-label="Delete entry confirmation dialog">
    <div class="absolute inset-0 z-[70] flex items-center justify-center px-7">
    <div class="bg-surface rounded-[24px] shadow-prominent w-full max-w-[320px] anim-dialog">

      <div class="column flex flex-col p-6">

        <!-- 9.1 Title -->
        <h2 class="text-[1.125rem] font-semibold text-ink leading-snug"
            data-color="primary">Delete Entry</h2>

        <!-- 9.2 Body Text -->
        <p class="text-base font-normal text-quartz leading-normal mt-3">Are you sure you want to delete this entry? This action cannot be undone.</p>

        <!-- 9.3 Action Row -->
        <div class="row flex items-center justify-end gap-3 mt-6">
          <!-- Cancel -->
          <button class="flex items-center justify-center h-11 px-6 rounded-full text-base font-semibold text-ink min-h-[44px]"
                  style="background: rgba(139, 126, 216, 0.08);"
                  aria-label="Cancel, keep entry">Cancel</button>
          <!-- Delete -->
          <button class="flex items-center justify-center h-11 px-6 rounded-full bg-fault text-surface text-base font-semibold min-h-[44px]"
                  aria-label="Delete entry permanently">Delete</button>
        </div>

      </div>

    </div>
    </div>
    </div>

  </div>
  </div>
</div>

</body>
</html>
