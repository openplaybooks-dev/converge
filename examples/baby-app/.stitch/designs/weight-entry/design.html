<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Weight Entry — Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        canvas: '#EDE8F7',
        surface: '#FFFFFF',
        ink: '#2A2A3A',
        quartz: '#8B8B9C',
        coral: '#F28B8B',
        'coral-tint': 'rgba(242, 139, 139, 0.12)',
        lilac: '#8B7ED8',
        'lilac-tint': 'rgba(139, 126, 216, 0.14)',
        'chip-bg': 'rgba(139, 126, 216, 0.08)',
        divider: 'rgba(42, 42, 58, 0.06)',
        backdrop: 'rgba(42, 42, 58, 0.24)',
        ivory: '#FDF9F8',
        error: '#E85C5C',
      },
      fontFamily: {
        'jakarta': ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
      },
      boxShadow: {
        'subtle': '0 2px 8px rgba(139, 126, 216, 0.08)',
        'standard': '0 4px 20px rgba(139, 126, 216, 0.12)',
        'prominent': '0 8px 32px rgba(139, 126, 216, 0.14)',
        'sheet': '0 -8px 32px rgba(139, 126, 216, 0.16)',
      },
    }
  }
}
</script>
<style>
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: #E8E8E8;
  display: flex;
  justify-content: center;
  padding: 32px 16px;
  min-height: 100vh;
}
.phone {
  width: 375px;
  min-height: 812px;
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 64px rgba(0,0,0,0.2);
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim-card { animation: fade-up 450ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
@keyframes slide-up {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.anim-sheet { animation: slide-up 400ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="phone" role="application" aria-label="Bloom weight entry overlay">
  <div data-flutter="scaffold">
  <div class="flex flex-col min-h-screen bg-canvas">

    <!-- Dim backdrop -->
    <div class="absolute inset-0 z-[55]" style="background: rgba(42, 42, 58, 0.24);"
         aria-hidden="true"></div>

    <!-- Bottom Sheet -->
    <div class="bottom-sheet" data-flutter="bottom-sheet" data-bg="surface"
         role="dialog" aria-modal="true" aria-label="Weight entry bottom sheet">
    <div class="absolute bottom-0 left-0 right-0 z-[60] bg-surface rounded-t-[28px] shadow-sheet anim-sheet"
         style="max-height: 60%;">

      <div class="column flex flex-col pb-8">

        <!-- 9.1 Drag Handle -->
        <div class="flex justify-center pt-3 pb-1" aria-hidden="true">
          <div class="w-10 h-1 rounded-full" style="background: rgba(139, 126, 216, 0.08);"></div>
        </div>

        <!-- 9.2 Title -->
        <h2 class="text-left text-lg font-semibold text-ink px-5 pt-4 pb-6"
            data-color="primary">Log Weight</h2>

        <!-- Content -->
        <div class="column flex flex-col gap-4 px-5">

          <!-- 9.3 Weight Input -->
          <div class="column flex flex-col gap-2 anim-card" style="animation-delay: 80ms;">
            <label class="text-[13px] font-medium text-quartz">Weight</label>
            <div class="row flex items-center gap-3 bg-ivory rounded-2xl px-5 min-h-[44px] py-3"
                 style="border: 1px solid rgba(42, 42, 58, 0.06);"
                 aria-label="Enter weight in kg">
              <span class="flex-1 text-4xl font-extrabold text-ink" style="font-size: 2.25rem; letter-spacing: -0.015em;">50.3</span>
              <span class="text-sm font-medium text-quartz">kg</span>
            </div>
          </div>

          <!-- 9.4 Date Selector -->
          <div class="column flex flex-col gap-2 anim-card" style="animation-delay: 160ms;">
            <label class="text-[13px] font-medium text-quartz">Date</label>
            <button class="row flex items-center bg-ivory rounded-2xl px-5 min-h-[44px] py-3"
                    style="border: 1px solid rgba(42, 42, 58, 0.06);"
                    aria-label="Select date. Currently April 19, 2026">
              <span class="flex-1 text-[13px] text-ink text-left">April 19, 2026</span>
              <svg class="w-5 h-5 text-quartz flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-name="calendar_today" data-size="20">
                <!-- calendar_today -->
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </button>
          </div>

          <!-- 9.5 Notes Field -->
          <div class="column flex flex-col gap-2 anim-card" style="animation-delay: 240ms;">
            <label class="text-[13px] font-medium text-quartz">Notes (optional)</label>
            <div class="bg-ivory rounded-2xl px-5 min-h-[44px] py-3"
                 style="border: 1px solid rgba(42, 42, 58, 0.06);"
                 aria-label="Optional notes">
              <span class="text-[13px] text-quartz" style="opacity: 0.7;">Add a note...</span>
            </div>
          </div>

          <!-- 9.6 Save Button -->
          <div class="anim-card pt-2" style="animation-delay: 320ms;">
            <button class="row flex items-center justify-center w-full bg-coral text-surface font-semibold text-base rounded-full min-h-[52px]"
                    aria-label="Save weight entry">
              Save
            </button>
          </div>

        </div>
      </div>
    </div>
    </div>

  </div>
  </div>
</div>

</body>
</html>
