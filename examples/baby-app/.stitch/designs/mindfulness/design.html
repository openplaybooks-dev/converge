<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom — Mindfulness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Background */
  --color-canvas: #EDE8F7;
  --color-surface: #FFFFFF;

  /* Text */
  --color-text-primary: #2A2A3A;
  --color-text-secondary: #8B8B9C;

  /* Accent */
  --color-accent-coral: #F28B8B;
  --color-accent-coral-tint: rgba(242, 139, 139, 0.12);
  --color-accent-lilac: #8B7ED8;
  --color-accent-lilac-tint: rgba(139, 126, 216, 0.14);

  /* Structural */
  --color-divider: rgba(42, 42, 58, 0.06);
  --color-chip-bg: rgba(139, 126, 216, 0.08);

  /* Functional */
  --color-success: #6DC48A;

  /* Shadows */
  --shadow-subtle: 0 2px 8px rgba(139, 126, 216, 0.08);
  --shadow-standard: 0 4px 20px rgba(139, 126, 216, 0.12);
  --shadow-prominent: 0 8px 32px rgba(139, 126, 216, 0.14);
  --shadow-nav: 0 -4px 20px rgba(139, 126, 216, 0.08);

  /* Typography */
  --font-ui: 'Plus Jakarta Sans', system-ui, sans-serif;
  --fs-display: 2rem;
  --fs-heading: 1.5rem;
  --fs-subheading: 1.125rem;
  --fs-body: 1rem;
  --fs-data: 0.875rem;
  --fs-caption: 0.8125rem;
  --fs-micro: 0.6875rem;

  /* Spacing */
  --space-xs: 0.5rem;
  --space-sm: 0.75rem;
  --space-md: 1.25rem;
  --space-lg: 1.75rem;
  --space-section: 1.5rem;

  /* Radius */
  --radius-card: 1.5rem;
  --radius-hero: 2rem;
  --radius-pill: 9999px;

  /* Motion */
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-exit: cubic-bezier(0.25, 0, 0, 1);
  --duration-card: 450ms;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-ui);
  background: #f0f0f0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 2rem;
}

.phone {
  width: 375px;
  min-height: 812px;
  background: var(--color-canvas);
  border-radius: 2.5rem;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 80px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
}

/* App Bar */
.app-bar {
  background: var(--color-surface);
  padding: 3rem var(--space-md) 1rem;
  z-index: 10;
}

.app-bar h1 {
  font-size: var(--fs-display);
  font-weight: 800;
  color: var(--color-text-primary);
  line-height: 1.15;
  letter-spacing: -0.02em;
}

/* Screen Content */
.screen-content {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-md);
  padding-bottom: 5.5rem;
}

/* Category Chips */
.chips-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: var(--space-section);
  -webkit-overflow-scrolling: touch;
}

.chips-row::-webkit-scrollbar {
  display: none;
}

.chip {
  flex-shrink: 0;
  padding: var(--space-xs) var(--space-md);
  border-radius: var(--radius-pill);
  border: none;
  font-family: var(--font-ui);
  font-size: var(--fs-caption);
  font-weight: 400;
  color: var(--color-text-secondary);
  background: var(--color-chip-bg);
  cursor: pointer;
  min-height: 44px;
  display: flex;
  align-items: center;
}

.chip.selected {
  background: var(--color-accent-lilac-tint);
  color: var(--color-accent-lilac);
  font-weight: 600;
}

/* Featured Exercise Card */
.featured-card {
  background: var(--color-surface);
  border-radius: var(--radius-hero);
  box-shadow: var(--shadow-prominent);
  padding: 2rem;
  margin-bottom: var(--space-section);
  text-align: center;
}

.featured-illustration {
  width: 70%;
  margin: 0 auto var(--space-md);
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { transform: scale(1.0); }
  50% { transform: scale(1.015); }
}

.featured-illustration svg {
  width: 100%;
  height: 100%;
}

.featured-card .card-title {
  font-size: var(--fs-heading);
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 0.375rem;
}

.featured-card .card-tag {
  display: inline-block;
  font-size: var(--fs-micro);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-accent-lilac);
  background: var(--color-chip-bg);
  padding: 0.25rem 0.625rem;
  border-radius: var(--radius-pill);
  margin-bottom: 0.375rem;
}

.featured-card .card-duration {
  font-size: var(--fs-data);
  font-weight: 500;
  color: var(--color-text-secondary);
}

/* Section Heading */
.section-heading {
  font-size: var(--fs-heading);
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: var(--space-md);
}

/* Exercise Grid */
.exercise-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: var(--space-section);
}

.exercise-card {
  background: var(--color-surface);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-standard);
  padding: var(--space-md);
  text-align: center;
  cursor: pointer;
  transition: box-shadow 100ms ease-out, transform 100ms ease-out;
}

.exercise-card:active {
  box-shadow: var(--shadow-subtle);
  transform: translateY(1px);
}

.exercise-card .card-illust {
  width: 60%;
  margin: 0 auto 0.625rem;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.exercise-card .card-illust svg {
  width: 100%;
  height: 100%;
}

.exercise-card .exercise-name {
  font-size: var(--fs-subheading);
  font-weight: 600;
  color: var(--color-text-primary);
  margin-bottom: 0.125rem;
}

.exercise-card .exercise-category {
  font-size: var(--fs-caption);
  font-weight: 400;
  color: var(--color-text-secondary);
  margin-bottom: 0.25rem;
}

.exercise-card .exercise-duration {
  font-size: var(--fs-data);
  font-weight: 500;
  color: var(--color-text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.25rem;
}

.exercise-card .exercise-duration svg {
  width: 16px;
  height: 16px;
  color: var(--color-accent-lilac);
}

/* Mood Banner */
.mood-banner {
  background: var(--color-surface);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-standard);
  padding: var(--space-md);
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: var(--space-section);
}

.mood-banner .mood-icon {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  color: var(--color-accent-coral);
}

.mood-banner .mood-text {
  flex: 1;
}

.mood-banner .mood-text .mood-title {
  font-size: var(--fs-subheading);
  font-weight: 600;
  color: var(--color-text-primary);
}

.mood-banner .mood-text .mood-subtitle {
  font-size: var(--fs-caption);
  font-weight: 400;
  color: var(--color-text-secondary);
}

.mood-cta {
  flex-shrink: 0;
  padding: 0.5rem 1rem;
  background: var(--color-accent-coral);
  color: var(--color-surface);
  border: none;
  border-radius: var(--radius-pill);
  font-family: var(--font-ui);
  font-size: var(--fs-caption);
  font-weight: 600;
  cursor: pointer;
  min-height: 44px;
  display: flex;
  align-items: center;
}

/* Bottom Nav */
.bottom-nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--color-surface);
  box-shadow: var(--shadow-nav);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 0.5rem 0;
  padding-bottom: 1.5rem;
  z-index: 50;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 0.375rem 0.75rem;
  border-radius: 1rem;
  min-width: 44px;
  min-height: 44px;
  justify-content: center;
  border: none;
  background: transparent;
  cursor: pointer;
}

.nav-item.active {
  background: var(--color-accent-coral-tint);
}

.nav-item svg {
  width: 22px;
  height: 22px;
  color: var(--color-text-secondary);
}

.nav-item.active svg {
  color: var(--color-accent-coral);
}

.nav-item span {
  font-size: var(--fs-micro);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-text-secondary);
}

.nav-item.active span {
  color: var(--color-accent-coral);
}
</style>
</head>
<body>

<div class="phone" role="application" aria-label="Bloom mindfulness exercises screen">
<div class="scaffold" data-flutter="scaffold">

  <!-- App Bar -->
  <header class="app-bar" data-flutter="app-bar" data-color="surface">
    <h1 data-color="primary">Mindfulness</h1>
  </header>

  <main class="screen-content" data-flutter="custom-scroll">

    <!-- Category Chips -->
    <div class="chips-row" role="radiogroup" aria-label="Exercise category filter">
      <button class="chip selected" role="radio" aria-checked="true" aria-label="All filter, selected" data-color="secondary">All</button>
      <button class="chip" role="radio" aria-checked="false" aria-label="Breathing filter, not selected">Breathing</button>
      <button class="chip" role="radio" aria-checked="false" aria-label="Stretching filter, not selected">Stretching</button>
      <button class="chip" role="radio" aria-checked="false" aria-label="Meditation filter, not selected">Meditation</button>
    </div>

    <!-- Featured Exercise Card -->
    <section class="featured-card" role="button" tabindex="0" aria-label="Featured exercise: Deep Breathing, Breathing, 5 min" data-color="surface">
      <div class="featured-illustration" aria-label="Illustration for Deep Breathing">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Breathing figure illustration -->
          <circle cx="100" cy="70" r="55" fill="#EDE8F7"/>
          <ellipse cx="100" cy="68" rx="38" ry="42" fill="#D9D3F2"/>
          <!-- Seated figure silhouette -->
          <circle cx="100" cy="48" r="14" fill="#8B7ED8" opacity="0.4"/>
          <ellipse cx="100" cy="80" rx="20" ry="24" fill="#8B7ED8" opacity="0.25"/>
          <!-- Breath rings -->
          <circle cx="100" cy="65" r="28" fill="none" stroke="#8B7ED8" stroke-width="1" opacity="0.3"/>
          <circle cx="100" cy="65" r="38" fill="none" stroke="#8B7ED8" stroke-width="0.75" opacity="0.2"/>
          <circle cx="100" cy="65" r="48" fill="none" stroke="#8B7ED8" stroke-width="0.5" opacity="0.12"/>
          <!-- Decorative leaves -->
          <path d="M55 120 Q60 105 70 115" stroke="#6DC48A" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>
          <path d="M145 120 Q140 105 130 115" stroke="#6DC48A" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>
          <text x="100" y="160" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#8B8B9C" font-weight="500">Find your calm</text>
        </svg>
      </div>
      <h2 class="card-title">Deep Breathing</h2>
      <div class="card-tag">Breathing</div>
      <p class="card-duration">5 min</p>
    </section>

    <!-- Exercise Grid -->
    <h2 class="section-heading">Exercises</h2>
    <div class="exercise-grid" data-flutter="sliver-grid" data-columns="2">

      <article class="exercise-card" role="button" tabindex="0" aria-label="Prenatal Stretch, Stretching, 10 min" data-color="surface">
        <div class="card-illust">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="50" cy="40" r="30" fill="#EDE8F7"/>
            <circle cx="50" cy="30" r="10" fill="#F28B8B" opacity="0.35"/>
            <ellipse cx="50" cy="52" rx="14" ry="18" fill="#F28B8B" opacity="0.2"/>
            <path d="M36 56 Q28 68 34 75" stroke="#F28B8B" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
            <path d="M64 56 Q72 68 66 75" stroke="#F28B8B" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="exercise-name">Prenatal Stretch</div>
        <div class="exercise-category">Stretching</div>
        <div class="exercise-duration">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- clock --><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          10 min
        </div>
      </article>

      <article class="exercise-card" role="button" tabindex="0" aria-label="Body Scan, Meditation, 8 min" data-color="surface">
        <div class="card-illust">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="50" cy="40" r="30" fill="#EDE8F7"/>
            <circle cx="50" cy="36" r="12" fill="#8B7ED8" opacity="0.3"/>
            <ellipse cx="50" cy="55" rx="16" ry="14" fill="#8B7ED8" opacity="0.18"/>
            <circle cx="50" cy="36" r="20" fill="none" stroke="#8B7ED8" stroke-width="0.75" opacity="0.2"/>
          </svg>
        </div>
        <div class="exercise-name">Body Scan</div>
        <div class="exercise-category">Meditation</div>
        <div class="exercise-duration">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- clock --><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          8 min
        </div>
      </article>

      <article class="exercise-card" role="button" tabindex="0" aria-label="4-7-8 Breathing, Breathing, 5 min" data-color="surface">
        <div class="card-illust">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="50" cy="40" r="30" fill="#EDE8F7"/>
            <circle cx="50" cy="38" r="18" fill="none" stroke="#8B7ED8" stroke-width="1.5" opacity="0.35"/>
            <circle cx="50" cy="38" r="10" fill="#8B7ED8" opacity="0.2"/>
            <path d="M42 52 L50 38 L58 52" stroke="#8B7ED8" stroke-width="1" fill="none" opacity="0.25" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="exercise-name">4-7-8 Breathing</div>
        <div class="exercise-category">Breathing</div>
        <div class="exercise-duration">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- clock --><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          5 min
        </div>
      </article>

      <article class="exercise-card" role="button" tabindex="0" aria-label="Gentle Yoga, Stretching, 15 min" data-color="surface">
        <div class="card-illust">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="50" cy="40" r="30" fill="#FDEEEE"/>
            <circle cx="50" cy="30" r="9" fill="#F28B8B" opacity="0.3"/>
            <path d="M40 50 Q50 65 60 50" stroke="#F28B8B" stroke-width="1.5" fill="none" opacity="0.35" stroke-linecap="round"/>
            <path d="M35 60 Q50 75 65 60" stroke="#F28B8B" stroke-width="1" fill="none" opacity="0.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="exercise-name">Gentle Yoga</div>
        <div class="exercise-category">Stretching</div>
        <div class="exercise-duration">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- clock --><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          15 min
        </div>
      </article>

    </div>

    <!-- Mood Check-In Banner -->
    <section class="mood-banner" role="button" tabindex="0" aria-label="Mood check-in: How are you feeling today? Tap to log mood" data-color="surface">
      <svg class="mood-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- smile --><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      <div class="mood-text">
        <div class="mood-title">How are you feeling today?</div>
        <div class="mood-subtitle">Take a moment to check in</div>
      </div>
      <button class="mood-cta" aria-label="Log Mood" data-color="accent">Log Mood</button>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" data-flutter="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" data-flutter="nav-destination" data-icon="home" data-label="Home" aria-label="Home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- home --><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-flutter="nav-destination" data-icon="calendar" data-label="Progress" aria-label="Progress">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- calendar --><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Progress</span>
    </button>
    <button class="nav-item" data-flutter="nav-destination" data-icon="heart" data-label="Health" aria-label="Health">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- heart --><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>Health</span>
    </button>
    <button class="nav-item active" data-flutter="nav-destination" data-icon="info" data-label="Wellness" data-selected="true" aria-label="Wellness" aria-current="page">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- activity --><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span>Wellness</span>
    </button>
    <button class="nav-item" data-flutter="nav-destination" data-icon="book-open" data-label="Learn" aria-label="Learn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><!-- book-open --><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Learn</span>
    </button>
  </nav>

</div>
</div>

</body>
</html>
