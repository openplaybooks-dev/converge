<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Week 10 - Prune</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDEEEE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDEEEE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pruneGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF8A8A"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </radialGradient>
  </defs>
  <!-- Halo glow -->
  <circle cx="100" cy="108" r="70" fill="url(#halo)"/>
  <!-- Prune body — plump oval with slight bottom taper -->
  <ellipse cx="100" cy="110" rx="32" ry="44" fill="url(#pruneGrad)" stroke="#E05555" stroke-width="1.5"/>
  <!-- Highlight on upper-left surface -->
  <ellipse cx="88" cy="92" rx="12" ry="20" fill="white" opacity="0.18" transform="rotate(-12 88 92)"/>
  <!-- Central dimple crease -->
  <path d="M100 72 Q98 110 100 150" stroke="#E05555" stroke-width="1.2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- Subtle radiating creases -->
  <path d="M92 90 Q96 105 94 120" stroke="#E05555" stroke-width="0.8" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M108 90 Q104 105 106 120" stroke="#E05555" stroke-width="0.8" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M86 100 Q92 112 88 125" stroke="#E05555" stroke-width="0.8" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M114 100 Q108 112 112 125" stroke="#E05555" stroke-width="0.8" fill="none" opacity="0.25" stroke-linecap="round"/>
  <!-- Stem -->
  <path d="M100 66 Q100 58 104 52" stroke="#9B59B6" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="104" cy="51" r="2" fill="#9B59B6"/>
</svg>
