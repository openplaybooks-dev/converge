<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Week 3 - Poppy Seed</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDEEEE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDEEEE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F28B8B"/>
      <stop offset="100%" stop-color="#E07070"/>
    </linearGradient>
  </defs>
  <!-- Halo glow -->
  <circle cx="100" cy="100" r="60" fill="url(#halo)"/>
  <!-- Poppy seed body — kidney-shaped -->
  <path d="M88 82c-8 4-14 12-14 22 0 12 8 20 18 22 4 1 8 0 12-2 6-3 12-10 12-20 0-10-6-18-14-22-4-2-8-2-14 0z" fill="url(#seedGrad)" stroke="#D47777" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Seed highlight -->
  <ellipse cx="94" cy="96" rx="6" ry="10" fill="#8B7ED8" opacity="0.3" transform="rotate(-8 94 96)"/>
  <!-- Dimple texture dots -->
  <circle cx="98" cy="106" r="1.5" fill="#8B7ED8" opacity="0.2"/>
  <circle cx="104" cy="100" r="1.2" fill="#8B7ED8" opacity="0.2"/>
  <circle cx="92" cy="102" r="1" fill="#8B7ED8" opacity="0.15"/>
</svg>
