<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Week 2 - Sesame Seed</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDEEEE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDEEEE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F28B8B"/>
      <stop offset="100%" stop-color="#E07070"/>
    </linearGradient>
  </defs>
  <!-- Halo glow -->
  <circle cx="100" cy="100" r="60" fill="url(#halo)"/>
  <!-- Sesame seed body -->
  <ellipse cx="100" cy="100" rx="14" ry="26" fill="url(#seedGrad)" stroke="#D47777" stroke-width="1.5" transform="rotate(-15 100 100)"/>
  <!-- Seed highlight -->
  <ellipse cx="96" cy="92" rx="5" ry="12" fill="#8B7ED8" opacity="0.3" transform="rotate(-15 96 92)"/>
  <!-- Ridge line -->
  <path d="M97 76c1 16 2 32 3 48" stroke="#8B7ED8" stroke-width="1" stroke-linecap="round" opacity="0.4" transform="rotate(-15 100 100)"/>
</svg>
