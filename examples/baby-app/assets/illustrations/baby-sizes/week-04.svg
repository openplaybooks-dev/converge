<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Week 4 - Poppy Seed</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDEEEE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDEEEE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F28B8B"/>
      <stop offset="100%" stop-color="#E07070"/>
    </linearGradient>
  </defs>
  <!-- Halo glow -->
  <circle cx="100" cy="100" r="65" fill="url(#halo)"/>
  <!-- Poppy seed body — teardrop/kidney-shaped, slightly larger than week-03 -->
  <path d="M86 78c-9 5-16 14-16 25 0 14 9 23 20 25 5 1 9 0 14-3 7-3 14-11 14-23 0-11-7-20-16-24-5-3-9-3-16 0z" fill="url(#seedGrad)" stroke="#D47777" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Seed highlight -->
  <ellipse cx="93" cy="94" rx="7" ry="11" fill="#8B7ED8" opacity="0.3" transform="rotate(-8 93 94)"/>
  <!-- Ridged surface texture lines -->
  <path d="M92 86c2 8 2 18 0 26" stroke="#8B7ED8" stroke-width="0.8" opacity="0.15" fill="none" stroke-linecap="round"/>
  <path d="M98 84c1 9 1 20-1 28" stroke="#8B7ED8" stroke-width="0.8" opacity="0.15" fill="none" stroke-linecap="round"/>
  <!-- Dimple texture dots -->
  <circle cx="100" cy="108" r="1.5" fill="#8B7ED8" opacity="0.2"/>
  <circle cx="106" cy="100" r="1.2" fill="#8B7ED8" opacity="0.2"/>
  <circle cx="90" cy="104" r="1" fill="#8B7ED8" opacity="0.15"/>
  <circle cx="96" cy="112" r="1" fill="#8B7ED8" opacity="0.15"/>
</svg>
