<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Week 5 - Apple Seed</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDEEEE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDEEEE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E05555"/>
    </linearGradient>
  </defs>
  <!-- Halo glow -->
  <circle cx="100" cy="100" r="68" fill="url(#halo)"/>
  <!-- Apple seed body — elongated teardrop, slightly larger than week-04 -->
  <path d="M100 68c-7 2-14 10-18 22-4 12-3 24 2 32 4 6 9 10 16 10 7 0 12-4 16-10 5-8 6-20 2-32-4-12-11-20-18-22z" fill="url(#seedGrad)" stroke="#D45050" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Seed highlight -->
  <ellipse cx="95" cy="98" rx="7" ry="14" fill="#9B59B6" opacity="0.25" transform="rotate(-5 95 98)"/>
  <!-- Central ridge line -->
  <path d="M100 74c0 12-1 28 0 48" stroke="#9B59B6" stroke-width="0.9" opacity="0.18" fill="none" stroke-linecap="round"/>
  <!-- Subtle texture lines -->
  <path d="M94 82c1 10 1 24 0 34" stroke="#9B59B6" stroke-width="0.7" opacity="0.12" fill="none" stroke-linecap="round"/>
  <path d="M106 82c-1 10-1 24 0 34" stroke="#9B59B6" stroke-width="0.7" opacity="0.12" fill="none" stroke-linecap="round"/>
  <!-- Surface texture dots -->
  <circle cx="104" cy="108" r="1.5" fill="#9B59B6" opacity="0.18"/>
  <circle cx="96" cy="114" r="1.2" fill="#9B59B6" opacity="0.15"/>
  <circle cx="108" cy="96" r="1" fill="#9B59B6" opacity="0.12"/>
</svg>
