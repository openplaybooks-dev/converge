<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Week 16 - Avocado</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDEEEE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDEEEE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skinGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF8A8A"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </radialGradient>
    <radialGradient id="fleshGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </radialGradient>
    <radialGradient id="pitGrad" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#C49A6C"/>
      <stop offset="100%" stop-color="#9B59B6"/>
    </radialGradient>
  </defs>
  <!-- Halo glow -->
  <circle cx="100" cy="105" r="72" fill="url(#halo)"/>
  <!-- Avocado body — pear shape, wider at bottom, tapered top -->
  <path d="M100 38 Q78 50 66 78 Q54 106 56 130 Q58 154 76 164 Q88 170 100 170 Q112 170 124 164 Q142 154 144 130 Q146 106 134 78 Q122 50 100 38Z" fill="url(#skinGrad)" stroke="#E05555" stroke-width="1.5"/>
  <!-- Texture dots on skin -->
  <circle cx="78" cy="90" r="1.5" fill="#E05555" opacity="0.3"/>
  <circle cx="88" cy="76" r="1.2" fill="#E05555" opacity="0.25"/>
  <circle cx="72" cy="110" r="1.3" fill="#E05555" opacity="0.3"/>
  <circle cx="82" cy="130" r="1.4" fill="#E05555" opacity="0.25"/>
  <circle cx="120" cy="84" r="1.3" fill="#E05555" opacity="0.28"/>
  <circle cx="128" cy="108" r="1.5" fill="#E05555" opacity="0.3"/>
  <circle cx="122" cy="134" r="1.2" fill="#E05555" opacity="0.25"/>
  <circle cx="92" cy="154" r="1.3" fill="#E05555" opacity="0.22"/>
  <circle cx="110" cy="156" r="1.4" fill="#E05555" opacity="0.22"/>
  <!-- Cutaway flesh interior -->
  <ellipse cx="100" cy="114" rx="28" ry="38" fill="url(#fleshGrad)" stroke="#E8C170" stroke-width="1"/>
  <!-- Pit -->
  <circle cx="100" cy="124" r="16" fill="url(#pitGrad)" stroke="#8E44AD" stroke-width="1"/>
  <!-- Pit highlight -->
  <ellipse cx="94" cy="118" rx="6" ry="4" fill="white" opacity="0.25" transform="rotate(-20 94 118)"/>
  <!-- Highlight on upper-left skin -->
  <ellipse cx="82" cy="88" rx="10" ry="18" fill="white" opacity="0.15" transform="rotate(-15 82 88)"/>
  <!-- Shadow at base -->
  <ellipse cx="100" cy="172" rx="22" ry="4" fill="#E05555" opacity="0.2"/>
</svg>
