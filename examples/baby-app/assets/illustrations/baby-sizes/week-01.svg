<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Week 1 - Poppy Seed</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDEEEE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDEEEE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F28B8B"/>
      <stop offset="100%" stop-color="#E07070"/>
    </linearGradient>
  </defs>
  <!-- Halo glow -->
  <circle cx="100" cy="100" r="60" fill="url(#halo)"/>
  <!-- Poppy seed body -->
  <ellipse cx="100" cy="100" rx="16" ry="22" fill="url(#seedGrad)" stroke="#D47777" stroke-width="1.5" transform="rotate(-10 100 100)"/>
  <!-- Seed highlight -->
  <ellipse cx="96" cy="92" rx="6" ry="10" fill="#8B7ED8" opacity="0.3" transform="rotate(-10 96 92)"/>
  <!-- Subtle tip -->
  <path d="M108 80c2-4 3-8 2-10s-3 4-4 8" fill="#F28B8B" opacity="0.6"/>
</svg>
