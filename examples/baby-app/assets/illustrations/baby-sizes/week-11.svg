<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Week 11 - Lime</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDEEEE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDEEEE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="limeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF8A8A"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </radialGradient>
  </defs>
  <!-- Halo glow -->
  <circle cx="100" cy="105" r="68" fill="url(#halo)"/>
  <!-- Lime body — plump near-spherical with slight oval elongation -->
  <ellipse cx="100" cy="106" rx="38" ry="42" fill="url(#limeGrad)" stroke="#E05555" stroke-width="1.5"/>
  <!-- Highlight on upper-left surface -->
  <ellipse cx="86" cy="90" rx="14" ry="18" fill="white" opacity="0.18" transform="rotate(-15 86 90)"/>
  <!-- Citrus skin dimples -->
  <circle cx="88" cy="98" r="1.5" fill="#E05555" opacity="0.2"/>
  <circle cx="108" cy="94" r="1.3" fill="#E05555" opacity="0.18"/>
  <circle cx="96" cy="114" r="1.4" fill="#E05555" opacity="0.2"/>
  <circle cx="112" cy="108" r="1.2" fill="#E05555" opacity="0.16"/>
  <circle cx="82" cy="110" r="1.3" fill="#E05555" opacity="0.18"/>
  <circle cx="104" cy="120" r="1.4" fill="#E05555" opacity="0.17"/>
  <circle cx="92" cy="126" r="1.2" fill="#E05555" opacity="0.15"/>
  <circle cx="116" cy="118" r="1.1" fill="#E05555" opacity="0.14"/>
  <circle cx="100" cy="84" r="1.3" fill="#E05555" opacity="0.16"/>
  <circle cx="78" cy="104" r="1.0" fill="#E05555" opacity="0.14"/>
  <!-- Stem -->
  <path d="M100 64 Q100 56 102 50" stroke="#9B59B6" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="102" cy="49" r="1.8" fill="#9B59B6"/>
  <!-- Leaf -->
  <path d="M102 54 Q112 46 118 48" stroke="#9B59B6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M102 54 Q110 50 118 48 Q112 56 102 54Z" fill="#9B59B6" opacity="0.6"/>
</svg>
