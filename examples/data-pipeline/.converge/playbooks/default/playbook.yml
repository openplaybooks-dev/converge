---
name: default
description: Daily AI-news ingested from RSS, clustered semantically, narrated as a persona-voiced podcast script
run:
  mode: oneoff
  maxTaskAttempts: 3
goals:
  - id: episode-validated
    description: Today's episode validated end-to-end
    checks:
      - id: validated-exists
        cmd: bash -c 'test -f "$(ls -t episodes/*/validated.json 2>/dev/null | head -1)"'
