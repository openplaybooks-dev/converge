<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #F4F2EE;
            color: #31332e;
        }
        .editorial-shadow {
            box-shadow: 0 8px 24px rgba(231, 227, 220, 0.4);
        }
        .tactile-press:active {
            transform: scale(0.98);

<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-[#31332e] dark:text-stone-100 hover:bg-[#f5f4ee] dark:hover:bg-stone-800 transition-colors p-2 rounded-full">

<span class="text-xl font-bold tracking-tight text-[#31332e] dark:text-stone-100 font-headline">BabyGuard</span>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high ring-2 ring-white">

<span class="bg-[#FCEEE9] text-[#9e422c] px-4 py-1.5 rounded-full text-xs font-bold font-label tracking-wide flex items-center gap-2 w-fit mb-4">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">error</span>
            Cảnh báo
        </span>
<h1 class="text-4xl font-extrabold font-headline text-on-surface tracking-tight mb-2 leading-[1.1]">
            Kiểm tra ngay
        </h1>
<p class="text-on-surface-variant font-medium text-sm mb-8">Mẹ đang ở xa beacon</p>
</div>
<!-- Map View Container -->
<div class="relative w-full aspect-[4/5] rounded-[2.5rem] overflow-hidden editorial-shadow mb-8 group ring-4 ring-[#FCEEE9]">

<div class="absolute w-32 h-32 bg-[#9e422c]/20 rounded-full animate-ping opacity-75"></div>
<div class="absolute w-48 h-48 bg-[#9e422c]/10 rounded-full border-2 border-[#9e422c]/20"></div>
<div class="relative w-20 h-20 bg-white rounded-full flex items-center justify-center editorial-shadow p-1">

</div>
<!-- Icon Badge -->
<div class="absolute -bottom-1 -right-1 bg-[#9e422c] text-white p-1.5 rounded-full border-2 border-white">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
</div>
</div>
<!-- Map Overlay Info -->
<div class="absolute bottom-6 left-6 right-6 p-5 bg-surface-container-lowest/90 backdrop-blur-md rounded-2xl flex items-center justify-between shadow-lg">
<div>
<p class="text-[10px] uppercase tracking-widest font-bold text-[#9e422c] mb-1">Cảnh báo vị trí</p>
<p class="text-base font-bold text-on-surface">Công viên Lê Văn Tám</p>
</div>
<div class="w-12 h-12 bg-[#9e422c] rounded-full flex items-center justify-center text-white shadow-md tactile-press cursor-pointer">
<span class="material-symbols-outlined">near_me</span>
</div>
</div>
</div>
<!-- Device Info Card -->
<section class="bg-surface-container-lowest rounded-2xl editorial-shadow overflow-hidden mb-12">
<div class="p-6 flex items-center justify-between border-b border-surface-container">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-[#FCEEE9] rounded-full flex items-center justify-center text-[#9e422c]">
<span class="material-symbols-outlined">bluetooth</span>
</div>
<div>

<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
<span class="text-sm text-[#9e422c] font-bold">Xa (Far)</span>
</div>
</div>
</div>
<button class="material-symbols-outlined text-on-surface-variant hover:text-on-surface transition-colors p-2">
                settings
            </button>
</div>

<button class="w-full px-6 py-4 flex items-center justify-between bg-white hover:bg-surface-container-low transition-colors tactile-press">
<span class="text-sm font-semibold text-on-surface">Chi tiết beacon</span>
<span class="material-symbols-outlined text-on-surface-variant text-xl">chevron_right</span>
</button>
</section>

<div class="flex flex-col gap-4">
<button class="w-full h-16 bg-[#31332e] text-[#fbf9f5] rounded-full font-bold text-base tracking-wide flex items-center justify-center gap-2 shadow-xl tactile-press">

        </button>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-white/90 dark:bg-stone-900/90 backdrop-blur-xl shadow-[0_-8px_24px_rgba(231,227,220,0.5)] rounded-t-[2.5rem]">
<a class="flex flex-col items-center justify-center bg-[#31332e] text-[#fbf9f5] dark:bg-stone-100 dark:text-stone-950 rounded-full w-12 h-12 shadow-lg tactile-press" href="#">
<span class="material-symbols-outlined" data-icon="home_health" style="font-variation-settings: 'FILL' 1;">home_health</span>
<span class="sr-only">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-[#5e6059] dark:text-stone-400 px-4 py-2 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" data-icon="shield_with_heart">shield_with_heart</span>
<span class="text-[11px] font-bold font-label mt-1">Safety</span>
</a>
<a class="flex flex-col items-center justify-center text-[#5e6059] dark:text-stone-400 px-4 py-2 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" data-icon="insights">insights</span>
<span class="text-[11px] font-bold font-label mt-1">Activity</span>
</a>
<a class="flex flex-col items-center justify-center text-[#5e6059] dark:text-stone-400 px-4 py-2 hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="text-[11px] font-bold font-label mt-1">Settings</span>
</a>
</nav>
