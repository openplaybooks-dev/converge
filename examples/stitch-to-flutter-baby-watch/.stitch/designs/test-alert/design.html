<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>Test Alert — BabyGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f4ee",
            "surface-bright": "#F4F2EE",
            "surface": "#fbf9f5",
            "on-surface": "#31332e",
            "on-surface-variant": "#5e6059",
            "secondary": "#4f635e",
            "on-secondary": "#faf7f6",
            "secondary-container": "#CDE3DC",
            "on-secondary-container": "#00391C",
            "error": "#9f403d",
            "error-container": "#EED9D2",
            "honey": "#F3D98C",
            "on-honey": "#241A00"
          },
          borderRadius: {
            "lg": "1.75rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Manrope"],
            "label": ["Manrope"]
          }
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body { font-family: 'Manrope', sans-serif; background: transparent; }
    @keyframes countdown {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .animate-countdown { animation: countdown 1s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="bottom-sheet" data-bg="surface">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>

    <!-- Sheet -->
    <div class="bottom-sheet-inner relative w-full max-w-md bg-white rounded-t-2xl p-6 pb-8 shadow-2xl">
      <!-- Handle -->
      <div class="w-10 h-1 bg-[#e2e3db] rounded-full mx-auto mb-6"></div>

      <!-- Title -->
      <h2 class="text-xl font-bold text-[#31332e] mb-2 text-center">Kiểm tra cảnh báo</h2>
      <p class="text-sm text-[#5e6059] text-center mb-6">Cảnh báo sẽ phát sau khoảng thời gian đã chọn</p>

      <!-- Countdown Circle -->
      <div class="flex justify-center mb-6">
        <div class="relative w-32 h-32">
          <div class="absolute inset-0 border-4 border-[#e2e3db] rounded-full"></div>
          <div class="absolute inset-0 border-4 border-[#4f635e] rounded-full border-t-transparent rotate-45"></div>
          <div class="absolute inset-0 flex items-center justify-center">
            <span class="text-4xl font-extrabold text-[#4f635e]">10</span>
          </div>
        </div>
      </div>

      <!-- Status Text -->
      <p class="text-center text-[#5e6059] mb-6">
        Nhấn nút bên dưới để bắt đầu đếm ngược
      </p>

      <!-- Actions -->
      <div class="space-y-3">
        <button class="w-full py-4 bg-[#4f635e] text-white font-bold rounded-full hover:opacity-90 transition-all flex items-center justify-center gap-2">
          <span class="material-symbols-outlined">play_arrow</span>
          Bắt đầu kiểm tra
        </button>
        <button class="w-full py-4 bg-[#f5f4ee] text-[#31332e] font-bold rounded-full hover:bg-[#efeee8] transition-all">
          Hủy
        </button>
      </div>
    </div>
  </div>
</body>
</html>
