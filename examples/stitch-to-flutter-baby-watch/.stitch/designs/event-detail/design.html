<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>Event Detail — BabyGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f4ee",
            "surface-bright": "#F4F2EE",
            "surface": "#fbf9f5",
            "on-surface": "#31332e",
            "on-surface-variant": "#5e6059",
            "secondary": "#4f635e",
            "on-secondary": "#faf7f6",
            "secondary-container": "#CDE3DC",
            "on-secondary-container": "#00391C",
            "tertiary": "#4f635e",
            "tertiary-container": "#dff6ee",
            "error": "#9f403d",
            "error-container": "#EED9D2"
          },
          borderRadius: {
            "lg": "1.75rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Manrope"],
            "label": ["Manrope"]
          }
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body { font-family: 'Manrope', sans-serif; background: transparent; }
  </style>
</head>
<body>
  <div class="bottom-sheet" data-bg="surface">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>

    <!-- Sheet -->
    <div class="relative w-full max-w-md bg-white rounded-t-2xl p-6 pb-8 shadow-2xl">
      <!-- Handle -->
      <div class="drag-handle"></div>

      <!-- Event Header -->
      <div class="row" data-spacing="md" style="margin-bottom: 24px;">
        <div class="avatar" style="width: 56px; height: 56px; background: #EED9D2; border-radius: 9999px; display: flex; align-items: center; justify-content: center;">
          <svg class="icon" data-name="warning" data-size="24" style="color: #9f403d;"></svg>
        </div>
        <div class="column" style="flex: 1;">
          <span class="label-small" style="color: #9f403d; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;">Alert Event</span>
          <span class="title-large" style="color: #31332e;">Left Safe Zone</span>
        </div>
      </div>

      <!-- Event Details -->
      <div class="card" data-bg="surface-container-low" data-radius="lg" style="padding: 20px; margin-bottom: 24px;">
        <div class="column" data-spacing="md">
          <div class="row" style="justify-content: space-between;">
            <span class="body-medium" style="color: #5e6059;">Thời gian</span>
            <span class="body-medium" style="color: #31332e; font-weight: 600;">10:24 AM • 4 phút</span>
          </div>
          <div class="row" style="justify-content: space-between;">
            <span class="body-medium" style="color: #5e6059;">Beacon</span>
            <span class="body-medium" style="color: #31332e; font-weight: 600;">Bé Na</span>
          </div>
          <div class="row" style="justify-content: space-between;">
            <span class="body-medium" style="color: #5e6059;">Vùng an toàn</span>
            <span class="body-medium" style="color: #31332e; font-weight: 600;">Home</span>
          </div>
          <div class="row" style="justify-content: space-between; align-items: center;">
            <span class="body-medium" style="color: #5e6059;">Trạng thái</span>
            <span class="chip" data-bg="error-container" data-color="error" style="padding: 4px 12px; font-size: 12px; font-weight: 700; border-radius: 9999px;">Đã xác nhận</span>
          </div>
        </div>
      </div>

      <!-- Map Location -->
      <div class="card" data-bg="surface-container" style="height: 128px; overflow: hidden; margin-bottom: 24px; border-radius: 12px;">
        <img style="width: 100%; height: 100%; object-fit: cover; opacity: 0.7;" alt="Location" src="https://picsum.photos/seed/map5/400/150" />
      </div>

      <!-- Close Button -->
      <button class="filled-btn" style="width: 100%; padding: 16px; background: #31332e; color: white; font-weight: 700; border-radius: 9999px;">
        Đóng
      </button>
    </div>
  </div>
</body>
</html>
