<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>Add Safe Zone — BabyGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f4ee",
            "surface-container": "#efeee8",
            "surface-container-high": "#e8e9e1",
            "surface-bright": "#F4F2EE",
            "surface": "#F4F2EE",
            "on-surface": "#31332e",
            "on-surface-variant": "#5e6059",
            "secondary": "#4f635e",
            "on-secondary": "#faf7f6",
            "secondary-container": "#CDE3DC",
            "on-secondary-container": "#00391C",
            "tertiary": "#4f635e",
            "tertiary-container": "#dff6ee",
            "primary": "#5e5e5e",
            "on-primary": "#f8f8f8",
            "outline-variant": "#b1b3ab"
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "1.75rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Manrope"],
            "label": ["Manrope"]
          }
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body { font-family: 'Manrope', sans-serif; background-color: #E8E8E8; }
    h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body>
  <div class="phone">
    <div data-flutter="scaffold" class="flex flex-col min-h-screen bg-[#F4F2EE]" data-color="surface">

      <!-- AppBar -->
      <header data-flutter="app-bar" class="fixed top-0 w-full z-50 bg-[#F4F2EE] flex items-center justify-between px-6 py-4 border-b border-[#E7E3DC]/30">
        <div class="flex items-center gap-4">
          <button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#f5f4ee] transition-colors active:scale-95">
            <span class="material-symbols-outlined text-[#31332e]">arrow_back</span>
          </button>
          <h1 class="text-xl font-extrabold tracking-tighter text-[#31332e]">Thêm vùng an toàn</h1>
        </div>
        <button class="text-[#4f635e] font-bold text-sm hover:opacity-80 transition-opacity">
          Lưu
        </button>
      </header>

      <!-- Body -->
      <main class="flex-1 overflow-y-auto pt-20 pb-32 px-6 max-w-2xl mx-auto space-y-8">

        <!-- Map Preview -->
        <div class="bg-white rounded-xl overflow-hidden shadow-[0_8px_24px_rgba(231,227,220,0.4)]">
          <div class="relative h-48 bg-[#efeee8]">
            <img class="w-full h-full object-cover opacity-60 grayscale-[0.3]" alt="Map" src="https://picsum.photos/seed/map3/400/200" />
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="w-16 h-16 bg-[#4f635e]/20 border-2 border-[#4f635e] rounded-full animate-pulse"></div>
            </div>
            <button aria-label="Get current location" class="absolute bottom-4 right-4 w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center hover:scale-105 active:scale-95 transition-all">
              <span class="material-symbols-outlined text-[#4f635e]">my_location</span>
            </button>
          </div>
        </div>

        <!-- Form Fields -->
        <div class="space-y-6">

          <!-- Name Field -->
          <div class="space-y-2">
            <label class="text-xs font-bold tracking-wider text-[#5e6059] uppercase">Tên vùng</label>
            <input type="text" placeholder="Ví dụ: Nhà, Trường học" class="w-full bg-white text-[#31332e] text-lg px-5 py-4 rounded-xl border border-[#E7E3DC] focus:border-[#4f635e] focus:ring-2 focus:ring-[#4f635e]/20 outline-none transition-all" />
          </div>

          <!-- Address Field -->
          <div class="space-y-2">
            <label class="text-xs font-bold tracking-wider text-[#5e6059] uppercase">Địa chỉ</label>
            <div class="relative">
              <input type="text" placeholder="123 Đường ABC, Quận XYZ" class="w-full bg-white text-[#31332e] text-lg px-5 py-4 rounded-xl border border-[#E7E3DC] focus:border-[#4f635e] focus:ring-2 focus:ring-[#4f635e]/20 outline-none transition-all pr-12" />
              <button aria-label="Get GPS location" class="absolute right-4 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-[#4f635e]">
                <span class="material-symbols-outlined text-xl">location_on</span>
              </button>
            </div>
          </div>

          <!-- Radius Selector -->
          <div class="space-y-3">
            <label class="text-xs font-bold tracking-wider text-[#5e6059] uppercase">Bán kính an toàn</label>
            <div class="flex gap-2">
              <button class="flex-1 py-3 bg-[#4f635e] text-white rounded-full font-bold text-sm transition-all">25m</button>
              <button class="flex-1 py-3 bg-white text-[#31332e] rounded-full font-bold text-sm border border-[#E7E3DC] hover:bg-[#f5f4ee] transition-all">50m</button>
              <button class="flex-1 py-3 bg-white text-[#31332e] rounded-full font-bold text-sm border border-[#E7E3DC] hover:bg-[#f5f4ee] transition-all">100m</button>
              <button class="flex-1 py-3 bg-white text-[#31332e] rounded-full font-bold text-sm border border-[#E7E3DC] hover:bg-[#f5f4ee] transition-all">200m</button>
            </div>
          </div>

          <!-- Active Toggle -->
          <div class="flex items-center justify-between bg-white p-5 rounded-xl border border-[#E7E3DC]">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-[#4f635e]">verified_user</span>
              <span class="font-semibold text-[#31332e]">Kích hoạt vùng an toàn</span>
            </div>
            <button aria-label="Toggle active" class="w-12 h-6 bg-[#4f635e] rounded-full flex items-center justify-end px-1">
              <div class="w-4 h-4 bg-white rounded-full"></div>
            </button>
          </div>

        </div>

      </main>

    </div>
  </div>
</body>
</html>
