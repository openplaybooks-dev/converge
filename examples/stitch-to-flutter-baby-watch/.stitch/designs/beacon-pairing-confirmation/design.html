<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>Beacon Pairing Confirmation — BabyGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f4ee",
            "surface-bright": "#F4F2EE",
            "on-surface": "#31332e",
            "on-surface-variant": "#5e6059",
            "secondary": "#4f635e",
            "on-secondary": "#faf7f6",
            "secondary-container": "#CDE3DC",
            "on-secondary-container": "#00391C",
            "mint": "#CDE3DC",
            "on-mint": "#00391C",
            "primary": "#5e5e5e"
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Manrope"],
            "label": ["Manrope"]
          }
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Manrope', sans-serif; background-color: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl">

      <!-- Beacon Icon -->
      <div class="flex justify-center mb-6">
        <div class="w-20 h-20 bg-[#CDE3DC] rounded-full flex items-center justify-center">
          <span class="material-symbols-outlined text-[#4f635e] text-4xl" style="font-variation-settings: 'FILL' 1;">sensors</span>
        </div>
      </div>

      <!-- Beacon Info -->
      <div class="text-center mb-8 space-y-2">
        <h2 class="text-2xl font-extrabold text-[#31332e] tracking-tight" style="font-family: 'Plus Jakarta Sans', sans-serif;">Ghép nối Beacon</h2>
        <p class="text-[#5e6059] font-medium">FDA50693-A4E2-4FB1-AFCF-C6EB07647825</p>
        <div class="flex items-center justify-center gap-2 mt-3">
          <div class="flex gap-1">
            <div class="w-2 h-4 bg-[#4f635e] rounded-sm"></div>
            <div class="w-2 h-4 bg-[#4f635e]/60 rounded-sm"></div>
            <div class="w-2 h-4 bg-[#4f635e]/30 rounded-sm"></div>
          </div>
          <span class="text-sm text-[#5e6059] font-medium">Tín hiệu mạnh</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="space-y-3">
        <button class="w-full py-4 bg-[#4f635e] text-white font-bold rounded-full hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
          <span class="material-symbols-outlined">bluetooth</span>
          Ghép nối
        </button>
        <button class="w-full py-4 text-[#5e6059] font-semibold rounded-full hover:bg-[#f5f4ee] transition-all active:scale-[0.98]">
          Hủy
        </button>
      </div>

    </div>
  </div>
</body>
</html>
