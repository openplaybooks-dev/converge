<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>Co-Guardians — BabyGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f4ee",
            "surface-container": "#efeee8",
            "surface-container-high": "#e8e9e1",
            "surface-container-highest": "#e2e3db",
            "surface-bright": "#F4F2EE",
            "surface": "#F4F2EE",
            "on-surface": "#31332e",
            "on-surface-variant": "#5e6059",
            "secondary": "#4f635e",
            "on-secondary": "#faf7f6",
            "secondary-container": "#CDE3DC",
            "on-secondary-container": "#00391C",
            "tertiary": "#4f635e",
            "tertiary-container": "#dff6ee",
            "on-tertiary": "#e8fef7",
            "on-tertiary-container": "#4a5e59",
            "primary": "#5e5e5e",
            "on-primary": "#f8f8f8",
            "outline-variant": "#b1b3ab",
            "error": "#9f403d",
            "error-container": "#fe8b70"
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "1.75rem",
            "xl": "2rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Manrope"],
            "label": ["Manrope"]
          }
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body { font-family: 'Manrope', sans-serif; background-color: #E8E8E8; }
    h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="scaffold" data-color="on-surface" data-bg="surface">

      <!-- AppBar -->
      <header class="app-bar" data-color="surface" data-bg="surface" data-p="none">
        <div class="flex items-center gap-4">
          <button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#f5f4ee] transition-colors active:scale-95">
            <span class="material-symbols-outlined text-[#31332e]">arrow_back</span>
          </button>
          <h1 class="text-xl font-extrabold tracking-tighter" data-color="on-surface">Người cùng theo dõi</h1>
        </div>
        <button aria-label="Add guardian" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#f5f4ee] transition-colors">
          <span class="material-symbols-outlined text-[#31332e]">person_add</span>
        </button>
      </header>

      <!-- Body -->
      <main class="body" data-color="on-surface" data-bg="surface" data-spacing="lg">

        <!-- Guardian Cards -->
        <div class="space-y-4">

          <!-- Guardian 1: Mom -->
          <div class="bg-white rounded-xl p-5 flex items-center justify-between shadow-[0_4px_12px_rgba(231,227,220,0.2)]">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 rounded-full bg-[#E8F5E9] text-[#4f635e] flex items-center justify-center font-bold text-xl border-2 border-white shadow-sm">
                M
              </div>
              <div class="space-y-1">
                <p class="font-bold text-lg" data-color="on-surface">Mẹ</p>
                <div class="flex items-center gap-2">
                  <span class="bg-[#dff6ee]" data-color="secondary-container" data-text-color="on-secondary-container" text-[10px] font-bold px-2 py-0.5 rounded-full">Chủ sở hữu</span>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 bg-[#CDE3DC] text-[#00391C] text-xs font-bold rounded-full flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-[#4f635e] animate-pulse"></span>
                Đang gần
              </span>
            </div>
          </div>

          <!-- Guardian 2: Dad -->
          <div class="bg-white rounded-xl p-5 flex items-center justify-between shadow-[0_4px_12px_rgba(231,227,220,0.2)]">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 rounded-full bg-[#FFF9C4] text-[#F9A825] flex items-center justify-center font-bold text-xl border-2 border-white shadow-sm">
                B
              </div>
              <div class="space-y-1">
                <p class="font-bold text-lg" data-color="on-surface">Bố</p>
                <div class="flex items-center gap-2">
                  <span class="bg-[#e2e3db] text-[#5e6059] text-[10px] font-bold px-2 py-0.5 rounded-full">Người theo dõi</span>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 bg-[#FFF9C4]/50 text-[#F9A825] text-xs font-bold rounded-full">
                Xa beacon
              </span>
            </div>
          </div>

          <!-- Guardian 3: Grandma -->
          <div class="bg-white rounded-xl p-5 flex items-center justify-between shadow-[0_4px_12px_rgba(231,227,220,0.2)]">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 rounded-full bg-[#e8e9e1] text-[#797b75] flex items-center justify-center font-bold text-xl border-2 border-white shadow-sm">
                B
              </div>
              <div class="space-y-1">
                <p class="font-bold text-lg" data-color="on-surface">Bà Nội</p>
                <div class="flex items-center gap-2">
                  <span class="bg-[#e2e3db] text-[#5e6059] text-[10px] font-bold px-2 py-0.5 rounded-full">Người theo dõi</span>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 bg-[#e2e3db] text-[#797b75] text-xs font-bold rounded-full">
                Ngoại tuyến
              </span>
            </div>
          </div>

        </div>

        <!-- Invite Section -->
        <div class="pt-6 space-y-4">
          <button class="w-full py-4 bg-[#4f635e] text-white rounded-full font-bold text-lg shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
            <span class="material-symbols-outlined">person_add</span>
            Mời người cùng theo dõi
          </button>
          <p class="text-center text-xs text-[#5e6059]/70">
            Chia sẻ qua mã QR hoặc liên kết mời
          </p>
        </div>

      </main>

    </div>
  </div>
</body>
</html>
