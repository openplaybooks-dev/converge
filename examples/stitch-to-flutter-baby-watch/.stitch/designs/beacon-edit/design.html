<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>Beacon Edit — BabyGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f4ee",
            "surface-container": "#efeee8",
            "surface-bright": "#F4F2EE",
            "surface": "#F4F2EE",
            "on-surface": "#31332e",
            "on-surface-variant": "#5e6059",
            "primary": "#5e5e5e",
            "on-primary": "#f8f8f8",
            "error": "#9f403d",
            "outline-variant": "#b1b3ab"
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "1.75rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Manrope"],
            "label": ["Manrope"]
          }
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body { font-family: 'Manrope', sans-serif; background-color: #E8E8E8; }
    h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="scaffold" data-flutter="scaffold" data-color="#F4F2EE">

      <!-- AppBar -->
      <header data-flutter="app-bar" class="fixed top-0 w-full z-50 bg-[#F4F2EE] flex items-center justify-between px-6 py-4 border-b border-[#E7E3DC]/30">
        <div class="flex items-center gap-4">
          <button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#f5f4ee] transition-colors active:scale-95">
            <span class="material-symbols-outlined text-[#31332e]">arrow_back</span>
          </button>
          <h1 class="text-xl font-extrabold tracking-tighter text-[#31332e]">Chỉnh sửa Beacon</h1>
        </div>
        <button class="text-[#4f635e] font-bold text-sm hover:opacity-80 transition-opacity">
          Lưu
        </button>
      </header>

      <!-- Body -->
      <main class="flex-1 overflow-y-auto pt-20 pb-32 px-6 max-w-2xl mx-auto space-y-8">

        <!-- Avatar Section -->
        <div class="flex flex-col items-center mt-8">
          <div class="w-24 h-24 rounded-full bg-[#CDE3DC] flex items-center justify-center text-[#4f635e] mb-4">
            <span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">child_care</span>
          </div>
          <button class="text-[#4f635e] text-sm font-semibold hover:underline">Đổi biểu tượng</button>
        </div>

        <!-- Form Fields -->
        <div class="space-y-6">

          <!-- Name Field -->
          <div class="space-y-2">
            <label class="text-xs font-bold tracking-wider text-[#5e6059] uppercase">Tên Beacon</label>
            <input type="text" value="Bé Na" class="w-full bg-white text-[#31332e] text-lg font-semibold px-5 py-4 rounded-xl border border-[#E7E3DC] focus:border-[#4f635e] focus:ring-2 focus:ring-[#4f635e]/20 outline-none transition-all" />
          </div>

          <!-- UUID Display (readonly) -->
          <div class="space-y-2">
            <label class="text-xs font-bold tracking-wider text-[#5e6059] uppercase">UUID</label>
            <div class="w-full bg-[#f5f4ee] text-[#5e6059] text-sm px-5 py-4 rounded-xl border border-[#E7E3DC] font-mono">
              FDA50693-A4E2-4FB1-AFCF-C6EB07647825
            </div>
          </div>

          <!-- Major/Minor Grid -->
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
              <label class="text-xs font-bold tracking-wider text-[#5e6059] uppercase">Major</label>
              <input type="number" value="10001" class="w-full bg-white text-[#31332e] text-lg font-semibold px-5 py-4 rounded-xl border border-[#E7E3DC] focus:border-[#4f635e] focus:ring-2 focus:ring-[#4f635e]/20 outline-none transition-all" />
            </div>
            <div class="space-y-2">
              <label class="text-xs font-bold tracking-wider text-[#5e6059] uppercase">Minor</label>
              <input type="number" value="20002" class="w-full bg-white text-[#31332e] text-lg font-semibold px-5 py-4 rounded-xl border border-[#E7E3DC] focus:border-[#4f635e] focus:ring-2 focus:ring-[#4f635e]/20 outline-none transition-all" />
            </div>
          </div>

          <!-- TX Power -->
          <div class="space-y-2">
            <label class="text-xs font-bold tracking-wider text-[#5e6059] uppercase">TX Power (dBm)</label>
            <input type="number" value="-59" class="w-full bg-white text-[#31332e] text-lg font-semibold px-5 py-4 rounded-xl border border-[#E7E3DC] focus:border-[#4f635e] focus:ring-2 focus:ring-[#4f635e]/20 outline-none transition-all" />
            <p class="text-xs text-[#5e6059]">Cường độ tín hiệu hiệu chỉnh tại 1m</p>
          </div>

        </div>

        <!-- Delete Button -->
        <div class="pt-8">
          <button class="w-full py-4 bg-[#EED9D2] text-[#9f403d] font-bold rounded-full hover:bg-[#EED9D2]/80 transition-all active:scale-[0.98] flex items-center justify-center gap-3">
            <span class="material-symbols-outlined">delete</span>
            Xóa Beacon
          </button>
        </div>

      </main>

    </div>
  </div>
</body>
</html>
