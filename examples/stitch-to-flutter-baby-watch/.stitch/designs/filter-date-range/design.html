<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>Filter Date Range — BabyGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f4ee",
            "surface-bright": "#F4F2EE",
            "on-surface": "#31332e",
            "on-surface-variant": "#5e6059",
            "secondary": "#4f635e",
            "on-secondary": "#faf7f6",
            "secondary-container": "#CDE3DC",
            "on-secondary-container": "#00391C",
            "outline-variant": "#b1b3ab"
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "1.75rem",
            "xl": "2rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Manrope"],
            "label": ["Manrope"]
          }
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Manrope', sans-serif; background-color: #E8E8E8; display: flex; align-items: flex-end; justify-content: center; min-height: 100vh; padding: 16px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="bg-white rounded-t-3xl w-full max-w-sm p-6 pb-12">

      <!-- Drag Handle -->
      <div class="flex justify-center mb-6">
        <div class="w-10 h-1 bg-[#b1b3ab] rounded-full"></div>
      </div>

      <!-- Title -->
      <h2 class="text-xl font-extrabold text-[#31332e] mb-6 tracking-tight" style="font-family: 'Plus Jakarta Sans', sans-serif;">Chọn khoảng ngày</h2>

      <!-- Preset Options -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <button class="py-3 px-4 bg-[#f5f4ee] text-[#5e6059] font-semibold rounded-xl text-sm hover:bg-[#e2e3db] transition-colors active:scale-[0.98]">
          Hôm nay
        </button>
        <button class="py-3 px-4 bg-[#f5f4ee] text-[#5e6059] font-semibold rounded-xl text-sm hover:bg-[#e2e3db] transition-colors active:scale-[0.98]">
          7 ngày qua
        </button>
        <button class="py-3 px-4 bg-[#f5f4ee] text-[#5e6059] font-semibold rounded-xl text-sm hover:bg-[#e2e3db] transition-colors active:scale-[0.98]">
          30 ngày qua
        </button>
        <button class="py-3 px-4 bg-[#CDE3DC] text-[#00391C] font-semibold rounded-xl text-sm active:scale-[0.98] transition-all">
          Tùy chỉnh
        </button>
      </div>

      <!-- Date Inputs -->
      <div class="space-y-3 mb-8">
        <div class="space-y-2">
          <label class="text-xs font-bold tracking-wider text-[#5e6059] uppercase">Từ ngày</label>
          <input type="date" class="w-full bg-[#f5f4ee] text-[#31332e] font-semibold px-4 py-3.5 rounded-xl border border-[#b1b3ab]/30 focus:border-[#4f635e] focus:ring-2 focus:ring-[#4f635e]/20 outline-none transition-all" />
        </div>
        <div class="space-y-2">
          <label class="text-xs font-bold tracking-wider text-[#5e6059] uppercase">Đến ngày</label>
          <input type="date" class="w-full bg-[#f5f4ee] text-[#31332e] font-semibold px-4 py-3.5 rounded-xl border border-[#b1b3ab]/30 focus:border-[#4f635e] focus:ring-2 focus:ring-[#4f635e]/20 outline-none transition-all" />
        </div>
      </div>

      <!-- Actions -->
      <div class="space-y-3">
        <button class="w-full py-4 bg-[#4f635e] text-white font-bold rounded-full hover:opacity-90 active:scale-[0.98] transition-all">
          Áp dụng
        </button>
        <button class="w-full py-4 text-[#5e6059] font-semibold rounded-full hover:bg-[#f5f4ee] transition-all active:scale-[0.98]">
          Hủy
        </button>
      </div>

    </div>
  </div>
</body>
</html>
