<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Engine Living Playbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --hb-bg: #fafaf9;
      --hb-card: #ffffff;
      --hb-charcoal: #37352f;
      --hb-nearblack: #1a1a1a;
      --hb-slate: #5d5b54;
      --hb-stone: #787671;
      --hb-hairline: #ede9e4;
      --hb-purple: #5645d4;
      --hb-depth-0: #5645d4;
      --hb-depth-1: #5645d4;
      --hb-depth-2: #793400;
      --hb-depth-3: #a02e6d;
      --hb-depth-4: #2a9d99;
      --hb-shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --hb-shadow-md: 0 2px 6px rgba(0,0,0,0.08);
      --hb-duration-fast: 150ms;
      --hb-duration-base: 200ms;
      --hb-duration-expand: 300ms;
      --hb-easing: ease;
      --hb-radius: 12px;
      --hb-radius-sm: 6px;
      --hb-radius-full: 9999px;

      --badge-pass-bg: #d9f3e1;
      --badge-pass-text: #1aae39;
      --badge-running-bg: #fef7d6;
      --badge-running-text: #a07d20;
      --badge-failed-bg: #fde0ec;
      --badge-failed-text: #c0285a;
      --badge-pending-bg: #f0eeec;
      --badge-pending-text: #787671;
      --badge-blocked-bg: #f8f5e8;
      --badge-blocked-text: #5d5b54;
      --badge-gateway-bg: #e6e0f5;
      --badge-gateway-text: #391c57;
      --badge-spawner-bg: #dcecfa;
      --badge-spawner-text: #0075de;
      --badge-leaf-bg: #f0eeec;
      --badge-leaf-text: #787671;
      --gateway-bg: #f4f1fb;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      background: var(--hb-bg);
      font-family: 'Inter', -apple-system, system-ui, 'Segoe UI', sans-serif;
      color: var(--hb-nearblack);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .hb-page {
      max-width: 680px;
      margin: 0 auto;
      padding: 64px 32px 120px;
    }

    /* Filter bar */
    .hb-filter-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .hb-pill-tab {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      border-radius: var(--hb-radius-full);
      border: 1px solid var(--hb-hairline);
      background: transparent;
      color: var(--hb-stone);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--hb-duration-fast) var(--hb-easing);
      font-family: inherit;
    }

    .hb-pill-tab:hover {
      border-color: var(--hb-stone);
      color: var(--hb-slate);
    }

    .hb-pill-tab.active {
      background: var(--hb-nearblack);
      color: #ffffff;
      border-color: var(--hb-nearblack);
    }

    .hb-pill-tab .count {
      font-size: 11px;
      opacity: 0.7;
    }

    /* Playbook header */
    .hb-playbook-header {
      margin-bottom: 48px;
    }

    .hb-playbook-title {
      font-size: 36px;
      font-weight: 600;
      line-height: 1.15;
      color: var(--hb-charcoal);
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .hb-playbook-desc {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--hb-slate);
      max-width: 560px;
      margin-bottom: 32px;
    }

    /* Gateway section */
    .hb-gateway {
      background: var(--gateway-bg);
      border-radius: var(--hb-radius);
      border-left: 4px solid var(--hb-depth-0);
      padding: 20px 24px;
      margin-bottom: 40px;
    }

    .hb-gateway-header {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .hb-gateway-icon {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--hb-purple);
      border-radius: 2px;
      flex-shrink: 0;
    }

    .hb-gateway-title {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--hb-charcoal);
      flex: 1;
    }

    .hb-gateway-chevron {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      color: var(--hb-stone);
      transition: transform var(--hb-duration-base) var(--hb-easing);
    }

    .hb-gateway-chevron.open {
      transform: rotate(90deg);
    }

    .hb-gateway-children {
      padding-top: 16px;
    }

    .hb-gateway.collapsed .hb-gateway-children {
      display: none;
    }

    /* Task card */
    .hb-task-card {
      background: var(--hb-card);
      border-radius: var(--hb-radius);
      border-left: 3px solid var(--hb-depth-1);
      box-shadow: var(--hb-shadow-sm);
      padding: 16px 20px;
      margin-bottom: 12px;
      transition: box-shadow var(--hb-duration-fast) var(--hb-easing),
                  border-color var(--hb-duration-fast) var(--hb-easing);
    }

    .hb-task-card[data-depth="2"] { border-left-color: var(--hb-depth-2); }
    .hb-task-card[data-depth="3"] { border-left-color: var(--hb-depth-3); }
    .hb-task-card[data-depth="4"] { border-left-color: var(--hb-depth-4); }

    .hb-task-card:hover {
      box-shadow: var(--hb-shadow-md);
    }

    .hb-task-card.hb-task-card--pass-flash {
      border-left-color: var(--badge-pass-text) !important;
      transition: border-color 200ms ease;
    }

    .hb-task-card[data-indent="2"] { margin-left: 20px; }
    .hb-task-card[data-indent="3"] { margin-left: 40px; }
    .hb-task-card[data-indent="4"] { margin-left: 60px; }

    /* Task title row */
    .hb-task-title-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
    }

    .hb-task-title {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.50;
      color: var(--hb-nearblack);
      flex: 1;
      transition: color var(--hb-duration-fast) var(--hb-easing);
    }

    .hb-task-title-row:hover .hb-task-title {
      color: var(--hb-charcoal);
    }

    .hb-task-chevron {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      color: var(--hb-stone);
      margin-top: 4px;
      transition: transform var(--hb-duration-base) var(--hb-easing);
    }

    .hb-task-chevron.open {
      transform: rotate(90deg);
    }

    /* Task description */
    .hb-task-desc {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.50;
      color: var(--hb-slate);
      margin-top: 4px;
      padding-left: 20px;
    }

    /* Metadata row */
    .hb-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding-left: 20px;
      flex-wrap: wrap;
    }

    /* Mode badge */
    .hb-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: var(--hb-radius-sm);
    }

    .hb-mode-badge.gateway {
      background: var(--badge-gateway-bg);
      color: var(--badge-gateway-text);
    }

    .hb-mode-badge.spawner {
      background: var(--badge-spawner-bg);
      color: var(--badge-spawner-text);
    }

    .hb-mode-badge.leaf {
      background: var(--badge-leaf-bg);
      color: var(--badge-leaf-text);
    }

    /* Status badge */
    .hb-status-badge {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: var(--hb-radius-full);
    }

    .hb-status-badge.pass { background: var(--badge-pass-bg); color: var(--badge-pass-text); }
    .hb-status-badge.running { background: var(--badge-running-bg); color: var(--badge-running-text); }
    .hb-status-badge.failed { background: var(--badge-failed-bg); color: var(--badge-failed-text); }
    .hb-status-badge.pending { background: var(--badge-pending-bg); color: var(--badge-pending-text); }
    .hb-status-badge.blocked { background: var(--badge-blocked-bg); color: var(--badge-blocked-text); }

    /* Duration */
    .hb-duration {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--hb-stone);
    }

    /* Spawner pulse dot */
    .hb-spawner-pulse {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: #dd5b00;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Checks list */
    .hb-checks {
      margin-top: 10px;
      padding-left: 20px;
    }

    .hb-check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      font-size: 13px;
      color: var(--hb-slate);
    }

    .hb-check-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .hb-check-dot.pass { background: var(--badge-pass-text); }
    .hb-check-dot.fail { background: var(--badge-failed-text); }
    .hb-check-dot.pending {
      background: var(--hb-stone);
      animation: pulse 2s ease-in-out infinite;
    }

    .hb-check-icon {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    .hb-check-icon.pass { color: var(--badge-pass-text); }
    .hb-check-icon.fail { color: var(--badge-failed-text); }

    /* IO rows */
    .hb-io-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 10px;
      padding-left: 20px;
      flex-wrap: wrap;
    }

    .hb-io-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--hb-stone);
      line-height: 1.4;
      padding-top: 2px;
    }

    .hb-io-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .hb-io-pill {
      font-size: 13px;
      font-weight: 400;
      color: var(--hb-charcoal);
      background: #ffffff;
      border: 1px solid var(--hb-hairline);
      border-radius: var(--hb-radius-sm);
      padding: 3px 10px;
      transition: background var(--hb-duration-fast) var(--hb-easing);
      cursor: default;
    }

    .hb-io-pill:hover {
      background: var(--hb-hairline);
    }

    /* Depends on */
    .hb-depends-on {
      font-size: 13px;
      font-weight: 400;
      color: var(--hb-slate);
      margin-top: 8px;
      padding-left: 20px;
    }

    .hb-depends-on .task-ref {
      color: #0075de;
      text-decoration: none;
      cursor: pointer;
    }

    .hb-depends-on .task-ref:hover {
      text-decoration: underline;
    }

    /* Task body (expanded markdown) */
    .hb-task-body {
      max-width: 620px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--hb-hairline);
      font-size: 15px;
      line-height: 1.65;
      color: var(--hb-nearblack);
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height var(--hb-duration-expand) var(--hb-easing),
                  opacity var(--hb-duration-base) var(--hb-easing);
    }

    .hb-task-body.open {
      max-height: 2000px;
      opacity: 1;
    }

    .hb-task-body h1, .hb-task-body h2, .hb-task-body h3 {
      color: var(--hb-charcoal);
      margin-top: 24px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .hb-task-body h1 { font-size: 20px; line-height: 1.3; }
    .hb-task-body h2 { font-size: 18px; line-height: 1.35; }
    .hb-task-body h3 { font-size: 16px; line-height: 1.4; }

    .hb-task-body p {
      margin-bottom: 12px;
    }

    .hb-task-body code {
      font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace;
      font-size: 13px;
      background: var(--badge-leaf-bg);
      border-radius: var(--hb-radius-sm);
      padding: 2px 6px;
      color: var(--hb-charcoal);
    }

    .hb-task-body pre {
      background: var(--badge-leaf-bg);
      border-radius: var(--hb-radius-sm);
      padding: 14px 16px;
      overflow-x: auto;
      margin-bottom: 12px;
    }

    .hb-task-body pre code {
      background: transparent;
      padding: 0;
      font-size: 13px;
      line-height: 1.6;
    }

    .hb-task-body ul, .hb-task-body ol {
      padding-left: 20px;
      margin-bottom: 12px;
    }

    .hb-task-body li {
      margin-bottom: 4px;
    }

    .hb-task-body a {
      color: #0075de;
      text-decoration: none;
    }

    .hb-task-body a:hover {
      text-decoration: underline;
    }

    .hb-task-body strong {
      font-weight: 600;
    }

    /* Children wrapper */
    .hb-children {
      padding-top: 12px;
    }

    /* Hidden filtered */
    .hb-filtered-out {
      display: none;
    }

    /* Responsive */
    @media (max-width: 767px) {
      .hb-page {
        padding: 40px 24px 80px;
      }

      .hb-playbook-title {
        font-size: 28px;
      }

      .hb-gateway {
        padding: 16px 18px;
      }

      .hb-task-card {
        padding: 14px 16px;
      }

      .hb-task-card[data-indent="2"] { margin-left: 12px; }
      .hb-task-card[data-indent="3"] { margin-left: 24px; }
      .hb-task-card[data-indent="4"] { margin-left: 36px; }

      .hb-task-desc,
      .hb-meta-row,
      .hb-checks,
      .hb-io-row,
      .hb-depends-on {
        padding-left: 0;
      }

      .hb-filter-bar {
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .hb-filter-bar::-webkit-scrollbar {
        display: none;
      }
    }

    @media (max-width: 479px) {
      .hb-page {
        padding: 32px 16px 64px;
      }

      .hb-playbook-title {
        font-size: 26px;
      }

      .hb-gateway-title {
        font-size: 19px;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--hb-hairline); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="hb-page">
    <header class="hb-playbook-header">
      <h1 class="hb-playbook-title">Content Engine Living Playbook</h1>
      <p class="hb-playbook-desc">A composable, version-controlled playbook for generating, clustering, and publishing editorial content. Tasks run autonomously — spawning children, validating outputs, and propagating status up the tree.</p>

      <div class="hb-filter-bar" role="toolbar" aria-label="Filter tasks">
        <button class="hb-pill-tab active" data-filter="all">All <span class="count" id="count-all"></span></button>
        <button class="hb-pill-tab" data-filter="gateway">Gateway <span class="count" id="count-gateway"></span></button>
        <button class="hb-pill-tab" data-filter="spawner">Spawner <span class="count" id="count-spawner"></span></button>
        <button class="hb-pill-tab" data-filter="leaf">Leaf <span class="count" id="count-leaf"></span></button>
        <button class="hb-pill-tab" data-filter="pass">Pass <span class="count" id="count-pass"></span></button>
        <button class="hb-pill-tab" data-filter="failed">Failed <span class="count" id="count-failed"></span></button>
      </div>
    </header>

    <main id="playbook-content">
      <!-- Content rendered by JS -->
    </main>
  </div>

  <script>
    // Playbook data — realistic sample with 5 levels of nesting
    const playbook = {
      title: "Content Engine Living Playbook",
      description: "A composable, version-controlled playbook for generating, clustering, and publishing editorial content. Tasks run autonomously — spawning children, validating outputs, and propagating status up the tree.",
      gateways: [
        {
          id: "01-ingest",
          title: "Ingest & Normalize Sources",
          status: "pass",
          duration: "1m 12s",
          children: [
            {
              id: "01a-fetch-feeds",
              title: "Fetch all RSS and JSON feeds",
              mode: "leaf",
              status: "pass",
              duration: "423ms",
              description: "Pull from 14 configured source feeds in parallel.",
              inputs: ["feeds.json", "config.yaml"],
              outputs: ["raw-articles.json", "fetch-log.json"],
              checks: [
                { label: "HTTP 200 from all 14 feeds", status: "pass" },
                { label: "At least 10 articles collected", status: "pass" },
                { label: "Feed timestamps within 24h", status: "pass" },
                { label: "No duplicate URLs", status: "pass" }
              ],
              body: "Execute the feed fetcher against the source catalog.\n\n- Uses the `feeds.json` catalog for source endpoints\n- Respects `config.yaml` rate-limit settings (max 3 concurrent)\n- Stores raw HTML in `raw-articles.json`\n- Deduplicates by canonical URL before writing\n\n```bash\nnode scripts/fetch-feeds.js --catalog feeds.json --out raw-articles.json\n```\n\nIf a feed returns non-200, log the error and continue. Do not fail the entire run on a single source."
            },
            {
              id: "01b-parse-normalize",
              title: "Parse and normalize article metadata",
              mode: "leaf",
              status: "pass",
              duration: "891ms",
              description: "Extract title, author, date, tags, and body from raw HTML.",
              inputs: ["raw-articles.json"],
              outputs: ["articles.json"],
              checks: [
                { label: "Normalized JSON exists", status: "pass" },
                { label: "Title and author populated", status: "pass" },
                { label: "Date parsed as ISO 8601", status: "pass" }
              ],
              body: "Parse the raw feed output using a custom extract pipeline.\n\n- Extract: `title`, `author`, `publishedAt`, `tags[]`, `excerpt`, `canonicalUrl`\n- Normalize dates to ISO 8601\n- Strip HTML tags from excerpts\n- Validate required fields — drop malformed records\n\n```js\nconst articles = await parseAndNormalize(rawArticles, {\n  required: ['title', 'canonicalUrl', 'publishedAt'],\n  maxAge: 7 * 24 * 60 * 60 * 1000 // 7 days\n});\n```"
            },
            {
              id: "01c-enrich",
              title: "Enrich with sentiment and topic signals",
              mode: "spawner",
              status: "pass",
              duration: "2s 4ms",
              description: "Run each article through the ML pipeline to attach sentiment scores and topic vectors.",
              dependsOn: ["01a-fetch-feeds"],
              children: [
                {
                  id: "01c-sentiment",
                  title: "Sentiment analysis per article",
                  mode: "leaf",
                  status: "pass",
                  duration: "1s 203ms",
                  description: "Attach -1.0 to +1.0 sentiment score using the fine-tuned model.",
                  inputs: ["articles.json"],
                  outputs: ["articles-enriched.json"],
                  checks: [
                    { label: "Sentiment score added to all records", status: "pass" },
                    { label: "Score range [-1, +1]", status: "pass" }
                  ],
                  body: "Batch-process articles through the sentiment model.\n\n```bash\nnode scripts/sentiment.js --in articles.json --out articles-enriched.json\n```"
                },
                {
                  id: "01c-topics",
                  title: "Topic vector embedding",
                  mode: "leaf",
                  status: "pass",
                  duration: "801ms",
                  description: "Attach 128-dim topic vectors for clustering downstream.",
                  inputs: ["articles-enriched.json"],
                  outputs: ["articles-embedded.json"],
                  checks: [
                    { label: "128-dim vector present", status: "pass" },
                    { label: "All records processed", status: "pass" }
                  ],
                  body: "Run embedding pipeline.\n\n```bash\npython embed.py --model sentence-transformers --in articles-enriched.json --out articles-embedded.json\n```"
                }
              ]
            }
          ]
        },
        {
          id: "02-cluster",
          title: "Cluster & Curate Articles",
          mode: "gateway",
          status: "pass",
          duration: "47s",
          children: [
            {
              id: "02a-semantic-cluster",
              title: "Semantic clustering via topic vectors",
              mode: "leaf",
              status: "pass",
              duration: "12s",
              description: "Group articles by cosine similarity of topic vectors. K=12 clusters.",
              inputs: ["articles-embedded.json"],
              outputs: ["clusters.json", "cluster-report.json"],
              checks: [
                { label: "Exactly 12 clusters formed", status: "pass" },
                { label: "Min 3 articles per cluster", status: "pass" },
                { label: "Silhouette score > 0.35", status: "pass" }
              ],
              body: "Apply K-means clustering on the 128-dim topic vectors.\n\n```python\nfrom sklearn.cluster import KMeans\n\nkmeans = KMeans(n_clusters=12, random_state=42, n_init=10)\nlabels = kmeans.fit_predict(vectors)\n```\n\nWrite `clusters.json` (articleId → clusterId map) and `cluster-report.json` (centroid summaries, silhouette score)."
            },
            {
              id: "02b-assign-curators",
              title: "Assign curators to each cluster",
              mode: "spawner",
              status: "pass",
              duration: "3s",
              description: "Spawn one curator task per cluster for human review and editorial pick.",
              dependsOn: ["02a-semantic-cluster"],
              children: [
                {
                  id: "02b-cluster-a",
                  title: "Curate cluster: Technology & AI",
                  mode: "leaf",
                  status: "pass",
                  duration: "28s",
                  description: "Human review of the Technology cluster (14 articles). Pick 3 for publication.",
                  inputs: ["clusters.json"],
                  outputs: ["curation-clusters/tech-picks.json"],
                  checks: [
                    { label: "3 articles selected", status: "pass" },
                    { label: "Human signature recorded", status: "pass" }
                  ],
                  body: "Review cluster `tech-ai` (14 articles) and select 3 for the next publication slot.\n\nTag criteria: relevance to current beat, recency, and editorial voice alignment."
                },
                {
                  id: "02b-cluster-b",

              duration: null,

              inputs: ["output/articles/*.html"],

              checks: [],
              body: "Append new articles to the existing RSS feed.\n\n```xml\n<item>\n  <title>...</title>\n  <link>...</link>\n  <pubDate>...</pubDate>\n  <description>...</description>\n</item>\n```"
            }
          ]
        }
      ]
    };

    // Markdown renderer (lightweight, no external dep)
    function renderMarkdown(text) {
      if (!text) return '';
      let html = text
        // Code blocks first (before other replacements)
        .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
          `<pre><code class="language-${lang}">${escapeHtml(code.trim())}</code></pre>`)
        // Inline code
        .replace(/`([^`]+)`/g, (_, code) => `<code>${escapeHtml(code)}</code>`)
        // Headings
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        // Bold
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        // Italic
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        // Links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        // Lists
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>\n?)+/g, (match) => '<ul>' + match + '</ul>')
        // Paragraphs
        .replace(/\n\n+/g, '</p><p>')
        // Line breaks
        .replace(/\n/g, '<br>');
      return `<p>${html}</p>`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // SVG icons
    const chevronSVG = `<svg class="hb-task-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5l3.5 3.5-3.5 3.5"/></svg>`;
    const checkSVG = `<svg class="hb-check-icon pass" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6l3 3 5-5"/></svg>`;
    const xSVG = `<svg class="hb-check-icon fail" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l8 8M10 2l-8 8"/></svg>`;

    function renderStatusBadge(status) {
      const labels = { pass: 'Pass', running: 'Running', failed: 'Failed', pending: 'Pending', blocked: 'Blocked' };
      return `<span class="hb-status-badge ${status}">${labels[status] || status}</span>`;
    }

    function renderDuration(duration) {
      return duration ? `<span class="hb-duration">${duration}</span>` : '';
    }

    function renderChecks(checks) {
      if (!checks || checks.length === 0) return '';
      const rows = checks.map(c => {
        const dotClass = c.status === 'pass' ? 'pass' : c.status === 'fail' ? 'fail' : 'pending';
        const icon = c.status === 'pass' ? checkSVG : c.status === 'fail' ? xSVG : '';
        return `<div class="hb-check-row">
          <span class="hb-check-dot ${dotClass}"></span>
          <span>${escapeHtml(c.label)}</span>
          ${icon}
        </div>`;
      }).join('');
      return `<div class="hb-checks">${rows}</div>`;
    }

    function renderIOPills(label, items) {
      if (!items || items.length === 0) return '';
      const pills = items.map(item => `<span class="hb-io-pill">${escapeHtml(item)}</span>`).join('');
      return `<div class="hb-io-row">
        <span class="hb-io-label">${label}:</span>
        <div class="hb-io-pills">${pills}</div>
      </div>`;
    }

    function renderDependsOn(deps) {
      if (!deps || deps.length === 0) return '';
      const links = deps.map(d => `<a class="task-ref" data-task-id="${d}">${d}</a>`).join(', ');
      return `<div class="hb-depends-on">&larr; depends on: ${links}</div>`;
    }

    function renderModeBadge(mode, hasChildren) {
      const icons = {
        gateway: `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="8" rx="1" fill="currentColor"/></svg>`,
        spawner: `<span class="hb-spawner-pulse"></span>`,
        leaf: ''
      };
      const labels = { gateway: 'Gateway', spawner: 'Spawner', leaf: 'Leaf' };
      return `<span class="hb-mode-badge ${mode}">${icons[mode]}${labels[mode]}</span>`;
    }

    function renderTaskCard(task, depth) {
      const indent = depth > 1 ? `data-indent="${depth}"` : '';
      const bodyHTML = task.body ? renderMarkdown(task.body) : '';

      const statusBadge = task.status ? renderStatusBadge(task.status) : '';
      const duration = renderDuration(task.duration);
      const checks = renderChecks(task.checks);
      const inputs = renderIOPills('Inputs', task.inputs);
      const outputs = renderIOPills('Outputs', task.outputs);
      const dependsOn = renderDependsOn(task.dependsOn);
      const modeBadge = renderModeBadge(task.mode, task.children && task.children.length > 0);

      const childrenHTML = task.children ? renderChildren(task.children, depth + 1) : '';

      return `
        <article class="hb-task-card" data-depth="${depth}" data-mode="${task.mode}" data-status="${task.status || ''}" ${indent} id="task-${task.id}">
          <div class="hb-task-title-row" onclick="toggleBody(this)" role="button" tabindex="0"
               onkeydown="if(event.key==='Enter'||event.key===' '){toggleBody(this);event.preventDefault()}">
            <span class="hb-task-title">${escapeHtml(task.title)}</span>
            ${chevronSVG.replace('class="hb-task-chevron"', 'class="hb-task-chevron"')}
          </div>

          ${task.description ? `<p class="hb-task-desc">${escapeHtml(task.description)}</p>` : ''}

          <div class="hb-meta-row">
            ${modeBadge}
            ${statusBadge}
            ${duration}
          </div>

          ${checks}
          ${inputs}
          ${outputs}
          ${dependsOn}

          <div class="hb-task-body" aria-hidden="true">${bodyHTML}</div>

          ${childrenHTML ? `<div class="hb-children">${childrenHTML}</div>` : ''}
        </article>
      `;
    }

    function renderChildren(children, depth) {
      return children.map(child => renderTaskCard(child, depth)).join('');
    }

    function renderGateway(gateway, depth = 1) {
      const childrenHTML = gateway.children ?
        `<div class="hb-gateway-children">${gateway.children.map(c => renderTaskCard(c, depth)).join('')}</div>` : '';

      return `
        <section class="hb-gateway" data-mode="gateway" data-status="${gateway.status || ''}" id="task-${gateway.id}">
          <div class="hb-gateway-header" onclick="toggleGateway(this)" role="button" tabindex="0"
               onkeydown="if(event.key==='Enter'||event.key===' '){toggleGateway(this);event.preventDefault()}">
            <span class="hb-gateway-icon"></span>
            <span class="hb-gateway-title">${escapeHtml(gateway.title)}</span>
            <span class="hb-gateway-chevron open">${chevronSVG.replace('class="hb-task-chevron"', 'class="hb-gateway-chevron open"').replace('open', '')}</span>
          </div>
          ${childrenHTML}
        </section>
      `;
    }

    function renderPlaybook() {
      const content = playbook.gateways.map(g => renderGateway(g)).join('');
      document.getElementById('playbook-content').innerHTML = content;
      updateCounts();
    }

    // Toggle task body expand/collapse
    function toggleBody(titleRow) {
      const card = titleRow.closest('.hb-task-card');
      const body = card.querySelector('.hb-task-body');
      const chevron = titleRow.querySelector('.hb-task-chevron');

      if (body.classList.contains('open')) {
        body.classList.remove('open');
        body.setAttribute('aria-hidden', 'true');
        chevron.classList.remove('open');
      } else {
        body.classList.add('open');
        body.setAttribute('aria-hidden', 'false');
        chevron.classList.add('open');
      }
    }

    // Toggle gateway children
    function toggleGateway(header) {
      const gateway = header.closest('.hb-gateway');
      const chevron = gateway.querySelector('.hb-gateway-chevron');

      if (gateway.classList.contains('collapsed')) {
        gateway.classList.remove('collapsed');
        chevron.classList.add('open');
      } else {
        gateway.classList.add('collapsed');
        chevron.classList.remove('open');
      }
    }

    // Filtering
    let currentFilter = 'all';

    document.querySelectorAll('.hb-pill-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;

        document.querySelectorAll('.hb-pill-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        applyFilter();
      });
    });

    function applyFilter() {
      const cards = document.querySelectorAll('.hb-task-card');
      const gateways = document.querySelectorAll('.hb-gateway');

      cards.forEach(card => {
        const mode = card.dataset.mode;
        const status = card.dataset.status;
        let show = false;

        if (currentFilter === 'all') {
          show = true;
        } else if (currentFilter === 'gateway') {
          show = mode === 'gateway';
        } else if (currentFilter === 'spawner') {
          show = mode === 'spawner';
        } else if (currentFilter === 'leaf') {
          show = mode === 'leaf';
        } else if (currentFilter === 'pass') {
          show = status === 'pass';
        } else if (currentFilter === 'failed') {
          show = status === 'failed';
        }

        card.classList.toggle('hb-filtered-out', !show);
      });

      gateways.forEach(gw => {
        const visibleChildren = gw.querySelectorAll('.hb-task-card:not(.hb-filtered-out)');
        // Always show the gateway header, but collapse children if none visible
        // We just hide/show cards, don't touch gateway visibility
      });

      updateCounts();
    }

    function updateCounts() {
      const allCards = document.querySelectorAll('.hb-task-card');
      const counts = { all: 0, gateway: 0, spawner: 0, leaf: 0, pass: 0, failed: 0 };

      allCards.forEach(card => {
        counts.all++;
        const mode = card.dataset.mode;
        const status = card.dataset.status;
        if (mode) counts[mode] = (counts[mode] || 0) + 1;
        if (status === 'pass') counts.pass++;
        if (status === 'failed') counts.failed++;
      });

      document.getElementById('count-all').textContent = `(${counts.all})`;
      document.getElementById('count-gateway').textContent = `(${counts.gateway})`;
      document.getElementById('count-spawner').textContent = `(${counts.spawner})`;
      document.getElementById('count-leaf').textContent = `(${counts.leaf})`;
      document.getElementById('count-pass').textContent = `(${counts.pass})`;
      document.getElementById('count-failed').textContent = `(${counts.failed})`;
    }

    // Task ref linking
    document.addEventListener('click', (e) => {
      const ref = e.target.closest('.task-ref');
      if (ref) {
        e.preventDefault();
        const targetId = ref.dataset.taskId;
        const target = document.getElementById('task-' + targetId);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.style.boxShadow = '0 0 0 3px rgba(86,69,212,0.3)';
          setTimeout(() => {
            target.style.boxShadow = '';
          }, 1500);
        }
      }
    });

    // Init
    renderPlaybook();
  </script>
