name: product-design
description: Transform a product idea into MVP concept mockups with epic → feature hierarchy

run:
  maxIterations: 200
  maxTaskAttempts: 3
  resume: true
  workers: 3

skills:
  research-synthesis: .converge/playbooks/product-design/skills/research-synthesis/SKILL.md
  epic-decomposition: .converge/playbooks/product-design/skills/epic-decomposition/SKILL.md
  feature-prioritization: .converge/playbooks/product-design/skills/feature-prioritization/SKILL.md
  html-mockup: .converge/playbooks/product-design/skills/html-mockup/SKILL.md

checks:
  - id: epic-coverage
    cmd: bash .converge/playbooks/product-design/scripts/validate-epic-coverage.sh
    description: Every epic has ≥1 feature
  - id: html-structure
    cmd: bash .converge/playbooks/product-design/scripts/validate-html-structure.sh
    description: All design.html files are self-contained with semantic HTML and embedded CSS
  - id: traceability
    cmd: test -f docs/product/TRACEABILITY.md
    description: Traceability document exists
