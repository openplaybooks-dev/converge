<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Identity — CTA — Portfolio Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: #fafaf8;
      --color-text: #1a1a1a;
      --color-text-muted: #6b6b6b;
      --color-accent: #2a2a2a;
      --color-border: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Hero Section ─────────────────────────────── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 4rem 2rem;
      max-width: 720px;
      margin: 0 auto;
    }

    .hero__eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: 1.25rem;
    }

    .hero__name {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--color-text);
      margin-bottom: 1rem;
    }

    .hero__tagline {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 400;
      color: var(--color-text-muted);
      line-height: 1.5;
      max-width: 520px;
      margin-bottom: 2.5rem;
    }

    /* ── CTA Block ───────────────────────────────── */
    .hero__cta {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: flex-start;
    }

    .hero__cta-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    .hero__cta-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-text);
      text-decoration: none;
      border-bottom: 2px solid var(--color-accent);
      padding-bottom: 0.1rem;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .hero__cta-link:hover {
      color: var(--color-text-muted);
      border-color: var(--color-text-muted);
    }

    .hero__cta-link:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .hero__cta-arrow {
      display: inline-block;
      width: 1em;
      height: 1em;
      transition: transform 0.2s ease;
    }

    .hero__cta-link:hover .hero__cta-arrow {
      transform: translateX(4px);
    }

    /* ── Availability Signal ──────────────────────── */
    .hero__availability {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-top: 0.5rem;
    }

    .hero__availability-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #4caf50;
      flex-shrink: 0;
    }

    /* ── Decorative Rule ──────────────────────────── */
    .hero__rule {
      width: 48px;
      height: 2px;
      background-color: var(--color-border);
      margin: 3rem 0;
    }

    /* ── Meta / Footer ────────────────────────────── */
    .hero__meta {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      letter-spacing: 0.05em;
    }

    /* ── Mobile ───────────────────────────────────── */
    @media (max-width: 480px) {
      .hero {
        padding: 3rem 1.5rem;
        justify-content: flex-start;
        padding-top: 6rem;
      }

      .hero__cta {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="Hero — Identity and introduction">
    <p class="hero__eyebrow">Freelance Designer — Available for Projects</p>

    <h1 class="hero__name">Maya Chen</h1>

    <p class="hero__tagline">
      Brand and digital designer crafting quiet, confident identities
      for studios, startups, and independent creators.
    </p>

    <div class="hero__rule" role="presentation" aria-hidden="true"></div>

    <div class="hero__cta">
      <p class="hero__cta-label">View selected work</p>
      <a href="#work" class="hero__cta-link">
        See the portfolio
        <svg class="hero__cta-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

    <div class="hero__availability" aria-label="Currently available for new projects">
      <span class="hero__availability-dot" aria-hidden="true"></span>
      <span>Available for new projects — Q3 2026</span>
    </div>

    <div class="hero__rule" role="presentation" aria-hidden="true"></div>

    <p class="hero__meta">Based in San Francisco — Working globally</p>
  </section>
</body>
</html>
