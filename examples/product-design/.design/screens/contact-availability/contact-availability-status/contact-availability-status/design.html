<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact &amp; Availability — Status Signal — Maya Chen Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: #fafaf8;
      --color-text: #1a1a1a;
      --color-text-muted: #6b6b6b;
      --color-accent: #2a2a2a;
      --color-border: #e0e0e0;
      --color-available: #4caf50;
      --color-available-bg: #e8f5e9;
      --color-available-text: #2e7d32;
      --color-busy: #ff9800;
      --color-busy-bg: #fff3e0;
      --color-busy-text: #e65100;
      --color-unavailable: #ef5350;
      --color-unavailable-bg: #ffebee;
      --color-unavailable-text: #c62828;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Status Signal Component ──────────────────── */
    .status-signal {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background-color: var(--color-surface, #fff);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      max-width: 420px;
    }

    .status-signal__dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 0.3rem;
    }

    .status-signal__content {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .status-signal__label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    .status-signal__status {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--color-text);
    }

    .status-signal__detail {
      font-size: 0.85rem;
      color: var(--color-text-muted);
    }

    /* ── Variants ─────────────────────────────────── */
    .status-signal--available .status-signal__dot {
      background-color: var(--color-available);
    }

    .status-signal--busy .status-signal__dot {
      background-color: var(--color-busy);
    }

    .status-signal--unavailable .status-signal__dot {
      background-color: var(--color-unavailable);
    }

    /* ── Demo Layout ──────────────────────────────── */
    .demo {
      padding: 4rem 2rem;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .demo__row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .demo__caption {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <!--
    ANIMATION NOTE:
    The availability dot pulses subtly when "available".
    Use keyframe animation on .status-signal__dot for the available state.
  -->

  <main class="demo">

    <div class="demo__row">
      <p class="demo__caption">Available — Default</p>
      <div class="status-signal status-signal--available" role="status" aria-label="Currently available for new projects">
        <span class="status-signal__dot" aria-hidden="true"></span>
        <div class="status-signal__content">
          <span class="status-signal__label">Availability</span>
          <span class="status-signal__status">Available for new projects</span>
          <span class="status-signal__detail">Taking on work starting Q3 2026</span>
        </div>
      </div>
    </div>

    <div class="demo__row">
      <p class="demo__caption">Busy — In Project</p>
      <div class="status-signal status-signal--busy" role="status" aria-label="Currently engaged in a project">
        <span class="status-signal__dot" aria-hidden="true"></span>
        <div class="status-signal__content">
          <span class="status-signal__label">Availability</span>
          <span class="status-signal__status">In project — limited capacity</span>
          <span class="status-signal__detail">Returning to availability mid-Q3 2026</span>
        </div>
      </div>
    </div>

    <div class="demo__row">
      <p class="demo__caption">Unavailable</p>
      <div class="status-signal status-signal--unavailable" role="status" aria-label="Currently not accepting new projects">
        <span class="status-signal__dot" aria-hidden="true"></span>
        <div class="status-signal__content">
          <span class="status-signal__label">Availability</span>
          <span class="status-signal__status">Not taking new projects</span>
          <span class="status-signal__detail">Check back in a few months</span>
        </div>
      </div>
    </div>

  </main>
</body>
</html>
