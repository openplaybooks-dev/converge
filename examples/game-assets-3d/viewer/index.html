<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>game-assets-lego — viewer</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0e0e10; color: #ddd; margin: 0; padding: 48px; max-width: 720px; }
  h1 { font-weight: 500; margin: 0 0 4px; }
  p.lead { color: #888; margin: 0 0 32px; }
  h3 { color: #888; font-weight: 500; margin: 32px 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { background: #18181b; border: 1px solid #2a2a2f; border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: baseline; gap: 12px; }
  li a { color: #f0a050; text-decoration: none; font-weight: 600; }
  li a:hover { text-decoration: underline; }
  li small { color: #777; flex: 1; }
  li code.kind { color: #5a8d5e; font-size: 11px; background: transparent; padding: 0; }
  code { background: #2a2a2f; padding: 1px 6px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>
<h1>game-assets-lego</h1>
<p class="lead">Lego-block low-poly library. Catalog entries below — click to open the per-asset inspector.</p>

<div id="catalog"></div>

<p style="margin-top: 32px; color: #555; font-size: 12px;">
  Ports content from
  <a href="https://github.com/1391819/interactive-low-poly-environment" style="color: #888;">interactive-low-poly-environment</a>
  (MIT, © 2022 Roberto Nacu). See <code>NOTICE</code>.
</p>

<script type="module">
  import { listAssets } from '/viewer/src/loader.ts';
  import { listScenes } from '/viewer/src/scene-loader.ts';

  const root = document.getElementById('catalog');

  // Reference: the original upstream demo, vendored verbatim into viewer/upstream/.
  const refH = document.createElement('h3');
  refH.textContent = 'reference';
  root.appendChild(refH);
  const refUl = document.createElement('ul');
  refUl.innerHTML = `
    <li>
      <a href="/viewer/upstream/index.html">Original upstream demo</a>
      <small>1391819/interactive-low-poly-environment, vendored MIT — single composed scene with dat.GUI controls (day/night, fence, fireflies, airplane, …). Cat &amp; Pug glTFs omitted per NOTICE.</small>
      <code class="kind">upstream</code>
    </li>
  `;
  root.appendChild(refUl);

  // Scenes section first — bigger headline.
  const sceneList = listScenes();
  if (sceneList.length > 0) {
    const h = document.createElement('h3');
    h.textContent = 'scenes';
    root.appendChild(h);
    const ul = document.createElement('ul');
    for (const { slug, meta } of sceneList.sort((a, b) => a.slug.localeCompare(b.slug))) {
      const li = document.createElement('li');
      li.innerHTML = `
        <a href="/viewer/scene.html?slug=${slug}">${meta?.name ?? slug}</a>
        <small>${meta?.description ?? ''}</small>
        <code class="kind">scene</code>
      `;
      ul.appendChild(li);
    }
    root.appendChild(ul);
  }

  const groups = new Map();
  for (const { slug, meta } of listAssets()) {
    const archetype = meta?.archetype ?? 'misc';
    if (!groups.has(archetype)) groups.set(archetype, []);
    groups.get(archetype).push({ slug, meta });
  }

  for (const [archetype, items] of [...groups.entries()].sort()) {
    const h = document.createElement('h3');
    h.textContent = archetype;
    root.appendChild(h);
    const ul = document.createElement('ul');
    for (const { slug, meta } of items.sort((a, b) => a.slug.localeCompare(b.slug))) {
      const li = document.createElement('li');
      li.innerHTML = `
        <a href="/viewer/asset.html?slug=${slug}">${meta?.name ?? slug}</a>
        <small>${meta?.description ?? ''}</small>
        <code class="kind">${meta?.kind ?? ''}</code>
      `;
      ul.appendChild(li);
    }
    root.appendChild(ul);
  }
</script>
</body>
</html>
