---
name: default
description: End-to-end Flutter app generation — from idea to production-ready mobile app
run:
  mode: oneoff
  maxIterations: 50
  maxTaskAttempts: 3
tasks:
  - id: 01-prepare-requirements
  - id: 02-design-system
    depends_on:
      - 01-prepare-requirements
  - id: 03-build-screens
    depends_on:
      - 02-design-system
  - id: 05-add-behavior
    depends_on:
      - 03-build-screens
  - id: 06-wire-screens
    depends_on:
      - 05-add-behavior
  - id: 07-build-overlays
    depends_on:
      - 06-wire-screens
goals:
  - id: dart-analyze
    description: dart-analyze
    checks:
      - id: check
        cmd: dart analyze lib/
  - id: has-theme
    description: has-theme
    checks:
      - id: check
        cmd: test -f lib/theme/app_theme.dart
  - id: has-router
    description: has-router
    checks:
      - id: check
        cmd: test -f lib/router/app_router.dart

